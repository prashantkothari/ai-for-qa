/* ---- Release helpers (Part E) --------------------------------------------
   With the run tree gone, every release-level view aggregates its runs.
   These helpers are used by the All Releases list, the Summary tab, and the
   Test Cases tab so counts stay consistent. */
function relByIdx(i){ return RELEASES[i]; }
function relById(id){ return RELEASES.find(r=>r.id===id); }
// aggregate counts across every run in the release, respecting a suite filter
function relCounts(rel, suiteId){
  const c={pass:0,fail:0,block:0,notrun:0};
  rel.runs.forEach(run=>{
    if(suiteId && suiteId!=="all" && run.id!==suiteId) return;
    run.results.forEach(r=>c[r.s]++);
  });
  return c;
}
function relTotal(rel, suiteId){
  const c=relCounts(rel, suiteId);
  return c.pass+c.fail+c.block+c.notrun;
}
function relPassRate(rel, suiteId){
  const c=relCounts(rel, suiteId);
  const tot=c.pass+c.fail+c.block+c.notrun;
  return tot?Math.round(c.pass/tot*100):0;
}
// flat list of every case-run result in a release, one row per execution
function relRows(rel, suiteId){
  const rows=[];
  rel.runs.forEach(run=>{
    if(suiteId && suiteId!=="all" && run.id!==suiteId) return;
    run.results.forEach(r=>rows.push({...r, run}));
  });
  return rows;
}
// feature rollup: for each MODULE_TREE feature, aggregate results in this release
// (case-level latest-run wins, so a case that ran in Smoke + Regression only counts once)
function relFeatureRollup(rel){
  return MODULE_TREE.features.map(feat=>{
    const caseIds=feat.scenarios.flatMap(s=>s.cases);
    const latest={};   // caseId → newest status seen in this release
    rel.runs.forEach(run=>run.results.forEach(r=>{
      if(!caseIds.includes(r.c)) return;
      if(!latest[r.c] || latest[r.c].date < run.lastRun){
        latest[r.c]={status:r.s, date:run.lastRun};
      }
    }));
    const c={pass:0,fail:0,block:0,notrun:0};
    Object.values(latest).forEach(v=>c[v.status]++);
    const touched=Object.keys(latest).length;
    const executed=c.pass+c.fail+c.block;
    return {
      name:feat.name,
      touched,                                    // cases the release actually ran (any status)
      totalCases:caseIds.length,
      counts:c,
      passRate: executed? Math.round(c.pass/executed*100):0,
      status: c.fail?"fail":(c.block?"block":(c.pass?"pass":"notrun")),
    };
  });
}

const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const STATUS_LABEL={pass:"Passed",fail:"Failed",block:"Blocked",notrun:"Not run"};
const PLAT_ICON={web:"🖥",mobile:"📱"};
const initials = n => n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();

// ---- status rollups (shared by tree dots + drawer) -----------------------
// group health precedence: fail > block > pass > notrun
// (a group is green if anything passed and nothing failed/blocked; grey only if nothing has run)
const STATUS_RANK={fail:3,block:2,pass:1,notrun:0};
// all run results for a case, newest-first, with run/release context
function caseHistory(caseId){
  const hist=[];
  RELEASES.forEach(rel=>rel.runs.forEach(run=>{
    const res=run.results.find(r=>r.c===caseId);
    if(res) hist.push({rel,run,status:res.s,defect:res.d||null});
  }));
  return hist.sort((a,b)=>b.run.lastRun.localeCompare(a.run.lastRun));
}
// a case's CURRENT status = its most-recent executed run; "notrun" if never executed
// Abstained cases are treated as "notrun" for rollup — they can't be executed
// against a real oracle until product/compliance answers, so they don't drag
// group health either up or down.
function caseRollupStatus(caseId){
  const tc = CASES[caseId];
  if(tc && tc.abstain) return "notrun";
  const executed=caseHistory(caseId).filter(h=>h.status!=="notrun"); // newest-first
  return executed.length ? executed[0].status : "notrun";
}
// worst status across a set of cases (deprecated cases excluded from health)
function groupStatus(caseIds){
  const active=caseIds.filter(id=>CASES[id] && CASES[id].lifecycle!=="deprecated");
  if(!active.length) return "notrun";
  return active.map(caseRollupStatus)
    .reduce((w,s)=>STATUS_RANK[s]>STATUS_RANK[w]?s:w,"notrun");
}

/* =========================================================================
   TREE RENDERING
   ========================================================================= */
function renderTree(){
  // Only the Module tree is rendered now; release nav is a page (All Releases),
  // not a tree, so there's nothing to draw here for release view.
  const tree = $("#tree"); tree.innerHTML="";
  renderModuleTree(tree);
}

function branch(parentUl, {level, icon, text, count, dot, open, selected, onClick, hasChildren}){
  const li = el("li","node");
  const row = el("div","row"+(selected?" selected":"")+(level==="mod"?" lvl-mod":""));
  const caret = el("span","caret"+(hasChildren?(open?" open":""):" leaf"),"▶");
  row.appendChild(caret);
  if(icon) row.appendChild(el("span","ic",icon));
  if(dot) row.appendChild(el("span","dot "+dot));
  row.appendChild(el("span","rowtext",text));
  if(count!=null) row.appendChild(el("span","count",count));
  li.appendChild(row);
  const kids = el("ul","children"+(open?"":" collapsed"));
  li.appendChild(kids);
  row.addEventListener("click",e=>{
    e.stopPropagation();
    if(hasChildren){ kids.classList.toggle("collapsed"); caret.classList.toggle("open"); }
    if(onClick) onClick();
  });
  parentUl.appendChild(li);
  return kids;
}

function renderModuleTree(tree){
  const m = MODULE_TREE;
  const totalCases = m.features.reduce((n,f)=>n+f.scenarios.reduce((k,s)=>k+s.cases.length,0),0);
  const modKids = branch(tree,{level:"mod",icon:"▦",text:m.name,count:totalCases,open:true,hasChildren:true});
  m.features.forEach((f,fi)=>{
    const fCount=f.scenarios.reduce((k,s)=>k+s.cases.length,0);
    const featOpen = true;
    const fCases=f.scenarios.flatMap(s=>s.cases);
    const featKids = branch(modKids,{level:"feat",icon:"◧",text:f.name,count:fCount,
      dot:groupStatus(fCases),open:featOpen,hasChildren:true});
    f.scenarios.forEach((s,si)=>{
      const sel = STATE.modScenario && STATE.modScenario.f===fi && STATE.modScenario.s===si;
      branch(featKids,{level:"scen",icon:"◦",text:s.name,count:s.cases.length,
        dot:groupStatus(s.cases),selected:sel,hasChildren:false,
        onClick:()=>{ STATE.modScenario={f:fi,s:si}; selectModuleScenario(); }});
    });
  });
}

function runCounts(run){
  const c={pass:0,fail:0,block:0,notrun:0};
  run.results.forEach(r=>c[r.s]++);
  return c;
}

// Regulatory trace tags get typographic color; AC-refs stay neutral.
const REG_TRACES = new Set(["needs-based-selling","suitability","replacement-justification","disclosure"]);
function traceTagsHtml(traces){
  if(!traces || !traces.length) return '<span class="muted">—</span>';
  return '<div class="tracetags">'+traces.map(t=>
    `<span class="tracetag${REG_TRACES.has(t)?' reg':''}">${t}</span>`
  ).join("")+'</div>';
}
function abstainBannerEl(tc){
  const b=el("div","abstain-banner");
  b.innerHTML =
    `<div class="ab-hd">ⓘ Abstain — ${tc.abstain.q}</div>`+

function caseCard(tc, open){
  const card=el("div","card"+(open?" open":""));
  const head=el("div","card-head");
  head.appendChild(el("span","caret","▶"));
  head.appendChild(el("span","cid",tc.id));
  head.appendChild(el("span","ctitle",tc.title));
  if(tc._status){
    head.appendChild(el("span","statuscell "+tc._status,
      `<span class="dot ${tc._status}"></span>${STATUS_LABEL[tc._status]}`));
  }
  head.appendChild(el("span","ctype cat-"+tc.category, tc.category));
  card.appendChild(head);

  const body=el("div","card-body");
  if(tc.abstain){
    body.appendChild(abstainBannerEl(tc));
    const on=el("div","abstain-note","This case is not runnable until the question is resolved.");
    body.appendChild(on);
  } else {
    // steps
    const sb=el("div","step-block");
    sb.appendChild(el("div","lbl","Steps &amp; expected"));
    const ol=el("ol","steps");
    tc.steps.forEach(st=>{
      ol.appendChild(el("li",null,`${st.a} <span class="exp">${st.e}</span>`));
    });
    sb.appendChild(ol); body.appendChild(sb);
    // data chips
    const db=el("div","step-block");
    db.appendChild(el("div","lbl","Test data"));
    const chips=el("div","chips");
    tc.data.forEach(d=>chips.appendChild(el("span","chip",`<span class="k">${d.k}</span><span class="v">${d.v}</span>`)));
    db.appendChild(chips); body.appendChild(db);
  }
  card.appendChild(body);

  head.addEventListener("click",()=>card.classList.toggle("open"));
  return card;
}

function runSummaryEl(rel, run){
  const c=runCounts(run);
  const total=run.results.length;
  const box=el("div","runsummary");
  const left=el("div");
  left.appendChild(el("div","rs-title",`${run.name} · ${rel.name.split("—")[0].trim()}`));
  left.appendChild(el("div","rs-sub",`${run.suite} — suite of ${total} cases`));
  box.appendChild(left);

  const meta=el("div","rs-meta");
  const mk=(k,v)=>{const d=el("div","rs-metaitem");d.appendChild(el("div","k",k));d.appendChild(el("div","v",v));return d;};
  meta.appendChild(mk("Platform",`${PLAT_ICON[run.platform]} ${run.platform}`));
  meta.appendChild(mk("Executed by",run.executedBy));
  meta.appendChild(mk("Last run",run.lastRun));
  // Activity link (audit trail)
  const act=el("button","activity-link","Activity ▾");
  act.addEventListener("click",e=>{e.stopPropagation();openActivityModal();});
  meta.appendChild(act);
  box.appendChild(meta);

  const counts=el("div","counts");
  counts.appendChild(el("span","pill pass",`<span class="dot pass"></span>${c.pass} passed`));
  counts.appendChild(el("span","pill fail",`<span class="dot fail"></span>${c.fail} failed`));
  counts.appendChild(el("span","pill block",`<span class="dot block"></span>${c.block} blocked`));
  if(c.notrun) counts.appendChild(el("span","pill notrun",`<span class="dot notrun"></span>${c.notrun} not run`));
  box.appendChild(counts);

  // rate bar spans full width (own row)
  const bar=el("div","rate-bar");
  const pct=n=>total? (n/total*100):0;
  bar.innerHTML =
    `<span class="s-pass" style="width:${pct(c.pass)}%"></span>`+
    `<span class="s-fail" style="width:${pct(c.fail)}%"></span>`+
    `<span class="s-block" style="width:${pct(c.block)}%"></span>`+
    `<span class="s-notrun" style="width:${pct(c.notrun)}%"></span>`;
  box.appendChild(bar);

  // Smart CTA strip
  const ctas=el("div","cta-strip");
  const b1=el("button","btn","Summarize run");
  b1.addEventListener("click",()=>openSummarizeRunModal(rel,run));
  const b2=el("button","btn","Auto-assign failures");
  b2.addEventListener("click",()=>openAutoAssignModal(rel,run));
  ctas.appendChild(b1); ctas.appendChild(b2);
  box.appendChild(ctas);
  return box;
}

/* ---- LIST (management / execution-tracking) ---- */
// Library (module) list is an authoring view — Platform / Release / Assignee
// columns are execution-tracking noise there, so they only show in the
// Releases › Details list where a run's platform actually matters.
function renderList(){
  const content=$("#content"); content.className="content listmode"; content.innerHTML="";
  const showExecCols = STATE.view==="release";
  const selected = new Set();

  const tools=el("div","tabletools");
  const filterBtn=el("button","btn","⚙ Filters");
  filterBtn.addEventListener("click",()=>toast("Filters (mock)"));
  tools.appendChild(filterBtn);
  tools.appendChild(el("div","spacer"));
  // Add Test Case + Suggestions live together in the Library list only —
  // the Releases › Details test-case list has no scenario to add/suggest into.
  if(!showExecCols){
    const {f,s}=STATE.modScenario;
    const scen=MODULE_TREE.features[f].scenarios[s];
    const addBtn=el("button","btn","+ Add Test Case");
    addBtn.addEventListener("click",()=>openAddTestCaseModal(scen));
    tools.appendChild(addBtn);
    const suggestBtn=el("button","btn","✨ Suggestions");
    suggestBtn.addEventListener("click",()=>openSuggestEdgeCasesModal(scen));
    tools.appendChild(suggestBtn);
  }
  const runBtn=el("button","btn btn-primary","Create Test Run");
  runBtn.disabled=true;
  runBtn.addEventListener("click",()=>{
    if(!selected.size) return;
    openCreateTestRunModal(selected.size);
  });
  tools.appendChild(runBtn);
  content.appendChild(tools);

  function updateRunBtn(){
    runBtn.disabled = selected.size===0;
    runBtn.textContent = selected.size ? `Create Test Run (${selected.size})` : "Create Test Run";
  }

  const wrap=el("div","tablewrap");
  const table=el("table"); if(!showExecCols) table.className="compact";
  table.innerHTML=`<thead><tr>
    <th class="chk"><input type="checkbox" id="selectAllCases"></th>
    <th>ID</th><th>Type</th><th>Test case</th><th>Manual / Auto</th>`+
    (showExecCols?`<th>Platform</th><th>Release / Sprint</th><th>Assignee</th>`:``)+
    `<th>Last run</th><th>Status</th>
  </tr></thead>`;
  const tb=el("tbody");

  const rows = listRows();
  rows.forEach(r=>{
    const tr=el("tr");
    tr.style.cursor="pointer";
    tr.addEventListener("click",(ev)=>{
      if(ev.target.closest(".chk-box-cell")) return;
      const trig=ev.target.closest(".rowmenu-trigger");
      if(trig){ ev.stopPropagation(); openRowMenu(trig, r.key, r.runId); return; }
      openDrawer(r.key, r.runId);
    });
    // Status cell: abstain wins over notrun/other; else normal status label.
    // Failed cases get a ⋯ mini-menu (Explain failure / Create defect / Retry).
    const rowMenu = (r.status==="fail")
      ? `<button class="rowmenu-trigger" data-menu-case="${r.key}" title="Actions">⋯</button>` : "";
    const statusCell = `<span class="statuscell ${r.status}"><span class="dot ${r.status}"></span>${STATUS_LABEL[r.status]}${rowMenu}</span>`;
    const lastRunDate = r.lastRun==="—" ? "—" : r.lastRun.split(" ")[0];
    tr.innerHTML=
      `<td class="chk-box-cell"><input type="checkbox" class="case-chk" data-case="${r.key}"></td>`+
      `<td class="id">${r.id}</td>`+
      `<td><span class="ctype cat-${r.category}">${r.category}</span></td>`+
      `<td class="name">${r.title}</td>`+
      `<td><span class="mini ${r.exec}">${r.exec==="auto"?"Auto":"Manual"}</span></td>`+
      (showExecCols
        ? `<td><span class="platcell"><span class="pic">${PLAT_ICON[r.platform]}</span>${r.platform}</span></td>`+
          `<td>${r.release}</td>`+
          `<td><span class="assignee"><span class="avatar">${initials(r.assignee)}</span>${r.assignee}</span></td>`
        : ``)+
      `<td class="${lastRunDate==="—"?"muted":""}">${lastRunDate}</td>`+
      `<td>${statusCell}</td>`;
    tb.appendChild(tr);
    const cb=tr.querySelector(".case-chk");
    cb.addEventListener("click",e=>e.stopPropagation());
    cb.addEventListener("change",e=>{
      if(e.target.checked) selected.add(r.key); else selected.delete(r.key);
      selectAll.checked = selected.size>0 && selected.size===rows.length;
      updateRunBtn();
    });
  });
  table.appendChild(tb);
  wrap.appendChild(table);
  content.appendChild(wrap);

  const selectAll = table.querySelector("#selectAllCases");
  selectAll.addEventListener("click",e=>e.stopPropagation());
  selectAll.addEventListener("change",e=>{
    tb.querySelectorAll(".case-chk").forEach(cb=>{
      cb.checked = e.target.checked;
      if(e.target.checked) selected.add(cb.dataset.case); else selected.delete(cb.dataset.case);
    });
    updateRunBtn();
  });
}

function listRows(){
  // Module (Library) list only — release views build their own row lists.
  const {f,s}=STATE.modScenario;
  const scen=MODULE_TREE.features[f].scenarios[s];
  return scen.cases.map(id=>{
    const tc=CASES[id];
    // find latest run touching this case for status/platform/lastrun
    let latest=null, relId=CASE_RELEASE[id]||"—";
    RELEASES.forEach(rel=>rel.runs.forEach(run=>{
      const hit=run.results.find(x=>x.c===id && x.s!=="notrun");
      if(hit && (!latest || run.lastRun>latest.lastRun)) latest={...hit,platform:run.platform,lastRun:run.lastRun,runId:run.id};
    }));
    return {key:id,runId:latest?latest.runId:null,id:tc.id,category:tc.category,title:tc.title,exec:tc.exec,
      platform:latest?latest.platform:"web",release:relId,assignee:tc.assignee,
      lastRun:tc.abstain?"—":(latest?latest.lastRun:"—"),
      status:tc.abstain?"notrun":(latest?latest.s:"notrun"),
      abstain:tc.abstain||null};
  });
}

/* =========================================================================
   PART C — PRIMARY NAV (Home / Test Cases / Releases) + APP-LEVEL RENDER
   -------------------------------------------------------------------------
   The old Module/Release toggle is gone — grouping is now implied by which
   primary-nav section you're in. Test Cases > Library groups by module;
   Releases > Details groups by release. Test Cases > Insights, Releases >
   Insights, and Home don't need the case tree, so it's hidden for those.
   ========================================================================= */
function updatePrimaryNavActive(){
  document.querySelectorAll(".pnav-item").forEach(b=>{
    b.classList.toggle("active", b.dataset.section===STATE.section);
  });
  document.querySelectorAll(".pnav-subitem").forEach(b=>{
    b.classList.toggle("active", b.dataset.section===STATE.section && b.dataset.sub===STATE.subview);
  });
}

function renderApp(){
  // Testcraft view: fullscreen overlay above v3's chrome. Escape hatch back to Atto.
  const existingTc = document.getElementById("tcRoot");
  if(STATE.testcraft){
    if(!existingTc){
      const root = renderTestcraftView();
      document.body.appendChild(root);
      tcInit(root);
      if(window.lucide) lucide.createIcons();
    }
    return;
  } else if(existingTc){
    existingTc.remove();
  }
  updatePrimaryNavActive();
  setReleaseBreadcrumb();

  document.body.classList.toggle("section-home", STATE.section==="home");

  // Left tree only shows for Test Cases › Library (module view). The release
  // list/drill-in lives entirely in the main pane now — no second nav.
  const showTree = (STATE.section==="testcases" && STATE.subview==="library");
  const isAtto = STATE.section==="atto";
  const isReleasesDetails = STATE.section==="releases" && STATE.subview==="details";
  const secondNavPresent = showTree || isAtto;

  // AI chat pane: auto-collapse when entering Releases; restore when leaving.
  // "chatAutoCollapsed" remembers we did it so we don't fight a user's explicit choice.
  if(STATE.section==="releases" && !$("#chatPane").classList.contains("collapsed")){
    $("#chatPane").classList.add("collapsed");
    $("#chatReopen").style.display = "";
    STATE.chatAutoCollapsed = true;
  } else if(STATE.section!=="releases" && STATE.chatAutoCollapsed){
    $("#chatPane").classList.remove("collapsed");
    $("#chatReopen").style.display = "none";
    STATE.chatAutoCollapsed = false;
  }

  $("#treeNav").classList.toggle("hidden", !secondNavPresent || STATE.treeCollapsed);
  $("#treeReopen").style.display = (secondNavPresent && STATE.treeCollapsed) ? "" : "none";
  $("#treeReopen").textContent = isAtto ? "View Chats" : "»";
  $("#treeReopen").classList.toggle("labelled", isAtto);
  // Main tabs (Detail/List, now Summary/Test Cases inside Releases) only shown
  // for Library, or for the drilled-in release view.
  $("#maintabs").style.display = (showTree || (isReleasesDetails && STATE.releaseId)) ? "" : "none";
  $("#tree").style.display = showTree ? "" : "none";
  $("#chatList").style.display = isAtto ? "" : "none";

  if(showTree){
    STATE.view = "module";
    $("#navheadTitle").textContent = "Module > Feature > Scenarios";
    $("#maintabs").classList.add("no-tabs");
    if(!STATE.modScenario) STATE.modScenario={f:0,s:0};
    renderTree();
    render();
  } else if(isAtto){
    $("#navheadTitle").textContent = "Atto AI";
    renderChatList();
    renderAtto();
  } else if(isReleasesDetails){
    STATE.view = "release";
    $("#maintabs").classList.remove("no-tabs");
    updateReleasesTabs();
    if(STATE.releaseId){
      renderReleaseDetails();
    } else {
      renderAllReleases();
    }
  } else {
    renderBlankSection();
  }
  // Convert any freshly-inserted <i data-lucide="..."> placeholders from this
  // render pass into inline SVGs (icons added via innerHTML need re-conversion
  // every time, unlike the static nav icons which only need it once on load).
  if(window.lucide) lucide.createIcons();
}

// Swap the tab labels between Module (Detail/List) and Release (Summary/Test Cases),
// and also sync the active-underline to STATE.tab so it doesn't drift when we set the
// tab programmatically (e.g. after clicking a release row or a feature-coverage row).
function updateReleasesTabs(){
  const labels = STATE.section==="releases"
    ? {detail:"Summary", list:"Test Cases"}
    : {detail:"Detail",  list:"List"};
  document.querySelectorAll(".tab").forEach(t=>{
    t.textContent = labels[t.dataset.tab] || t.textContent;
    t.classList.toggle("active", t.dataset.tab===STATE.tab);
  });
}

function setReleaseBreadcrumb(){
  const bc = $("#relBreadcrumb");

/* ---- Plan buckets — real runs + synthetic Feature/Deep-Regression mocks ---- */
function getPlanBuckets(rel){
  const findRun = (prefix)=>rel.runs.find(r=>r.name.toLowerCase().startsWith(prefix.toLowerCase()));
  const featureOf = (caseId)=>{
    const f = MODULE_TREE.features.find(feat=>feat.scenarios.some(s=>s.cases.includes(caseId)));
    return f? f.name : "General";
  };
  const suitesFromRun = (run, planType)=>{
    const byFeat={};
    run.results.forEach(r=>{
      const f=featureOf(r.c);
      if(!byFeat[f]) byFeat[f]={feature:f,platform:run.platform,tests:0,pass:0,fail:0,untested:0,block:0};
      byFeat[f].tests++;
      if(r.s==="pass") byFeat[f].pass++;
      else if(r.s==="fail") byFeat[f].fail++;
      else if(r.s==="block"){ byFeat[f].block++; byFeat[f].untested++; }
      else byFeat[f].untested++;
    });
    return Object.values(byFeat).map(s=>({...s,planType,runId:run.id}));
  };
  const humanRel = (ts)=>{
    if(!ts) return "recent";
    // Rough relative — mock only. Just return a friendly label based on trailing pattern.
    const m=ts.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(!m) return "recent";
    return m[3]+" "+m[2]+" · "+ts.slice(11,16);
  };
  const readinessOf = (pass)=> pass>=85?"Ready":(pass<60?"Not ready":"Partial");
  const c=relCounts(rel);
  const totalTests=relTotal(rel);
  const passRateOverall=relPassRate(rel);

  const smokeRun = findRun("Smoke");
  const regRun   = findRun("Regression");

  // ---- Smoke ----
  let smoke;
  if(smokeRun){
    const rc=runCounts(smokeRun); const t=smokeRun.results.length;
    const pr = t? Math.round(rc.pass/t*100):0;
    smoke={
      name:"Smoke", planType:"Smoke", auto:true,
      description:`Critical-path check — P0 & high-risk cases. ${t} cases · run on ${smokeRun.platform}.`,
      passRate:pr, testsRun:t,
      confidence: Math.max(0,pr-2), confidenceSub: rc.fail? `${rc.fail} flaky · click to fix` : "clean",
      readiness: readinessOf(pr), blockers: rc.fail+rc.block,
      lastRunRelative: humanRel(smokeRun.lastRun), platform: smokeRun.platform,
      suites: suitesFromRun(smokeRun,"Smoke"),
    };
  }else{
    // synthesize a tight smoke off overall pool
    const t = Math.max(7, Math.round(totalTests*0.15));
    const pr = Math.min(100, passRateOverall+5);
    smoke={
      name:"Smoke", planType:"Smoke", auto:true,
      description:`Critical-path check — P0 & high-risk cases. ${t} cases · quick check on ${rel.runs[0]?.platform||"web"}.`,
      passRate:pr, testsRun:t, confidence:pr, confidenceSub:"clean",
      readiness:readinessOf(pr), blockers:0,
      lastRunRelative:"3h ago", platform:rel.runs[0]?.platform||"web",
      suites:[{feature:"Happy paths",platform:rel.runs[0]?.platform||"web",tests:t,pass:Math.round(t*pr/100),fail:0,untested:t-Math.round(t*pr/100),planType:"Smoke"}],
    };
  }

  // ---- Regression ----
  let regression;
  if(regRun){
    const rc=runCounts(regRun); const t=regRun.results.length;
    const pr = t? Math.round(rc.pass/t*100):0;
    regression={
      name:"Regression", planType:"Regression", auto:true,
      description:`Full sub-flow sweep across the release scope. ${t} cases · ${rc.fail} failed · ${rc.notrun} not run.`,
      passRate:pr, testsRun:t,
      confidence: Math.max(0,pr-4), confidenceSub: rc.fail>1? `${rc.fail} flaky · click to fix` : (rc.fail? "1 flaky · click to fix":"clean"),
      readiness: readinessOf(pr), blockers: rc.fail+rc.block,
      lastRunRelative: humanRel(regRun.lastRun), platform: regRun.platform,
      suites: suitesFromRun(regRun,"Regression"),
    };
  }else{
    const t = Math.max(20, Math.round(totalTests*0.9));
    const pr = passRateOverall;
    regression={
      name:"Regression", planType:"Regression", auto:true,
      description:`Full sub-flow sweep. ${t} cases · ${rel.runs[0]?.platform||"web"}.`,
      passRate:pr, testsRun:t, confidence:Math.max(0,pr-4), confidenceSub:"clean",
      readiness:readinessOf(pr), blockers:0,
      lastRunRelative:"1d ago", platform:rel.runs[0]?.platform||"web",
      suites:[{feature:"Full regression pool",platform:rel.runs[0]?.platform||"web",tests:t,pass:Math.round(t*pr/100),fail:0,untested:t-Math.round(t*pr/100),planType:"Regression"}],
    };
  }

  // ---- Feature (synthesized off Regression, ~60% cases, slightly worse pass rate) ----
  const featBase = regression;
  const featTests = Math.max(6, Math.round(featBase.testsRun*0.6));
  const featPr = Math.max(0, featBase.passRate - 6);
  const featFail = Math.max(1, Math.round(featTests*(1-featPr/100)*0.5));
  const featNr = Math.max(0, featTests - Math.round(featTests*featPr/100) - featFail);
  // pick top 2-3 features from regression suites for mock rows
  const featSuiteBases = (featBase.suites||[]).slice(0,3);
  const featSuites = featSuiteBases.length
    ? featSuiteBases.map(s=>({
        feature:s.feature, platform:s.platform,
        tests:Math.max(3,Math.round(s.tests*0.6)),
        pass:Math.round(s.tests*0.6*featPr/100),
        fail:Math.max(0,Math.round(s.tests*0.6*(1-featPr/100)*0.5)),
        untested:Math.max(0,Math.round(s.tests*0.6*(1-featPr/100)*0.5)),
        planType:"Feature"
      }))
    : [{feature:"New scope",platform:featBase.platform,tests:featTests,pass:Math.round(featTests*featPr/100),fail:featFail,untested:featNr,planType:"Feature"}];
  const feature={
    name:"Feature", planType:"Feature", auto:true,
    description:`Deep-dive on this sprint's new scope. ${featTests} cases · fresh coverage on changed sub-flows.`,
    passRate:featPr, testsRun:featTests,
    confidence:Math.max(0,featPr-3), confidenceSub: featFail>1? `${featFail} flaky · click to fix`:"1 flaky · click to fix",
    readiness:readinessOf(featPr), blockers:featFail,
    lastRunRelative:"5h ago", platform:featBase.platform,
    suites:featSuites,
  };

  // ---- Deep Regression (synthesized cross-sprint pool, ~90% pass rate, larger) ----
  const dpTests = Math.max(80, Math.round((regression.testsRun||30)*2.2));
  const dpPr = 90;
  const dpFail = Math.round(dpTests*(1-dpPr/100)*0.4);
  const dpPass = Math.round(dpTests*dpPr/100);
  const dpNr = dpTests - dpPass - dpFail;
  const dpPlat = regression.platform;
  const deep={
    name:"Deep Regression", planType:"Deep Regression", auto:true,
    description:`Cross-sprint stability pool. ${dpTests} cases · nightly cadence · covers historically flaky areas.`,
    passRate:dpPr, testsRun:dpTests,
    confidence:dpPr-1, confidenceSub: dpFail? `${dpFail} flaky · click to fix`:"clean",
    readiness:readinessOf(dpPr), blockers:dpFail,
    lastRunRelative:"2h ago", platform:dpPlat,
    suites:[
      {feature:"Historical flake pool",platform:dpPlat,tests:Math.round(dpTests*0.45),pass:Math.round(dpPass*0.45),fail:Math.round(dpFail*0.5),untested:Math.round(dpNr*0.45),planType:"Deep Regression"},
      {feature:"Long-tail regressions",platform:dpPlat,tests:Math.round(dpTests*0.35),pass:Math.round(dpPass*0.35),fail:Math.round(dpFail*0.3),untested:Math.round(dpNr*0.35),planType:"Deep Regression"},
      {feature:"Cross-release invariants",platform:dpPlat,tests:Math.round(dpTests*0.20),pass:Math.round(dpPass*0.20),fail:Math.round(dpFail*0.2),untested:Math.round(dpNr*0.20),planType:"Deep Regression"},
    ],
  };

  return [smoke, feature, regression, deep];
}

/* ---- B. Test Plans & Execution ---- */
function releasePlansSection(rel){
  const buckets = getPlanBuckets(rel);
  const box=el("div","rls-plans");
  const tabLabels = [
    {dot:"var(--pass)"},
    {dot:"var(--teal)"},
    {dot:"var(--block)"},
    {dot:"#7a5cd6"},
  ];
  box.innerHTML=
    `<div class="rls-plans-title">Test Plans &amp; Execution</div>`;
  const tabs=el("div","rls-tabs");
  const body=el("div","rls-plans-body");
  let active=0;
  const renderBody=()=>{
    body.innerHTML="";
    const p=buckets[active];
    // tiles
    const tiles=el("div","rls-tiles");
    const prCls = p.passRate>=85?"pass":(p.passRate<60?"fail":"warn");
    const cCls  = p.confidence>=85?"pass":(p.confidence<60?"fail":"warn");
    const rdCls = p.readiness==="Ready"?"pass":(p.readiness==="Not ready"?"fail":"warn");
    const tile=(k,v,vCls,sub)=>{
      const t=el("div","rls-tile");
      t.innerHTML=`<div class="rls-tile-k">${k}</div><div class="rls-tile-v ${vCls||""}">${v}</div><div class="rls-tile-sub">${escapeHtml(sub)}</div>`;
      return t;
    };
    tiles.appendChild(tile("Pass Rate", p.passRate+"%", prCls, p.testsRun+" tests run"));
    tiles.appendChild(tile("Confidence", p.confidence+"%", cCls, p.confidenceSub));
    tiles.appendChild(tile("Readiness", p.readiness, rdCls, p.blockers+" blocker"+(p.blockers===1?"":"s")));
    tiles.appendChild(tile("Last run", p.lastRunRelative, "", p.platform));
    body.appendChild(tiles);

    // plan card
    const card=el("div","rls-plan-card");
    const head=el("div","rls-plan-head");
    head.innerHTML=
      `<div class="rls-plan-title">${escapeHtml(rel.id)} <span style="color:var(--ink-3);font-weight:500;">|</span> ${escapeHtml(p.planType)} Testing`+
        (p.auto?` <span class="rls-auto-badge">+ Auto Generated</span>`:"")+
      `</div>`+
      `<button class="rls-add-btn">Add cases</button>`;
    card.appendChild(head);
    const desc=el("div","rls-plan-desc",escapeHtml(p.description));
    card.appendChild(desc);
    const suites=el("div","rls-suites");
    (p.suites||[]).forEach(s=>{
      const row=el("div","rls-suite-row");
      row.title="Open this suite in Test Cases";
      row.innerHTML=
        `<div class="rls-suite-left">`+
          `<div class="rls-suite-name">${escapeHtml(p.planType)} · ${escapeHtml(s.feature)}</div>`+
          `<div class="rls-suite-meta">${(PLAT_ICON[s.platform]||"")} ${escapeHtml(String(s.platform||"").toUpperCase())} · ${s.tests} tests</div>`+
        `</div>`+
        `<div class="rls-suite-counts">`+
          `<span class="rls-c-pass">${s.pass} pass</span> / `+
          `<span class="rls-c-fail">${s.fail} fail</span> / `+
          `<span class="rls-c-nr">${s.untested} untested</span>`+
        `</div>`;
      row.addEventListener("click",()=>{
        if(s.runId){
          STATE.tab="list"; STATE.suiteFilter=s.runId; STATE.featureFilter=null;
        }else{
          STATE.tab="list"; STATE.suiteFilter="all"; STATE.featureFilter=s.feature;
        }
        document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab==="list"));
        renderApp();
      });
      suites.appendChild(row);
    });
    card.appendChild(suites);
    body.appendChild(card);
  };
  buckets.forEach((p,i)=>{
    const tab=el("div","rls-tab"+(i===active?" active":""));
    tab.innerHTML=`<span class="rls-dot" style="background:${tabLabels[i].dot};"></span>`+
      `<span>${escapeHtml(p.name)}</span>`;
    tab.addEventListener("click",()=>{
      active=i;
      Array.from(tabs.children).forEach((c,j)=>c.classList.toggle("active",j===active));
      renderBody();
    });
    tabs.appendChild(tab);
  });
  box.appendChild(tabs);
  box.appendChild(body);
  renderBody();
  return box;
}

/* ---- Release Gate + Quality metrics + Confidence + Recommended tests ----
   Adapted from the "quality insights layer" session's qi-dashboard.html §2
   (Release tab): verdict block, 4-card quality grid, confidence waterfall,
   recommended-tests table. Re-themed to white cards on this design system's
   palette instead of the source's cream/olive theme. */
function releaseGateCard(rel){
  const g = QUALITY_GATES[rel.id]; if(!g) return el("div");
  const box=el("div","rel-card gate-block "+g.verdict);
  const top=el("div","gate-top");
  top.innerHTML=`<span class="gate-pill ${g.verdict}">Release Gate · ${g.verdictLabel}</span>`+
    `<div class="gate-headline">${escapeHtml(g.headline)}</div>`;
  box.appendChild(top);
  const ul=el("ul");
  g.rules.forEach(r=>ul.appendChild(el("li",null,r)));
  box.appendChild(ul);
  box.appendChild(el("div","gate-why",
    `Overall confidence score: <b>${g.confidence} / 100</b> — shown for context. The rules above are the source of truth for the ship decision.`));
  return box;
}

function releaseQualityMetricsCard(rel){
  const g = QUALITY_GATES[rel.id]; if(!g) return el("div");

    g.regressionDuration, "min · full run", g.suiteSub));

function releaseTestRunCard(rel){
  const box=el("div","rel-card");
  const c=relCounts(rel), total=relTotal(rel), pct=relPassRate(rel);
  box.innerHTML=`<div class="rc-title">Test run status <span class="rc-sub">· ${total} results across ${rel.runs.length} suite${rel.runs.length===1?"":"s"} · ${pct}% pass</span></div>`;
  // headline counts (no combined bar — per-suite counts + bars below are sufficient)
  const counts=el("div","counts");
  counts.innerHTML=
    `<span class="pill pass"><span class="dot pass"></span>${c.pass} passed</span>`+
    `<span class="pill fail"><span class="dot fail"></span>${c.fail} failed</span>`+
    `<span class="pill block"><span class="dot block"></span>${c.block} blocked</span>`+
    (c.notrun?`<span class="pill notrun"><span class="dot notrun"></span>${c.notrun} not run</span>`:"");
  counts.style.gap="8px"; counts.style.marginLeft="0";
  box.appendChild(counts);
  // per-suite strip
  const strip=el("div","suites-strip");
  rel.runs.forEach(run=>{
    const rc=runCounts(run);
    const rTotal=run.results.length;
    const rPct=rTotal?Math.round(rc.pass/rTotal*100):0;
    const row=el("div","suite-row");
    row.title="Open this suite in Test Cases";
    row.innerHTML=
      `<div class="s-name">${escapeHtml(run.name)}</div>`+
      `<div class="s-meta">${PLAT_ICON[run.platform]} ${run.platform} · ${escapeHtml(run.executedBy)} · ${escapeHtml(run.lastRun)}</div>`+

/* ---- Test Cases tab: suite chip filter + aggregated rows ---- */
function renderReleaseTestCases(rel){
  const content=$("#content"); content.className="content listmode"; content.innerHTML="";

  // Suite chip filter + optional feature filter tag
  const chips=el("div","suite-chips");
  chips.appendChild(el("span","sc-lbl","Suite"));
  const mk=(id,label)=>{
    const b=el("button","suite-chip"+(STATE.suiteFilter===id?" active":""),escapeHtml(label));
    b.addEventListener("click",()=>{ STATE.suiteFilter=id; renderReleaseTestCases(rel); });
    return b;
  };
  chips.appendChild(mk("all","All ("+relTotal(rel)+")"));
  rel.runs.forEach(run=>chips.appendChild(mk(run.id, run.name+" ("+run.results.length+")")));
  if(STATE.featureFilter){
    const ff=el("span","feat-filter");
    ff.innerHTML=`Feature: <b>${escapeHtml(STATE.featureFilter)}</b> <button class="ff-x" title="Clear feature filter">✕</button>`;
    ff.querySelector(".ff-x").addEventListener("click",()=>{ STATE.featureFilter=null; renderReleaseTestCases(rel); });
    chips.appendChild(ff);
  }
  content.appendChild(chips);

  // Filter rows by suite + optional feature
  let rows = relRows(rel, STATE.suiteFilter);
  if(STATE.featureFilter){
    const feat=MODULE_TREE.features.find(f=>f.name===STATE.featureFilter);
    const caseIds = feat ? feat.scenarios.flatMap(s=>s.cases) : [];
    rows = rows.filter(r=>caseIds.includes(r.c));
  }

  const showSuiteCol = STATE.suiteFilter==="all";
  const wrap=el("div","tablewrap");
  const table=el("table");
  table.innerHTML=`<thead><tr>
    <th>ID</th><th>Type</th><th>Test case</th>`+
    (showSuiteCol?`<th>Suite</th>`:``)+
    `<th>Manual / Auto</th><th>Platform</th><th>Last run</th><th>Status</th>
  </tr></thead>`;
  const tb=el("tbody");
  rows.forEach(r=>{
    const tc=CASES[r.c]; if(!tc) return;
    const tr=el("tr"); tr.style.cursor="pointer";
    tr.addEventListener("click",(ev)=>{
      const trig=ev.target.closest(".rowmenu-trigger");
      if(trig){ ev.stopPropagation(); openRowMenu(trig, r.c, r.run.id); return; }
      openDrawer(r.c, r.run.id);
    });
    const rowMenu = (r.s==="fail")
      ? `<button class="rowmenu-trigger" data-menu-case="${r.c}" title="Actions">⋯</button>` : "";
    const lastRun = (r.s==="notrun"||tc.abstain) ? "—" : r.run.lastRun;
    const statusCell = `<span class="statuscell ${r.s}"><span class="dot ${r.s}"></span>${STATUS_LABEL[r.s]}${rowMenu}</span>`;
    tr.innerHTML=
      `<td class="id">${tc.id}</td>`+
      `<td><span class="ctype cat-${tc.category}">${tc.category}</span></td>`+
      `<td class="name">${tc.title}</td>`+
      (showSuiteCol?`<td>${escapeHtml(r.run.name)}</td>`:``)+
      `<td><span class="mini ${tc.exec}">${tc.exec==="auto"?"Auto":"Manual"}</span></td>`+
      `<td><span class="platcell"><span class="pic">${PLAT_ICON[r.run.platform]}</span>${r.run.platform}</span></td>`+
      `<td class="${lastRun==="—"?"muted":""}">${lastRun}</td>`+
      `<td>${statusCell}</td>`;
    tb.appendChild(tr);
  });
  if(!rows.length){
    const tr=el("tr");
    tr.innerHTML=`<td colspan="${showSuiteCol?8:7}" class="muted" style="text-align:center;padding:24px;">No cases match this filter.</td>`;
    tb.appendChild(tr);
  }
  table.appendChild(tb);
  wrap.appendChild(table);
  content.appendChild(wrap);
}

function createAttoChat(prompt, sources){
  const drafts = ATTO_MOCK_DRAFTS.map(d=>({...d}));
  const srcLabel = sources.length ? sources[0].split(" ")[1] : null; // e.g. "Figma"
  const chat = {
    id:"ch"+(++ATTO_SEQ),
    title: prompt.length>52 ? prompt.slice(0,51)+"…" : prompt,
    when:"Today", source:srcLabel,
    messages:[
      {role:"user", text:escapeHtml(prompt), src:sources.length?sources.join(" · "):null},
      {role:"bot", text:`I drafted <b>${drafts.length} test cases</b>. Review and add the ones you want to the Library.`, drafts},
    ]
  };
  ATTO_CHATS.unshift(chat);
  STATE.activeChat=chat.id;
  renderApp();
  toast(`Atto drafted ${drafts.length} cases (mock)`);
}

function attoConversationEl(chat){
  const w=el("div","atto-convo");
  if(!chat){ w.appendChild(el("div","muted","Chat not found.")); return w; }
  chat.messages.forEach(m=>{
    const row=el("div","atto-msg "+(m.role==="user"?"user":"bot"));
    row.appendChild(el("div","am-av",m.role==="user"?"U":"⚡"));
    const body=el("div","am-body");
    let html="";
    if(m.src) html+=`<div class="muted" style="font-size:11px;margin-bottom:4px;">attached: ${escapeHtml(m.src)}</div>`;
    html+=m.text;
    body.innerHTML=html;
    if(m.drafts && m.drafts.length){
      const dl=el("div","atto-draftlist");
      m.drafts.forEach(d=>dl.appendChild(attoDraftEl(d)));
      body.appendChild(dl);
    }
    row.appendChild(body);
    w.appendChild(row);
  });
  // follow-up composer (mock)
  const comp=el("div","atto-composer"); comp.style.marginTop="18px";
  comp.innerHTML=
    `<textarea placeholder="Ask a follow-up or refine the drafts…"></textarea>`+
    `<div class="ac-foot"><span class="muted" style="font-size:11.5px;">Atto keeps sources from this chat</span>`+
    `<button class="ac-gen" id="attoFollow">Send</button></div>`;
  comp.querySelector("#attoFollow").addEventListener("click",()=>toast("Follow-up sent (mock)"));
  w.appendChild(comp);
  return w;
}

      body.appendChild(head);
      const tw=el("div","dcm-tablewrap"); tw.style.maxHeight="none"; tw.style.marginTop="14px";
      tw.innerHTML=`<table><thead><tr><th>Test</th><th>Flake Score</th><th>Last-10 Flips</th><th>Signal</th><th>Suggested Action</th></tr></thead><tbody>`+
        FLAKY_INSIGHT_ROWS.map(r=>`<tr><td>${escapeHtml(r.test)}</td><td>${r.score.toFixed(2)}</td><td>${r.flips}</td>`+
          `<td>${insightSignalPill(r.signal)}</td><td>${escapeHtml(r.action)}</td></tr>`).join("")+
        `</tbody></table>`;
      body.appendChild(tw);
    } else {
      const head=el("div","allrel-head");
      head.innerHTML=`<h2>Machine matrix — cross-platform pass/fail, last run</h2>`+
        `<p>Consistent divergence across machines is a platform-bug signal, not a flakiness event.</p>`;
      body.appendChild(head);
      const tw=el("div","dcm-tablewrap"); tw.style.maxHeight="none"; tw.style.marginTop="14px";
      tw.innerHTML=`<table><thead><tr><th>Test × latest run</th><th>Chrome</th><th>Safari</th><th>iOS</th><th>Android</th></tr></thead><tbody>`+
        MACHINE_MATRIX_ROWS.map(r=>`<tr><td>${escapeHtml(r.test)}</td><td>${matrixCellHtml(r.chrome)}</td>`+
          `<td>${matrixCellHtml(r.safari)}</td><td>${matrixCellHtml(r.ios)}</td><td>${matrixCellHtml(r.android)}</td></tr>`).join("")+
        `</tbody></table>`;
      body.appendChild(tw);
    }
  }
  TABS.forEach((t,i)=>{
    const b=el("button","rls-tab"+(i===active?" active":""),t.label);
    b.addEventListener("click",()=>{
      active=i;
      Array.from(tabsEl.children).forEach((c,j)=>c.classList.toggle("active",j===active));
      renderBody();
    });
    tabsEl.appendChild(b);
  });
  wrap.appendChild(tabsEl);
  wrap.appendChild(body);
  renderBody();
  return wrap;
}

function escHtml(s){ return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }

// Lightweight inline sparkline for stat tiles — lower-last-value reads as
// improving (green), higher-last-value as worsening (red); flat is neutral.
function sparklineSvg(points){
  const w=56,h=20,pad=2;
  const min=Math.min(...points), max=Math.max(...points);
  const range=(max-min)||1;
  const stepX=points.length>1?(w-pad*2)/(points.length-1):0;
  const coords=points.map((p,i)=>[pad+i*stepX, pad+(1-(p-min)/range)*(h-pad*2)]);
  const path=coords.map((c,i)=>(i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
  const first=points[0], last=points[points.length-1];
  const color = last<first ? "var(--pass)" : (last>first ? "var(--fail)" : "var(--ink-3)");
  const [lx,ly]=coords[coords.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+
    `<path d="${path}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`+
    `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="1.8" fill="${color}"/>`+
  `</svg>`;
}
function statTileHtml(s){
  if(!s.trend) return `<div class="dcm-stat"><div class="k">${escHtml(s.k)}</div><div class="v">${escHtml(s.v)}</div></div>`;
  return `<div class="dcm-stat"><div class="k">${escHtml(s.k)}</div>`+
    `<div class="stat-row"><div class="v">${escHtml(s.v)}</div><div class="spark-wrap">${sparklineSvg(s.trend)}</div></div></div>`;
}

   version of the dashboard-card pop-ups, with search/status filters and a
   mock export action. Same underlying HOME_POPUPS data, so the numbers stay

function reportPageEl(kind){
  const d = HOME_POPUPS[kind]; if(!d) return el("div");
  const pillCol = d.pill.indexOf(true);
  const statusOptions = pillCol>=0 ? Array.from(new Set(d.records.map(r=>r[pillCol]))) : [];

  const wrap=el("div","report-page");
  wrap.innerHTML=
    `<div class="allrel-head"><h2>${escHtml(d.title)}</h2><p>${escHtml(d.subtitle)}</p></div>`+
    `<div class="dcm-stats" style="margin-top:16px;">`+
      d.stats.map(statTileHtml).join("")+
    `</div>`+
    `<div class="dcm-simtag">· simulated</div>`+
    `<div class="tabletools report-tools">`+
      `<input type="text" class="ctr-input report-search" id="reportSearch" placeholder="Search ${d.columns.length} columns…" style="max-width:260px;">`+
      (statusOptions.length
        ? `<select class="ctr-input report-status" id="reportStatus" style="max-width:180px;">`+
            `<option value="">All statuses</option>`+
            statusOptions.map(o=>`<option value="${escHtml(o)}">${escHtml(o)}</option>`).join("")+
          `</select>`
        : "")+
      `<div class="spacer"></div>`+
      `<span class="report-count" id="reportCount"></span>`+
      `<button class="btn" id="reportExport">⭳ Export</button>`+
    `</div>`+
    `<div class="dcm-tablewrap" style="max-height:none;"><table><thead><tr>${d.columns.map(c=>`<th>${escHtml(c)}</th>`).join("")}</tr></thead><tbody id="reportTbody"></tbody></table></div>`;

  const search = wrap.querySelector("#reportSearch");
  const status = wrap.querySelector("#reportStatus");
  const tbody = wrap.querySelector("#reportTbody");
  const count = wrap.querySelector("#reportCount");

  function renderRows(){
    const q = (search.value||"").trim().toLowerCase();
    const st = status ? status.value : "";
    const rows = d.records.filter(row=>{
      if(st && row[pillCol]!==st) return false;
      if(!q) return true;
      return row.some(cell=>String(cell).toLowerCase().includes(q));
    });
    tbody.innerHTML = rows.map(row=>
      `<tr>${row.map((cell,i)=>{
        const txt = escHtml(cell);
        let inner = txt;
        if(d.mono[i])       inner = `<span class="mono">${inner}</span>`;
        else if(d.pill[i])  inner = `<span class="dcm-pill">${inner}</span>`;
        const cls = d.wrap[i] ? ' class="wrap"' : '';
        return `<td${cls}>${inner}</td>`;
      }).join("")}</tr>`
    ).join("");
    count.textContent = `${rows.length} of ${d.records.length}`;
  }
  search.addEventListener("input", renderRows);
  if(status) status.addEventListener("change", renderRows);
  wrap.querySelector("#reportExport").addEventListener("click", ()=>{
    toast(`Exported ${count.textContent.split(" ")[0]} rows to CSV (mock)`);
  });
  renderRows();
  return wrap;
}

/* ---- Releases > Insights landing page (computed from RELEASES/CASES mock data) ---- */
function releaseInsightsEl(){
  const wrap = el("div");
  wrap.appendChild(el("div","insights-head",
    `<h2>Release testing insights</h2><p>Rolled up from the releases and runs tracked in this workspace — recomputed from run data, not a live feed.</p>`));

  let totalResults=0; const agg={pass:0,fail:0,block:0,notrun:0};
  const defects=new Set();
  let totalRuns=0;
  RELEASES.forEach(rel=>rel.runs.forEach(run=>{
    totalRuns++;
    run.results.forEach(r=>{ totalResults++; agg[r.s]++; if(r.d) defects.add(r.d); });
  }));
  const abstainCount = Object.values(CASES).filter(c=>c.abstain).length;
  const overallPassRate = totalResults? Math.round(agg.pass/totalResults*100) : 0;

  const grid=el("div","insight-grid");
  const stat=(label,value,sub)=>{const c=el("div","stat-card");
    c.innerHTML=`<div class="sc-label">${label}</div><div class="sc-value">${value}</div>${sub?`<div class="sc-sub">${sub}</div>`:""}`;
    return c;};
  grid.appendChild(stat("Releases tracked", RELEASES.length, `${totalRuns} runs`));
  grid.appendChild(stat("Overall pass rate", overallPassRate+"%", `${agg.pass} of ${totalResults} results`));
  grid.appendChild(stat("Open defects", defects.size, defects.size?[...defects].slice(0,3).join(", ")+(defects.size>3?"…":""):"none logged"));
  grid.appendChild(stat("Abstained cases", abstainCount, "not runnable — pending product/compliance"));
  wrap.appendChild(grid);

  const tableWrap=el("div","rel-table-wrap");
  tableWrap.appendChild(el("div","rt-head","By release"));
  RELEASES.forEach(rel=>{
    const c={pass:0,fail:0,block:0,notrun:0}; let total=0;
    rel.runs.forEach(run=>run.results.forEach(r=>{c[r.s]++; total++;}));
    const pct = total? Math.round(c.pass/total*100) : 0;
    const row=el("div","rel-row");
    row.innerHTML=
      `<div class="rr-name">${rel.name.split("—")[0].trim()}<span class="rr-sub">${rel.name.split("—")[1]?rel.name.split("—")[1].trim():""} · ${rel.runs.length} run${rel.runs.length===1?"":"s"}</span></div>`+
      `<div class="rr-bar"><div class="rate-bar" style="margin-top:0;">`+
        `<span class="s-pass" style="width:${total?c.pass/total*100:0}%"></span>`+
        `<span class="s-fail" style="width:${total?c.fail/total*100:0}%"></span>`+
        `<span class="s-block" style="width:${total?c.block/total*100:0}%"></span>`+
        `<span class="s-notrun" style="width:${total?c.notrun/total*100:0}%"></span>`+
      `</div></div>`+
      `<div class="rr-pct">${pct}%</div>`+
      `<div class="rr-counts"><span>${c.pass}✓</span><span>${c.fail}✕</span><span>${c.block}▮</span><span>${c.notrun} nr</span></div>`;
    tableWrap.appendChild(row);
  });
  wrap.appendChild(tableWrap);

  const callouts=el("div","callout-row");
  const flakyIds=Object.keys(FLAKY_CASES);
  const co1=el("div","callout");
  co1.innerHTML=`<div class="co-title">⚡ Flaky signal</div><div class="co-body">`+
    (flakyIds.length
      ? flakyIds.map(id=>{const f=FLAKY_CASES[id];return `<b>${id}</b> — passed ${f.passes}/${f.passes+f.fails} across ${f.runs} runs, fails only on ${PLAT_ICON[f.platform]} ${f.platform}.`;}).join("<br>")
      : "No flaky signals detected in the observed runs.")+`</div>`;
  const co2=el("div","callout");
  co2.innerHTML=`<div class="co-title">ⓘ Abstain-blocked cases</div><div class="co-body">`+
    `${abstainCount} case${abstainCount===1?"":"s"} can't be executed against an honest oracle yet — each is tagged with the product/compliance question blocking it. See Test Cases › Library for detail.</div>`;
  callouts.appendChild(co1); callouts.appendChild(co2);
  wrap.appendChild(callouts);

  return wrap;
}

// -------------- Insight computation --------------
function buildInsightsStrip(caseId, hist){
  const tc = CASES[caseId];
  const wrap = el("div","drawer-sec ai-insights");
  wrap.appendChild(el("div","lbl","⚡ Insights"));
  const insights = computeInsights(caseId, tc, hist);
  if(!insights.length){
    const empty=el("div","insight");
    empty.innerHTML=`<div class="insight-body">No signals yet — not enough runs to draw a conclusion.</div>`;
    wrap.appendChild(empty);
    return wrap;
  }
  insights.forEach(ins=>wrap.appendChild(renderInsight(ins, caseId)));
  return wrap;
}

function computeInsights(caseId, tc, hist){
  const out=[];
  // 1) Flaky signal
  if(FLAKY_CASES[caseId]){
    const f=FLAKY_CASES[caseId];
    out.push({
      type:"flaky", title:"Flaky signal", prov:"measured", conf:"●●●○",
      body:`passed ${f.passes} / failed ${f.fails} across ${f.runs} runs, fails only on ${PLAT_ICON[f.platform]} ${f.platform} → likely env, not a product bug`,
      evidence:`evidence: ${f.evidence.join(", ")}`,
      actions:[
        {label:"Mark flaky", handler:()=>openConfirmModal({
          title:"Mark case flaky",
          body:`Mark <b>${tc.id}</b> as flaky? The row will surface a flaky badge and be excluded from group health rollups.`,
          accept:"Mark flaky", onAccept:()=>toast(`Marked ${tc.id} flaky (mock)`)
        })},
        {label:"Open defect", handler:()=>openConfirmModal({
          title:"Open defect for flaky signal",
          body:`Draft a defect linking runs <span class="mono">${f.evidence.join(", ")}</span> and platform <b>${f.platform}</b>?`,
          accept:"Open defect", onAccept:()=>toast(`Defect drafted (mock)`)
        })},
      ]
    });
  }
  // 2) Learn from bug — latest fail with a defect resolved
  const failWithBug = hist.find(h=>h.status==="fail" && h.defect && RESOLVED_BUGS[h.defect]);
  if(failWithBug){
    const rb = RESOLVED_BUGS[failWithBug.defect];
    const oracleChange = rb.changes.find(c=>c.kind==="oracle");
    out.push({
      type:"learn", title:"Learn from bug", prov:"proxy", conf:"●●○○",
      body:`${failWithBug.defect} (resolved) touched this area — the expected oracle here looks stale.`+
        (oracleChange?` Proposed: <span class="old">${escapeHtml(short(oracleChange.old))}</span> → <span class="new">${escapeHtml(short(oracleChange.neu))}</span>`:""),
      actions:[
        {label:"Review change", handler:()=>openChangeSetModal(failWithBug.defect)},
        {label:"Dismiss", handler:()=>toast("Insight dismissed (mock)")},
      ]
    });
  }
  // 3) Coverage — never executed on some platform this release
  const platsRun = new Set(hist.filter(h=>h.status!=="notrun").map(h=>h.run.platform));
  const missing = ["web","mobile"].filter(p=>!platsRun.has(p));
  if(missing.length && !tc.abstain){
    const plat = missing[0];
    out.push({
      type:"coverage", title:"Coverage", prov:"measured", conf:"",
      body:`never run on ${PLAT_ICON[plat]} ${plat} in the observed releases.`,
      actions:[
        {label:`Add to next ${plat} run`, handler:()=>openConfirmModal({
          title:`Add ${tc.id} to next ${plat} run`,
          body:`Schedule <b>${tc.id}</b> for the next ${plat} run? (Applies on next execution.)`,
          accept:"Schedule", onAccept:()=>toast(`Scheduled ${tc.id} for next ${plat} run (mock)`)
        })},
      ]
    });
  }
  // 4) Abstain-blocker
  if(tc.abstain){
    out.push({
      type:"abstain-blocker", title:"Abstain-blocker", prov:"abstained", conf:"",
      body:`Blocked by <b>${tc.abstain.q}</b>: ${escapeHtml(tc.abstain.reason)}`,
      actions:[
        {label:"Draft question to product/compliance", handler:()=>openConfirmModal({
          title:`Draft question ${tc.abstain.q}`,
          body:`Draft an email to product/compliance asking:<br><i>${escapeHtml(tc.abstain.reason)}</i>`,
          accept:"Draft", onAccept:()=>toast("Question drafted (mock)")
        })},
      ]
    });
  }
  // 5) Priority suggestion — Abstain when only 1 executed run of history.
  const executedRuns = hist.filter(h=>h.status!=="notrun").length;
  if(executedRuns===1 && !tc.abstain){
    out.push({
      type:"priority-abstain", title:"Priority suggestion", prov:"abstained", conf:"",
      body:`ⓘ Abstain — only 1 run of history, not enough signal to recommend a change.`,
      actions:[]
    });
  }
  return out;
}

function short(s,n=64){ if(!s) return ""; return s.length>n?s.slice(0,n-1)+"…":s; }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

function renderInsight(ins, caseId){
  const row=el("div","insight");
  const head=el("div","insight-head");
  head.innerHTML=`<span class="ih-title">▸ ${ins.title}</span>`+
    (ins.conf?`<span class="ih-conf">confidence ${ins.conf}</span>`:"")+
    `<span class="prov ${ins.prov}">${ins.prov}</span>`;
  row.appendChild(head);
  const body=el("div","insight-body"); body.innerHTML=ins.body;
  if(ins.evidence){ body.innerHTML += `<div class="evid">${escapeHtml(ins.evidence)}</div>`; }
  row.appendChild(body);
  if(ins.actions && ins.actions.length){
    const acts=el("div","insight-actions");
    ins.actions.forEach(a=>{
      const b=el("button","btn",a.label);
      b.addEventListener("click",e=>{e.stopPropagation();a.handler();});
      acts.appendChild(b);
    });
    row.appendChild(acts);
  }
  return row;
}

function openModal({title, bodyHtml, footHtml, onMount}){
  const m=$("#modal");
  m.innerHTML=
    `<div class="modal-head"><div class="m-title">${title}</div>`+
    `<button class="m-close" aria-label="Close">✕</button></div>`+
    `<div class="modal-body">${bodyHtml}</div>`+
    (footHtml?`<div class="modal-foot">${footHtml}</div>`:"");
  $("#modalBackdrop").classList.add("show");
  m.querySelector(".m-close").addEventListener("click",closeModal);
  if(onMount) onMount(m);
}
function closeModal(){ $("#modalBackdrop").classList.remove("show"); const m=document.getElementById('modal'); if(m) m.classList.remove("wide"); }
$("#modalBackdrop").addEventListener("click",e=>{ if(e.target.id==="modalBackdrop") closeModal(); });

function openConfirmModal({title, body, accept="Apply", onAccept}){
  openModal({
    title, bodyHtml:`<div class="m-section">${body}</div>`,
    footHtml:`<span class="audit">✎ audit</span><div class="spacer"></div>`+
      `<button class="btn" data-act="cancel">Cancel</button>`+
      `<button class="btn btn-primary" data-act="accept">${escapeHtml(accept)}</button>`,
    onMount:m=>{
      m.querySelector('[data-act="cancel"]').addEventListener("click",closeModal);
      m.querySelector('[data-act="accept"]').addEventListener("click",()=>{closeModal(); if(onAccept) onAccept();});
    }
  });
}

/* ---- Add Release — minimal fields; new release starts with no runs and no
   quality gate (gate cell reads "—" until a run is added). ---- */
function openAddReleaseModal(){
  const nextNum = RELEASES.length+1;
  openModal({
    title:"Add Release",
    bodyHtml:
      `<div class="m-section"><div class="m-lbl">Release ID <span class="ctr-req">*</span></div>`+
        `<input class="ctr-input" id="arlId" type="text" value="REL-FHR-1.${nextNum+3}">`+
      `</div>`+
      `<div class="m-section"><div class="m-lbl">Milestone <span class="ctr-req">*</span></div>`+
        `<input class="ctr-input" id="arlMilestone" type="text" placeholder="e.g. Sprint 25 smoke">`+
      `</div>`+
      `<div class="m-section ctr-machine" style="grid-template-columns:1fr 1fr;">`+
        `<div class="ctr-field"><div class="m-lbl">Target ship</div>`+
          `<input class="ctr-input" id="arlShip" type="text" placeholder="YYYY-MM-DD">`+
        `</div>`+
        `<div class="ctr-field"><div class="m-lbl">Surface</div>`+
          `<input class="ctr-input" id="arlSurface" type="text" placeholder="e.g. Financial Health Review · iPOS+ · web">`+
        `</div>`+
      `</div>`,
    footHtml:`<span class="audit">✎ audit</span><div class="spacer"></div>`+
      `<button class="btn" data-act="cancel">Cancel</button>`+
      `<button class="btn btn-primary" data-act="accept">Add Release</button>`,
    onMount:m=>{
      m.querySelector('[data-act="cancel"]').addEventListener("click",closeModal);
      m.querySelector('[data-act="accept"]').addEventListener("click",()=>{
        const id=m.querySelector("#arlId").value.trim();
        const milestone=m.querySelector("#arlMilestone").value.trim();
        if(!id || !milestone){ toast("Release ID and milestone are required"); return; }
        if(RELEASES.some(r=>r.id===id)){ toast(`${id} already exists`); return; }
        const ship=m.querySelector("#arlShip").value.trim()||"—";
        const surface=m.querySelector("#arlSurface").value.trim()||"Financial Health Review · iPOS+";
        RELEASES.push({
          id, name:`${id} — ${milestone}`, targetShip:ship,
          businessContext:{surface, release:`${id} — target ship ${ship}`, scope:"—", plansGenerated:"—", topmostExecuted:"No runs yet", owningTeam:"—"},
          runs:[],
        });
        closeModal();
        renderApp();
        toast(`${id} added (mock) — add a run to generate a quality gate`);
      });
    }
  });
}

/* ---- Add Run — attaches a new (empty-result) run to an existing release;
   results start at "notrun" for every case in scope, same shape as a run
   that hasn't executed yet. ---- */
function openAddRunModal(){
  if(!RELEASES.length){ toast("Add a release first"); return; }
  const relOptions = RELEASES.map(r=>`<option value="${escapeHtml(r.id)}">${escapeHtml(r.id)}</option>`).join("");
  openModal({
    title:"Add Run",
    bodyHtml:
      `<div class="m-section"><div class="m-lbl">Release <span class="ctr-req">*</span></div>`+
        `<select class="ctr-input" id="arnRelease">${relOptions}</select>`+
      `</div>`+
      `<div class="m-section"><div class="m-lbl">Run name <span class="ctr-req">*</span></div>`+
        `<input class="ctr-input" id="arnName" type="text" placeholder="e.g. Smoke Test">`+
      `</div>`+
      `<div class="m-section"><div class="m-lbl">Suite</div>`+
        `<input class="ctr-input" id="arnSuite" type="text" placeholder="e.g. Critical-path check">`+
      `</div>`+
      `<div class="m-section ctr-machine" style="grid-template-columns:1fr 1fr;">`+
        `<div class="ctr-field"><div class="m-lbl">Platform</div>`+
          `<select class="ctr-input" id="arnPlatform"><option value="web">web</option><option value="mobile">mobile</option><option value="api">api</option></select></div>`+
        `<div class="ctr-field"><div class="m-lbl">Executed by</div>`+
          `<input class="ctr-input" id="arnExecutor" type="text" placeholder="e.g. R. Menon"></div>`+
      `</div>`,
    footHtml:`<span class="audit">✎ audit</span><div class="spacer"></div>`+
      `<button class="btn" data-act="cancel">Cancel</button>`+
      `<button class="btn btn-primary" data-act="accept">Add Run</button>`,
    onMount:m=>{
      m.querySelector('[data-act="cancel"]').addEventListener("click",closeModal);
      m.querySelector('[data-act="accept"]').addEventListener("click",()=>{
        const relId=m.querySelector("#arnRelease").value;
        const name=m.querySelector("#arnName").value.trim();
        if(!name){ toast("Run name is required"); return; }
        const rel=relById(relId); if(!rel) return;
        const suite=m.querySelector("#arnSuite").value.trim()||name;
        const platform=m.querySelector("#arnPlatform").value;
        const executedBy=m.querySelector("#arnExecutor").value.trim()||"Unassigned";
        const seq=rel.runs.length+1;
        rel.runs.push({
          id:`RUN-${relId.replace(/[^A-Z0-9]/gi,"")}-${1000+seq}`,
          name, suite, platform, env:"Staging", build:"—", executedBy,
          lastRun:new Date().toISOString().slice(0,16).replace("T"," "),
          results:[],
        });
        closeModal();
        renderApp();
        toast(`${name} added to ${relId} (mock) — 0 results until cases are assigned`);
      });
    }
  });
}

function openChangeSetModal(bugRef){
  const rb = RESOLVED_BUGS[bugRef]; if(!rb) return;
  const rows = rb.changes.map((c,i)=>{
    if(c.kind==="oracle"){
      return `<div class="cs-row">
        <input type="checkbox" ${c.sel?"checked":""} data-ci="${i}">
        <div><div class="cs-title">Update ${c.tcId} oracle <span class="prov ${c.prov}">${c.prov}</span></div>
        <div class="cs-detail"><span class="old">${escapeHtml(short(c.old,80))}</span> ▸ <span class="new">${escapeHtml(short(c.neu,80))}</span></div></div>
      </div>`;
    }
    if(c.kind==="new"){
      return `<div class="cs-row">
        <input type="checkbox" ${c.sel?"checked":""} data-ci="${i}">
        <div><div class="cs-title">NEW case draft: ${escapeHtml(c.title)} <span class="prov ${c.prov}">${c.prov}</span></div>
        <div class="cs-detail">${escapeHtml(c.detail)}</div></div>
      </div>`;
    }
    if(c.kind==="trace"){
      return `<div class="cs-row">
        <input type="checkbox" ${c.sel?"checked":""} data-ci="${i}">
        <div><div class="cs-title">Add trace tag on ${c.tcId} <span class="prov ${c.prov}">${c.prov}</span></div>
        <div class="cs-detail">${escapeHtml(c.detail)}</div></div>
      </div>`;
    }
    if(c.kind==="abstain"){
      return `<div class="cs-row warn">
        <input type="checkbox" disabled>
        <div><div class="cs-title">⚠ Abstain — ${c.tcId} <span class="prov ${c.prov}">${c.prov}</span></div>
        <div class="cs-detail">${escapeHtml(c.detail)}</div></div>
      </div>`;
    }
    return "";
  }).join("");
  openModal({
    title:`Suggested change set · from ${bugRef}`,
    bodyHtml:`<div class="m-section"><div class="m-lbl">Resolved ${escapeHtml(rb.resolved)} · maps to ${rb.caseId} + ${escapeHtml(rb.req)}</div>${rows}</div>`,
    footHtml:`<span class="audit">✎ audit</span><div class="spacer"></div>`+
      `<button class="btn" data-act="discard">Discard</button>`+
      `<button class="btn btn-primary" data-act="accept">Accept selected</button>`,
    onMount:m=>{
      m.querySelector('[data-act="discard"]').addEventListener("click",closeModal);
      m.querySelector('[data-act="accept"]').addEventListener("click",()=>{
        const n=m.querySelectorAll('input[data-ci]:checked').length;
        closeModal(); toast(`Applied ${n} change${n===1?"":"s"} from ${bugRef} (mock)`);
      });
    }
  });
}

function openSummarizeRunModal(rel, run){
  const c=runCounts(run);
  const fails=run.results.filter(r=>r.s==="fail");
  const failList=fails.map(f=>`<li><b>${f.c}</b> — ${escapeHtml(CASES[f.c]?CASES[f.c].title:"")}${f.d?` <span class="mono">(${f.d})</span>`:""}</li>`).join("");
  openModal({
    title:`Summarize run · ${run.name}`,
    bodyHtml:
      `<div class="m-section"><div class="m-lbl">Headline</div>`+
      `<div>${c.pass} passed · <b style="color:var(--fail)">${c.fail} failed</b> · ${c.block} blocked · ${c.notrun} not run (of ${run.results.length}).</div></div>`+
      `<div class="m-section"><div class="m-lbl">Cluster (proxy — heuristic on defect + platform)</div>`+
      `<div>${fails.filter(f=>f.d).length} real (has defect ref) · ${fails.filter(f=>!f.d).length} unclustered · flagged flaky candidates: <b>TC-C6</b>.</div></div>`+
      (fails.length?`<div class="m-section"><div class="m-lbl">Failures</div><ul>${failList}</ul></div>`:""),
    footHtml:`<span class="audit">Provenance: measured (counts) · proxy (cluster)</span><div class="spacer"></div>`+
      `<button class="btn btn-primary" data-act="close">Close</button>`,
    onMount:m=>m.querySelector('[data-act="close"]').addEventListener("click",closeModal)
  });
}

function openAutoAssignModal(rel, run){
  const fails=run.results.filter(r=>r.s==="fail");
  const assignments = fails.map(f=>{
    const tc=CASES[f.c]; const owner=tc?tc.author:"—";
    return `<li><b>${f.c}</b> → <span class="assignee"><span class="avatar">${initials(owner)}</span>${owner}</span> <span class="prov proxy">proxy</span> <span class="mono">(by past history)</span></li>`;
  }).join("");
  openModal({
    title:`Auto-assign failures · ${run.name}`,
    bodyHtml:
      (fails.length
        ? `<div class="m-section"><div class="m-lbl">Proposed assignments (heuristic: author of the case)</div><ul>${assignments}</ul></div>`
        : `<div class="m-section">No failures in this run — nothing to assign.</div>`),
    footHtml:`<span class="audit">✎ audit</span><div class="spacer"></div>`+
      `<button class="btn" data-act="cancel">Cancel</button>`+
      `<button class="btn btn-primary" data-act="accept">Apply</button>`,
    onMount:m=>{
      m.querySelector('[data-act="cancel"]').addEventListener("click",closeModal);
      m.querySelector('[data-act="accept"]').addEventListener("click",()=>{closeModal();toast(`Assigned ${fails.length} failure${fails.length===1?"":"s"} (mock)`);});
    }
  });
}

/* ---- Add Test Case — same metadata fields as the case-detail card (steps +
   test data), so the new case renders identically once added. ---- */
const ADD_TC_CATEGORIES = ["positive","alt-valid","boundary","edge","negative","property","regulatory","state"];
function openAddTestCaseModal(scen){
  let steps=[{a:"",e:""}], data=[{k:"",v:""}];
  const catOptions = ADD_TC_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("");
  openModal({
    title:`Add Test Case · ${scen.name}`,
    bodyHtml:
      `<div class="m-section"><div class="m-lbl">Title <span class="ctr-req">*</span></div>`+
        `<input class="ctr-input" id="atcTitle" type="text" placeholder="e.g. Reject sum below minimum for TPD coverage">`+
      `</div>`+
      `<div class="m-section ctr-machine" style="grid-template-columns:1fr 1fr 1fr;">`+
        `<div class="ctr-field"><div class="m-lbl">Category</div>`+
          `<select class="ctr-input" id="atcCategory">${catOptions}</select></div>`+
        `<div class="ctr-field"><div class="m-lbl">Manual / Auto</div>`+
          `<select class="ctr-input" id="atcExec"><option value="auto">Auto</option><option value="manual">Manual</option></select></div>`+
        `<div class="ctr-field"><div class="m-lbl">Priority</div>`+
          `<select class="ctr-input" id="atcPriority"><option>P1</option><option selected>P2</option><option>P3</option></select></div>`+
      `</div>`+
      `<div class="m-section"><div class="m-lbl">Steps &amp; expected</div><div id="atcSteps"></div>`+
        `<button class="btn" type="button" id="atcAddStep" style="margin-top:6px;font-size:11.5px;padding:4px 10px;">+ Add step</button></div>`+
      `<div class="m-section"><div class="m-lbl">Test data</div><div id="atcData"></div>`+
        `<button class="btn" type="button" id="atcAddData" style="margin-top:6px;font-size:11.5px;padding:4px 10px;">+ Add data field</button></div>`,
    footHtml:`<span class="audit">✎ audit</span><div class="spacer"></div>`+
      `<button class="btn" data-act="cancel">Cancel</button>`+
      `<button class="btn btn-primary" data-act="accept">Add Test Case</button>`,
    onMount:m=>{
      const stepsBox=m.querySelector("#atcSteps"), dataBox=m.querySelector("#atcData");
      function renderSteps(){
        stepsBox.innerHTML = steps.map((st,i)=>
          `<div class="atc-row" data-i="${i}" style="display:flex;gap:6px;margin-bottom:6px;">`+
            `<input class="ctr-input atc-step-a" placeholder="Action" value="${escapeHtml(st.a)}" style="flex:1;">`+
            `<input class="ctr-input atc-step-e" placeholder="Expected" value="${escapeHtml(st.e)}" style="flex:1;">`+
            (steps.length>1?`<button class="btn atc-rm" type="button" style="padding:4px 9px;">✕</button>`:'')+
          `</div>`
        ).join("");
        stepsBox.querySelectorAll(".atc-row").forEach(row=>{
          const i=+row.dataset.i;
          row.querySelector(".atc-step-a").addEventListener("input",e=>steps[i].a=e.target.value);
          row.querySelector(".atc-step-e").addEventListener("input",e=>steps[i].e=e.target.value);
          const rm=row.querySelector(".atc-rm");
          if(rm) rm.addEventListener("click",()=>{steps.splice(i,1);renderSteps();});
        });
      }
      function renderData(){
        dataBox.innerHTML = data.map((d,i)=>
          `<div class="atc-row" data-i="${i}" style="display:flex;gap:6px;margin-bottom:6px;">`+
            `<input class="ctr-input atc-data-k" placeholder="Field" value="${escapeHtml(d.k)}" style="width:140px;">`+
            `<input class="ctr-input atc-data-v" placeholder="Value" value="${escapeHtml(d.v)}" style="flex:1;">`+
            (data.length>1?`<button class="btn atc-rm" type="button" style="padding:4px 9px;">✕</button>`:'')+
          `</div>`
        ).join("");
        dataBox.querySelectorAll(".atc-row").forEach(row=>{
          const i=+row.dataset.i;
          row.querySelector(".atc-data-k").addEventListener("input",e=>data[i].k=e.target.value);
          row.querySelector(".atc-data-v").addEventListener("input",e=>data[i].v=e.target.value);
          const rm=row.querySelector(".atc-rm");
          if(rm) rm.addEventListener("click",()=>{data.splice(i,1);renderData();});
        });
      }
      renderSteps(); renderData();
      m.querySelector("#atcAddStep").addEventListener("click",()=>{steps.push({a:"",e:""});renderSteps();});
      m.querySelector("#atcAddData").addEventListener("click",()=>{data.push({k:"",v:""});renderData();});
      m.querySelector('[data-act="cancel"]').addEventListener("click",closeModal);
      m.querySelector('[data-act="accept"]').addEventListener("click",()=>{
        const title=m.querySelector("#atcTitle").value.trim();
        if(!title){ toast("Title is required"); return; }
        const category=m.querySelector("#atcCategory").value;
        const exec=m.querySelector("#atcExec").value;
        const priority=m.querySelector("#atcPriority").value;
        const cleanSteps=steps.filter(s=>s.a.trim()||s.e.trim());
        const cleanData=data.filter(d=>d.k.trim()||d.v.trim());
        const seq=Object.keys(CASES).length+1;
        const key="NEW"+seq;
        CASES[key]={
          id:"TC-NEW"+seq, title, category, technique:"manual-entry", exec,
          assignee:"Unassigned", author:"You", priority, req:"—",
          updated:new Date().toISOString().slice(0,10), lifecycle:"active",
          dv:"—", oracle:"—", traces:[],
          steps: cleanSteps.length?cleanSteps:[{a:"—",e:"—"}],
          data: cleanData.length?cleanData:[],
        };
        scen.cases.push(key);
        closeModal();
        render();
        toast(`Added ${CASES[key].id} to ${scen.name} (mock)`);
      });
    }
  });
}

function openSuggestEdgeCasesModal(scen){
  const suggestions = [
    {title:"Whitespace-only input", cat:"negative", conf:"●●●○", prov:"measured", why:"Common oversight in similar boundary sets."},
    {title:"Locale-formatted digits (SG vs US separators)", cat:"boundary", conf:"●●○○", prov:"proxy", why:"Data-variation gap seen in adjacent scenarios."},
    {title:"Copy-paste emoji or RTL chars into amount field", cat:"negative", conf:"●●○○", prov:"proxy", why:"Historical bugs (JIRA-7841 family) hint at sanitizer gaps."},
    {title:"Abstain — value-boundary rule at zero for optional needs", cat:"—", conf:"", prov:"abstained", why:"Rule unspecified; cannot assert oracle."},
  ];
  const rows = suggestions.map((s,i)=>{
    if(s.prov==="abstained"){
      return `<div class="cs-row warn"><input type="checkbox" disabled>
        <div><div class="cs-title">⚠ ${escapeHtml(s.title)} <span class="prov ${s.prov}">${s.prov}</span></div>

      <div><div class="cs-title">${escapeHtml(s.title)} <span class="ctype cat-${s.cat}">${s.cat}</span> <span class="prov ${s.prov}">${s.prov}</span></div>
      <div class="cs-detail">confidence ${s.conf} · ${escapeHtml(s.why)}</div></div></div>`;
  }).join("");
  openModal({
    title:`Suggest missing edge cases · ${scen.name}`,
    bodyHtml:`<div class="m-section"><div class="m-lbl">Draft additions (nothing applied without accept)</div>${rows}</div>`,
    footHtml:`<span class="audit">✎ audit</span><div class="spacer"></div>`+
      `<button class="btn" data-act="cancel">Discard</button>`+
      `<button class="btn btn-primary" data-act="accept">Add selected as drafts</button>`,
    onMount:m=>{
      m.querySelector('[data-act="cancel"]').addEventListener("click",closeModal);
      m.querySelector('[data-act="accept"]').addEventListener("click",()=>{
        const n=m.querySelectorAll('input[data-ci]:checked').length;
        closeModal(); toast(`Added ${n} draft case${n===1?"":"s"} (mock)`);
      });
    }
  });
}

// Small intent table.
function classifyIntent(q){
  const s=q.trim().toLowerCase();
  if(!s) return {kind:"empty"};
  // read-only queries
  if(/^what\s+failed/.test(s) || /failed on (mobile|web)/.test(s))
    return {kind:"query-failed-platform", platform: /mobile/.test(s) ? "mobile" : "web"};
  if(/^which cases (cover|trace)/.test(s) || /cover[s]?\s+(ac-|fhr-req-)/.test(s)){
    const m=s.match(/(ac-[a-z0-9]+|fhr-req-\d+)/i);
    return {kind:"query-cover", tag: m?m[1].toUpperCase():null};
  }
  // clear mutating
  const auto=s.match(/mark\s+(tc-[a-z0-9]+)\s+as\s+automated/i);
  if(auto) return {kind:"mutate-mark-auto", tcId: auto[1].toUpperCase()};
  // ambiguous mutating
  if(/^add (a )?(negative|edge|boundary|positive) case/.test(s))
    return {kind:"ambiguous-add", text:q};
  return {kind:"unknown", text:q};
}

function submitCbar(){
  const q=$("#cbarInput").value;
  const intent=classifyIntent(q);
  if(intent.kind==="empty") return;
  cbarChat(escapeHtml(q), "user");
  $("#cbarInput").value="";
  $("#cbarClarify").style.display="none";

  if(intent.kind==="query-failed-platform"){
    const fails=[];
    RELEASES.forEach(rel=>rel.runs.forEach(run=>{
      if(run.platform!==intent.platform) return;
      run.results.filter(r=>r.s==="fail").forEach(r=>fails.push({c:r.c,d:r.d,run:run.id,rel:rel.id}));
    }));
    const list = fails.length
      ? "<ul style=\"margin:6px 0 0;padding-left:18px;\">"+fails.map(f=>`<li><b>${f.c}</b> — ${escapeHtml(CASES[f.c]?CASES[f.c].title:"")} <span class="mono">(${f.run}${f.d?"; "+f.d:""})</span></li>`).join("")+"</ul>"
      : "<i>none in the observed data.</i>";
    cbarChat(`Failed on ${PLAT_ICON[intent.platform]} ${intent.platform} across observed releases: <b>${fails.length}</b>.${list} <div class="muted" style="font-size:11px;margin-top:6px;">provenance: measured (from run data)</div>`);
    return;
  }
  if(intent.kind==="query-cover"){
    const tag=intent.tag;
    const matches = Object.values(CASES).filter(tc=>tc.req===tag || (tc.traces||[]).includes(tag));
    const list = matches.length
      ? "<ul style=\"margin:6px 0 0;padding-left:18px;\">"+matches.map(tc=>`<li><b>${tc.id}</b> — ${escapeHtml(tc.title)}</li>`).join("")+"</ul>"
      : "<i>no direct matches — try an AC-* or trace tag.</i>";
    cbarChat(`Cases covering <b>${escapeHtml(tag||"—")}</b>: <b>${matches.length}</b>.${list}`);
    return;
  }
  if(intent.kind==="mutate-mark-auto"){
    if(!CASES[intent.tcId]){
      cbarChat(`<i>${escapeHtml(intent.tcId)} not found.</i>`); return;
    }
    STATE.draft = {
      kind:"mark-auto", title:`Mark ${intent.tcId} as automated`,
      lifecycle:"draft", ref:intent.tcId,
      steps:[`Set exec=auto on ${intent.tcId}`, `Recompute Auto/Manual counts`],
      data:[{k:"Case",v:intent.tcId},{k:"Change",v:"exec: manual → auto"}],
    };
    render();
    return;
  }
  if(intent.kind==="ambiguous-add"){
    STATE.pendingIntent={kind:"add-neg-case", base:intent.text};
    cbarClarify(`<span class="q">Web, mobile, or both?</span>`+
      ["Web","Mobile","Both"].map(p=>`<button class="chip-btn" data-plat="${p}">${p}</button>`).join(""));
    document.querySelectorAll(".cbar-clarify .chip-btn").forEach(b=>{
      b.addEventListener("click",()=>{
        const plat=b.dataset.plat;
        $("#cbarClarify").style.display="none";
        STATE.draft={
          kind:"new-case",
          title:"Decline submission when NRIC has expired",
          category:"negative",
          platform:plat,
          steps:[
            "Enter expired NRIC (2019-03-01)",
            "Attempt submission → expect validation error"
          ],
          data:[{k:"NRIC expiry",v:"2019-03-01"},{k:"Platform",v:plat}],
          trace:"FHR-REQ-022",
          lifecycle:"draft",
        };
        STATE.pendingIntent=null;
        render();
      });
    });
    return;
  }
  cbarChat(`<i>I don't recognise that intent yet. Try one of the examples.</i>`);
}

function tcInit(root){
  const app = root.querySelector("#tcApp");
  function tcSetView(v){
    app.dataset.view = v;
    root.querySelector("#tcBtnStep1").setAttribute("aria-current", v==="step1"?"step":"false");
    root.querySelector("#tcBtnStep2").setAttribute("aria-current", v==="step2"?"step":"false");
    const sc = root.querySelector(".work-body"); if(sc) sc.scrollTop=0;
  }
  root.querySelectorAll(".stepper .step[data-tcstep]").forEach(b=>{
    b.addEventListener("click",()=>tcSetView(b.dataset.tcstep));
  });
  const toStep2 = root.querySelector("#tcToStep2");
  if(toStep2) toStep2.addEventListener("click",()=>tcSetView("step2"));
  root.querySelectorAll(".chips").forEach(group=>{
    group.querySelectorAll(".chip").forEach(chip=>{
      chip.addEventListener("click",()=>{
        group.querySelectorAll(".chip").forEach(c=>c.classList.remove("selected"));
        chip.classList.add("selected");
      });
    });
  });
  root.querySelectorAll(".tools").forEach(tools=>{
    tools.querySelectorAll(".filter").forEach(f=>{
      f.addEventListener("click",()=>{
        tools.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
        f.classList.add("active");
      });
    });
  });
  root.querySelectorAll(".chk-box").forEach(cb=>{
    cb.addEventListener("click",()=>cb.classList.toggle("on"));
  });
  const stStates=["draft","approved","abstain"];
  const stLabels={draft:"Draft",approved:"Approved",abstain:"Abstain"};
  root.querySelectorAll(".status").forEach(el=>{
    el.addEventListener("click",()=>{
      const cur=stStates.find(s=>el.classList.contains(s));
      const nxt=stStates[(stStates.indexOf(cur)+1)%stStates.length];
      el.classList.remove(cur); el.classList.add(nxt);
      el.innerHTML='<span class="dot"></span>'+stLabels[nxt];
    });
  });
  root.querySelector("#tcBack").addEventListener("click",()=>{
    STATE.testcraft = false;
    STATE.activeChat = null;
    renderApp();
  });
}

      wsw.querySelectorAll(".wsw-item").forEach(x=>x.classList.remove("active"));
      item.classList.add("active");
      $(".wsw-name").textContent = item.querySelector(".wsw-item-name").textContent;
      $(".wsw-tier").textContent = item.querySelector(".wsw-item-tier").textContent;
      wsw.classList.remove("open");
      toast(`Switched to ${item.querySelector(".wsw-item-name").textContent} (mock)`);
    });
  });
  wsw.querySelector(".wsw-add").addEventListener("click",()=>{
    wsw.classList.remove("open");
    toast("Add workspace (mock)");
  });
  document.addEventListener("click",e=>{ if(!wsw.contains(e.target)) wsw.classList.remove("open"); });
}

// init
STATE.modScenario={f:0,s:0};
renderApp();
initCbar();
initWorkspaceSwitcher();
if(window.lucide) lucide.createIcons();
</script>
</body>
</html>
