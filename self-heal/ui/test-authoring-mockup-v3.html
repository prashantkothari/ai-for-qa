<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Authoring &amp; Execution — AIA iPOS+ Financial Health Review</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @font-face{
    font-family:'DM Sans';
    src:url('./fonts/DM_Sans/DMSans-VariableFont.ttf') format('truetype-variations');
    font-weight:100 1000;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'DM Sans';
    src:url('./fonts/DM_Sans/DMSans-Italic-VariableFont.ttf') format('truetype-variations');
    font-weight:100 1000;
    font-style:italic;
    font-display:swap;
  }
  :root{
    --teal:#0d8b8b;
    --teal-dark:#0a6f6f;
    --teal-tint:#e6f4f4;
    --ink:#1c2529;
    --ink-2:#48555c;
    --ink-3:#7a878e;
    --line:#e3e8ea;
    --line-2:#eef2f3;
    --bg:#f6f8f8;
    --panel:#ffffff;
    --pass:#1f9d55;
    --fail:#d1435b;
    --block:#c77700;
    --notrun:#9aa6ac;
    --radius:8px;
    --shadow:0 1px 2px rgba(20,40,45,.05), 0 1px 3px rgba(20,40,45,.06);
    --font-sans:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-synthesis:none;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--font-sans);
    color:var(--ink);
    background:var(--bg);
    font-size:13.5px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- top bar ---------- */
  .topbar{
    height:52px;display:flex;align-items:center;gap:12px;
    padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.01em;}
  .brand .mark{width:22px;height:22px;border-radius:6px;background:var(--teal);
    display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;}
  .brand .sub{color:var(--ink-3);font-weight:500;font-size:12px;}
  .topbar .spacer{flex:1;}
  .topbar .crumb{color:var(--ink-3);font-size:12px;}
  .topbar .crumb b{color:var(--ink-2);font-weight:600;}

  /* ---------- layout ---------- */
  .layout{display:flex;height:calc(100vh - 52px);}
  .nav{
    width:310px;min-width:310px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .nav.hidden{display:none;}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

  /* ---------- Part C: primary nav rail (Home / Test Cases / Releases) ---------- */
  .primarynav{
    width:184px;min-width:184px;background:var(--bg);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto;padding:14px 10px;flex:none;
  }
  .pnav-item{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;
    padding:8px 9px;border-radius:7px;font:inherit;font-size:13px;font-weight:650;color:var(--ink-2);
    cursor:pointer;margin-bottom:2px;
  }
  .pnav-item:hover{background:var(--line-2);color:var(--ink);}
  .pnav-item.active{background:var(--teal-tint);color:var(--teal-dark);}
  .pnav-item .pnav-ic{width:16px;flex:none;display:flex;align-items:center;justify-content:center;}
  .pnav-item .pnav-ic svg{width:15px;height:15px;stroke-width:2;}
  .pnav-group{margin-bottom:4px;}

  /* ---------- Workspace switcher ---------- */
  .wsw{position:relative;margin-bottom:14px;}
  .wsw-trigger{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 8px;
    font:inherit;cursor:pointer;color:var(--ink);}
  .wsw-trigger:hover{border-color:var(--ink-3);}
  .wsw.open .wsw-trigger{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint);}
  .wsw-icon{flex:none;width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;}
  .wsw-icon svg{width:14px;height:14px;stroke-width:2;}
  .wsw-text{flex:1;display:flex;flex-direction:column;line-height:1.25;overflow:hidden;}
  .wsw-name{font-size:12.5px;font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wsw-tier{font-size:10.5px;color:var(--ink-3);}
  .wsw-chevron{flex:none;color:var(--ink-3);display:flex;}
  .wsw-chevron svg{width:14px;height:14px;stroke-width:2;}
  .wsw-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:45;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 28px rgba(20,40,45,.16);padding:6px;}
  .wsw.open .wsw-menu{display:block;}
  .wsw-menu-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
    font-weight:650;padding:6px 8px 4px;}
  .wsw-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;
    padding:7px 8px;border-radius:7px;font:inherit;cursor:pointer;color:var(--ink-2);}
  .wsw-item:hover{background:var(--line-2);}
  .wsw-item .wsw-item-name{flex:1;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wsw-item .wsw-item-tier{font-size:11px;color:var(--ink-3);flex:none;}
  .wsw-item .wsw-check{flex:none;width:14px;color:var(--teal);display:none;}
  .wsw-item .wsw-check svg{width:14px;height:14px;stroke-width:2.5;}
  .wsw-item.active .wsw-check{display:flex;}
  .wsw-item.active .wsw-item-tier{margin-right:2px;}
  .wsw-sep{height:1px;background:var(--line-2);margin:6px 2px;}
  .wsw-add{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;
    padding:7px 8px;border-radius:7px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;}
  .wsw-add:hover{background:var(--line-2);color:var(--ink);}
  .wsw-add svg{width:14px;height:14px;stroke-width:2;}
  .pnav-sub{display:flex;flex-direction:column;margin:1px 0 8px 24px;border-left:1px solid var(--line);padding-left:11px;}
  .pnav-subitem{
    display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 9px;
    border-radius:6px;font:inherit;font-size:12px;font-weight:600;color:var(--ink-3);cursor:pointer;margin-bottom:1px;
  }
  .pnav-subitem:hover{background:var(--panel);color:var(--ink-2);}
  .pnav-subitem.active{color:var(--teal-dark);background:var(--panel);font-weight:650;box-shadow:var(--shadow);}

  .navscroll{flex:1;overflow-y:auto;padding:8px 8px 24px;}
  .navhead{padding:12px 14px 10px;border-bottom:1px solid var(--line-2);}
  .navhead .nh-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:650;}

  /* ---------- Part C: blank / insights landing pages ---------- */
  .blankpage{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;color:var(--ink-3);text-align:center;padding:60px 24px;}
  .blankpage .bp-icon{font-size:32px;margin-bottom:12px;}
  .blankpage .bp-title{font-size:15px;font-weight:650;color:var(--ink-2);margin-bottom:6px;}
  .blankpage .bp-sub{font-size:12.5px;max-width:380px;line-height:1.6;}

  .insights-head{margin-bottom:16px;}
  .insights-head h2{font-size:16px;margin:0 0 4px;font-weight:650;}
  .insights-head p{margin:0;color:var(--ink-2);font-size:12.5px;max-width:70ch;}
  .insight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:13px 15px;}
  .stat-card .sc-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;}
  .stat-card .sc-value{font-size:23px;font-weight:700;color:var(--ink);margin-top:6px;font-variant-numeric:tabular-nums;}
  .stat-card .sc-sub{font-size:11.5px;color:var(--ink-3);margin-top:3px;}
  .rel-table-wrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
    box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
  .rel-table-wrap .rt-head{padding:12px 15px 10px;border-bottom:1px solid var(--line-2);font-weight:650;font-size:13px;}
  .rel-row{display:flex;align-items:center;gap:14px;padding:11px 15px;border-bottom:1px solid var(--line-2);}
  .rel-row:last-child{border-bottom:0;}
  .rel-row .rr-name{font-weight:600;font-size:12.5px;flex:1;min-width:150px;}
  .rel-row .rr-name .rr-sub{color:var(--ink-3);font-weight:500;font-size:11px;display:block;margin-top:1px;}
  .rel-row .rr-bar{flex:2;min-width:120px;}
  .rel-row .rr-pct{font-size:12.5px;font-weight:650;width:42px;text-align:right;flex:none;font-variant-numeric:tabular-nums;}
  .rel-row .rr-counts{display:flex;gap:8px;flex:none;font-size:11px;color:var(--ink-3);}
  .callout-row{display:flex;gap:12px;flex-wrap:wrap;}
  .callout{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:13px 15px;}
  .callout .co-title{font-weight:650;font-size:12.5px;margin-bottom:5px;}
  .callout .co-body{font-size:12px;color:var(--ink-2);line-height:1.55;}

  /* ---------- tree ---------- */
  .tree{list-style:none;margin:0;padding:0;}
  .node{user-select:none;}
  .row{
    display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;cursor:pointer;
    color:var(--ink-2);position:relative;
  }
  .row:hover{background:var(--line-2);}
  .row.selected{background:var(--teal-tint);color:var(--teal-dark);}
  .row.selected .caret,.row.selected .rowtext{color:var(--teal-dark);}
  .caret{width:12px;font-size:9px;color:var(--ink-3);flex:none;transition:transform .12s;display:inline-block;text-align:center;}
  .caret.open{transform:rotate(90deg);}
  .caret.leaf{visibility:hidden;}
  .rowtext{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ic{width:15px;flex:none;text-align:center;font-size:12px;color:var(--ink-3);}
  .row .count{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .children{margin:0;padding:0 0 0 15px;list-style:none;
    border-left:1px solid var(--line-2);margin-left:11px;}
  .children.collapsed{display:none;}
  .lvl-mod .rowtext{font-weight:650;color:var(--ink);}
  .lvl-mod.selected .rowtext{color:var(--teal-dark);}

  /* dots */
  .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .dot.pass{background:var(--pass);}
  .dot.fail{background:var(--fail);}
  .dot.block{background:var(--block);}
  .dot.notrun{background:var(--notrun);}
  .dot.healed{background:var(--teal);}

  /* run node meta */
  .runmeta{font-size:10.5px;color:var(--ink-3);padding:0 8px 6px 42px;margin-top:-2px;}
  .runmeta .plat{color:var(--ink-2);font-weight:600;}

  /* ---------- main tabs ---------- */
  .maintabs{
    display:flex;align-items:center;gap:2px;padding:10px 18px 0;border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .maintabs .titleblock{margin-bottom:9px;}
  .maintabs .titleblock h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em;}
  .maintabs .titleblock .meta{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .tabrow{display:flex;gap:2px;align-self:flex-end;}
  .maintabs.no-tabs .tabrow{display:none;}
  .tab{
    border:0;background:transparent;font:inherit;font-weight:600;font-size:13px;color:var(--ink-3);
    padding:8px 14px;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;
  }
  .tab:hover{color:var(--ink-2);}
  .tab.active{color:var(--teal-dark);border-bottom-color:var(--teal);}

  .content{flex:1;overflow:auto;padding:18px;}
  .content.listmode{overflow:hidden;display:flex;flex-direction:column;padding:14px 18px 18px;}

  /* ---------- run summary bar ---------- */
  .runsummary{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px;
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  }
  .runsummary .rs-title{font-weight:650;font-size:14.5px;}
  .runsummary .rs-sub{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .runsummary .rs-meta{display:flex;gap:22px;flex-wrap:wrap;}
  .rs-metaitem .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;}
  .rs-metaitem .v{font-size:12.5px;color:var(--ink);font-weight:600;margin-top:1px;}
  .counts{display:flex;gap:6px;margin-left:auto;align-items:center;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;
    padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--bg);
    font-variant-numeric:tabular-nums;
  }
  .pill .dot{width:8px;height:8px;}
  .pill.pass{color:var(--pass);}.pill.fail{color:var(--fail);}
  .pill.block{color:var(--block);}.pill.notrun{color:var(--notrun);}
  .rate-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;width:100%;margin-top:12px;}
  .rate-bar > span{display:block;height:100%;}
  .rate-bar .s-pass{background:var(--pass);}
  .rate-bar .s-fail{background:var(--fail);}
  .rate-bar .s-block{background:var(--block);}
  .rate-bar .s-notrun{background:var(--notrun);}

  /* ---------- detail cards ---------- */
  .scenario-head{margin-bottom:14px;}
  .scenario-head h2{font-size:15px;margin:0 0 4px;font-weight:650;}
  .scenario-head p{margin:0;color:var(--ink-2);font-size:12.5px;max-width:70ch;}
  .tagline{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;}
  .tag{font-size:11px;color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:2px 8px;background:var(--panel);}
  .tag b{color:var(--ink);font-weight:600;}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;
  }
  .card-head{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;}
  .card-head:hover{background:var(--line-2);}
  .card-head .caret{font-size:10px;}
  .cid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink-3);
    background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px;flex:none;}
  .ctitle{font-weight:600;flex:1;}
  /* category chip — thin bordered, typographic color only (no filled pills) */
  .ctype{font-size:10.5px;font-weight:650;padding:2px 8px;border-radius:5px;flex:none;
    border:1px solid var(--line);background:var(--panel);letter-spacing:.02em;
    text-transform:lowercase;}
  .ctype.cat-positive,.ctype.cat-alt-valid{color:var(--teal-dark);}
  .ctype.cat-negative,.ctype.cat-boundary{color:var(--fail);}
  .ctype.cat-regulatory{color:var(--block);}
  .ctype.cat-edge,.ctype.cat-state{color:var(--block);}
  .ctype.cat-property{color:var(--ink-2);}
  .card-body{padding:2px 14px 15px;border-top:1px solid var(--line-2);display:none;}
  .card.open .card-body{display:block;}
  .card.open .card-head .caret{transform:rotate(90deg);}

  .step-block{margin-top:13px;}
  .step-block .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650;margin-bottom:6px;}
  ol.steps{margin:0;padding-left:20px;}
  ol.steps li{margin:3px 0;color:var(--ink);}
  ol.steps li .exp{color:var(--ink-2);font-size:12px;}
  ol.steps li .exp::before{content:"→ ";color:var(--teal);}

  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;}
  .chip{
    display:inline-flex;align-items:baseline;gap:6px;font-size:11.5px;
    border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:var(--bg);
  }
  .chip .k{color:var(--ink-3);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;}
  .chip .v{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;}

  /* ---------- list / table ---------- */
  .tabletools{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .tabletools .hint{font-size:12px;color:var(--ink-3);}
  .tabletools .spacer{flex:1;}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;}
  .btn:hover{border-color:var(--ink-3);color:var(--ink);}
  .tablewrap{flex:1;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:1020px;font-size:12.5px;}
  table.compact{min-width:0;}
  thead th{
    position:sticky;top:0;background:var(--panel);text-align:left;font-weight:650;color:var(--ink-2);
    font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;
    border-bottom:1px solid var(--line);white-space:nowrap;z-index:1;
  }
  th.chk,td.chk-box-cell{width:32px;padding-left:12px;padding-right:0;}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;color:var(--ink);}
  tbody tr:hover{background:var(--line-2);}
  tbody tr:last-child td{border-bottom:0;}
  td.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink-3);}
  td.name{white-space:normal;min-width:0;font-weight:550;color:var(--ink);}
  .mini{font-size:11px;font-weight:650;padding:2px 8px;border-radius:5px;display:inline-block;}
  .mini.auto{color:var(--teal-dark);border:1px solid var(--teal);background:var(--teal-tint);}
  .mini.manual{color:var(--ink-2);border:1px solid var(--line);background:var(--bg);}
  .platcell{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);}
  .platcell .pic{font-size:12px;}
  .statuscell{font-weight:650;display:inline-flex;align-items:center;gap:6px;}
  .statuscell.pass{color:var(--pass);}
  .statuscell.fail{color:var(--fail);}
  .statuscell.block{color:var(--block);}
  .statuscell.notrun{color:var(--notrun);}
  .statuscell.healed{color:var(--teal-dark);}
  .assignee{display:inline-flex;align-items:center;gap:7px;}
  .avatar{width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;
    font-size:10px;font-weight:700;flex:none;}
  .muted{color:var(--ink-3);}
  .type-chip{font-size:11px;color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;background:var(--bg);}

  .emptyhint{color:var(--ink-3);font-size:13px;padding:40px;text-align:center;}

  /* ---------- lifecycle + priority + trace (shared) ---------- */
  .lifecycle{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:2px 8px;border-radius:5px;}
  .lc-active{color:var(--pass);border:1px solid #bfe6cd;background:#eef8f1;}
  .lc-draft{color:var(--block);border:1px solid #f0d8ab;background:#fdf5e6;}
  .lc-deprecated{color:var(--ink-3);border:1px solid var(--line);background:var(--bg);text-decoration:line-through;}
  .prio{font-weight:700;font-size:11.5px;font-variant-numeric:tabular-nums;}
  .prio-P1{color:var(--fail);}
  .prio-P2{color:var(--block);}
  .prio-P3{color:var(--ink-3);}
  .tracelink{color:var(--teal-dark);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;border-bottom:1px dotted var(--teal);cursor:pointer;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-2);}

  /* ---------- drawer ---------- */
  .drawer-backdrop{position:fixed;inset:0;background:rgba(20,35,40,.28);opacity:0;visibility:hidden;
    transition:opacity .18s;z-index:40;}
  .drawer-backdrop.show{opacity:1;visibility:visible;}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:480px;max-width:92vw;background:var(--panel);
    border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(20,40,45,.10);
    transform:translateX(100%);transition:transform .2s ease;z-index:41;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);}
  .dh-idrow{display:flex;align-items:center;gap:8px;}
  .dh-idrow .drawer-close{margin-left:auto;border:0;background:transparent;font-size:16px;color:var(--ink-3);
    cursor:pointer;line-height:1;padding:4px 6px;border-radius:6px;}
  .dh-idrow .drawer-close:hover{background:var(--line-2);color:var(--ink);}
  .dh-title{display:flex;align-items:center;gap:12px;margin-top:10px;}
  .dh-title > span:first-child{font-size:15px;font-weight:650;flex:1;line-height:1.3;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 18px 40px;}
  .drawer-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;padding-bottom:16px;
    border-bottom:1px solid var(--line-2);}
  .dm-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;}
  .dm-v{font-size:12.5px;color:var(--ink);margin-top:2px;font-weight:550;}
  .drawer-sec{margin-top:18px;}
  .drawer-sec .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
    font-weight:650;margin-bottom:8px;}
  .exec-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
  table.exec-history{min-width:640px;font-size:11.5px;}
  table.exec-history thead th{font-size:10px;padding:7px 9px;}
  table.exec-history tbody td{padding:7px 9px;}
  table.exec-history tr.cur{background:var(--teal-tint);}
  /* trace tag pills (in drawer) */
  .tracetags{display:flex;flex-wrap:wrap;gap:6px;}
  .tracetag{font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--line);border-radius:5px;padding:1px 7px;background:var(--bg);color:var(--ink-2);}
  .tracetag.reg{color:var(--block);border-color:#f0d8ab;background:#fdf5e6;}
  /* oracle full-width row */
  .oracle-row{grid-column:1 / -1;padding-top:10px;margin-top:4px;border-top:1px dashed var(--line-2);}
  .oracle-row .dm-k{margin-bottom:3px;}
  .oracle-row .dm-v{font-style:italic;color:var(--ink-2);font-weight:500;line-height:1.5;}
  /* abstain banner */
  .abstain-banner{border:1px solid #f2c2cb;background:#fdeef1;color:var(--fail);
    border-radius:var(--radius);padding:12px 14px;margin-top:14px;}
  .abstain-banner .ab-hd{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .abstain-banner .ab-body{color:var(--ink);font-size:12.5px;line-height:1.5;}
  .abstain-banner .ab-needed{color:var(--ink-2);font-size:11.5px;margin-top:6px;}
  .abstain-note{margin-top:12px;color:var(--ink-3);font-size:12px;font-style:italic;}
  /* abstain pill in status column */
  .abstain-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    padding:2px 9px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);}
  .abstain-pill .qid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-3);}
  .ai-stub{border:1px dashed var(--line);border-radius:var(--radius);background:var(--bg);padding:12px 14px;}
  .ai-stub .lbl{margin-bottom:4px;}
  .ai-stub-body{font-size:12px;color:var(--ink-3);line-height:1.5;}

  /* ---------- Part B: AI Insights strip in drawer ---------- */
  .ai-insights{border:1px solid var(--line);border-radius:var(--radius);background:#fafcfc;padding:6px 0;}
  .ai-insights .lbl{padding:10px 14px 4px;}
  .insight{padding:10px 14px;border-top:1px dashed var(--line-2);}
  .insight:first-of-type{border-top:0;}
  .insight-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .insight-head .ih-title{font-weight:650;font-size:12.5px;color:var(--ink);}
  .insight-head .ih-conf{font-size:11px;color:var(--ink-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .insight-head .prov{font-size:10.5px;font-weight:650;text-transform:lowercase;letter-spacing:.03em;
    border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-2);background:var(--bg);}
  .prov.measured{color:var(--teal-dark);border-color:#bfdcdc;background:var(--teal-tint);}
  .prov.proxy{color:var(--block);border-color:#f0d8ab;background:#fdf5e6;}
  .prov.asserted{color:var(--ink-2);}
  .prov.abstained{color:var(--fail);border-color:#f2c2cb;background:#fdeef1;}
  .insight-body{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.5;}
  .insight-body .evid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-3);font-size:11px;}
  .insight-actions{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;}
  .insight-actions .btn{padding:4px 9px;font-size:11.5px;}

  /* ---------- Part B: reusable modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,35,40,.32);opacity:0;visibility:hidden;
    transition:opacity .16s;z-index:60;display:grid;place-items:center;padding:24px;}
  .modal-backdrop.show{opacity:1;visibility:visible;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 12px 40px rgba(20,40,45,.18);max-width:560px;width:100%;max-height:82vh;
    display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .modal-head .m-title{font-weight:650;font-size:14px;flex:1;}
  .modal-head .m-close{border:0;background:transparent;font-size:16px;color:var(--ink-3);cursor:pointer;
    padding:4px 6px;border-radius:6px;}
  .modal-head .m-close:hover{background:var(--line-2);color:var(--ink);}
  .modal-body{padding:14px 16px;overflow-y:auto;font-size:12.5px;color:var(--ink);line-height:1.5;}
  .modal-body .m-section{margin-bottom:12px;}
  .modal-body .m-section:last-child{margin-bottom:0;}
  .modal-body .m-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;margin-bottom:4px;}
  /* ---------- Create Test Run form ---------- */
  .ctr-req{color:var(--fail);}
  .ctr-input{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;
    font:inherit;font-size:12.5px;color:var(--ink);background:var(--panel);}
  .ctr-input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint);}
  .ctr-seg{display:flex;gap:8px;}
  .ctr-seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink-2);
    font:inherit;font-size:12.5px;font-weight:600;padding:9px 10px;cursor:pointer;}
  .ctr-seg button.active{border-color:var(--teal);background:var(--teal-tint);color:var(--teal-dark);}
  .ctr-machine{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .ctr-field .m-lbl{margin-bottom:5px;}
  .modal-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;}
  .modal-foot .spacer{flex:1;}
  .modal-foot .audit{font-size:11.5px;color:var(--ink-3);}
  .btn-primary{background:var(--teal);border:1px solid var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn:disabled:hover{border-color:var(--line);color:var(--ink-2);}
  .btn-primary:disabled:hover{background:var(--teal);border-color:var(--teal);color:#fff;}

  /* Change-set modal rows */
  .cs-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line-2);}
  .cs-row:last-child{border-bottom:0;}
  .cs-row input[type=checkbox]{margin-top:3px;}
  .cs-row.warn .cs-title{color:var(--fail);}
  .cs-row .cs-title{font-weight:600;font-size:12.5px;color:var(--ink);}
  .cs-row .cs-detail{font-size:11.5px;color:var(--ink-2);margin-top:2px;}
  .cs-row .cs-detail .old{color:var(--ink-3);text-decoration:line-through;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .cs-row .cs-detail .new{color:var(--teal-dark);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .cs-row .prov{margin-left:6px;}

  /* Toast */
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;
    box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:70;opacity:0;transition:opacity .18s;pointer-events:none;}
  .toast.show{opacity:1;}

  /* ---------- Part B: right-pane authoring assistant (removed from layout) ---------- */
  body:not(.section-home) .chatpane, body:not(.section-home) .pane-reopen.right{display:none!important;}
  .chatpane{
    width:380px;min-width:340px;max-width:420px;
    background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;flex:none;
    transition:width .2s ease, min-width .2s ease, border-color .2s ease;
  }
  .chatpane.collapsed{width:0;min-width:0;border-left:0;}
  .chatpane.collapsed > *{display:none;}
  .chatpane-head{display:flex;align-items:center;gap:8px;
    padding:12px 14px 10px;border-bottom:1px solid var(--line-2);flex:none;}
  .chatpane-head .cp-title{font-weight:650;font-size:13px;color:var(--ink);}
  .chatpane-head .cp-sub{font-size:11px;color:var(--ink-3);flex:1;}
  .chatpane-head .cp-collapse{
    border:0;background:transparent;color:var(--ink-3);font-size:16px;cursor:pointer;
    padding:2px 6px;border-radius:5px;line-height:1;}
  .chatpane-head .cp-collapse:hover{background:var(--line-2);color:var(--ink);}

  .chattoggle{
    display:inline-flex;align-items:center;gap:6px;margin-right:12px;
    border:1px solid var(--line);background:var(--panel);border-radius:6px;
    padding:5px 10px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;
  }
  .chattoggle:hover{border-color:var(--ink-3);color:var(--ink);}
  .chattoggle[aria-pressed="true"]{border-color:var(--teal);color:var(--teal-dark);background:var(--teal-tint);}
  .chattoggle .ct-icon{font-size:12px;}

  .cbar-wrap{background:var(--panel);padding:10px 12px 12px;
    display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden;}
  .cbar-chat{
    flex:1;overflow-y:auto;font-size:12.5px;color:var(--ink);line-height:1.5;
    display:flex;flex-direction:column;gap:8px;padding:2px;
  }
  .cbar-chat:empty{flex:1;}
  .cbar-chat .msg{padding:8px 11px;border-radius:8px;max-width:92%;}
  .cbar-chat .msg.user{align-self:flex-end;background:var(--bg);border:1px solid var(--line);color:var(--ink);}
  .cbar-chat .msg.bot{align-self:flex-start;background:var(--teal-tint);border:1px solid #bfdcdc;color:var(--ink);}
  .cbar-chat .msg.bot b{color:var(--teal-dark);}
  .cbar-clarify{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);flex-wrap:wrap;}
  .cbar-clarify .q{font-weight:600;}
  .cbar-clarify .chip-btn{border:1px solid var(--teal);color:var(--teal-dark);background:var(--teal-tint);
    border-radius:14px;padding:2px 10px;font:inherit;font-size:11.5px;cursor:pointer;}
  .cbar-clarify .chip-btn:hover{background:var(--teal);color:#fff;}
  .cbar-input-row{display:flex;gap:6px;align-items:flex-end;}
  .cbar-input-row .prefix{color:var(--teal);font-weight:700;font-size:13px;padding:6px 2px 0 4px;}
  .cbar-input-row textarea{flex:1;border:1px solid var(--line);border-radius:7px;padding:8px 11px;
    font:inherit;font-size:13px;line-height:1.4;color:var(--ink);background:var(--panel);
    resize:none;min-height:52px;}
  .cbar-input-row textarea:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint);}
  .cbar-input-row .cbar-submit{border:1px solid var(--teal);background:var(--teal);color:#fff;
    border-radius:7px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;
    align-self:flex-end;margin-bottom:1px;}
  .cbar-examples{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .cbar-examples .ex{font-size:12.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;
    padding:4px 11px;cursor:pointer;background:var(--bg);}
  .cbar-examples .ex:hover{color:var(--ink);border-color:var(--ink-3);}

  /* Draft preview card (inline in content) */
  .draft-card{border:1.5px dashed var(--teal);background:#f2fafa;border-radius:var(--radius);
    padding:12px 14px;margin-bottom:12px;}
  .draft-card .dc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .draft-card .dc-title{font-weight:650;flex:1;}
  .draft-card .dc-body{font-size:12px;color:var(--ink-2);line-height:1.5;}
  .draft-card .dc-body b{color:var(--ink);}
  .draft-card .dc-actions{margin-top:9px;display:flex;gap:6px;}

  /* Smart-CTA strip */
  .cta-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .runsummary .cta-strip{margin-top:10px;width:100%;}
  .scenario-head .cta-strip{margin-top:8px;}

  /* Row action menu (⋯ in list) */
  .rowmenu-trigger{border:0;background:transparent;color:var(--ink-3);cursor:pointer;
    font-size:14px;padding:0 6px;border-radius:4px;line-height:1;margin-left:6px;}
  .rowmenu-trigger:hover{background:var(--line-2);color:var(--ink);}
  .rowmenu{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;box-shadow:var(--shadow);padding:4px;z-index:50;min-width:150px;}
  .rowmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;
    font:inherit;font-size:12px;padding:6px 8px;color:var(--ink);cursor:pointer;border-radius:4px;}
  .rowmenu button:hover{background:var(--line-2);}

  /* Activity link */
  .activity-link{margin-left:auto;font-size:12px;color:var(--teal-dark);cursor:pointer;
    border:0;background:transparent;border-bottom:1px dotted var(--teal);padding:0;font:inherit;}
  .audit-list{list-style:none;padding:0;margin:0;}
  .audit-list li{padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:12px;color:var(--ink-2);}
  .audit-list li:last-child{border-bottom:0;}
  .audit-list li b{color:var(--ink);font-weight:600;}
  .audit-list li .when{color:var(--ink-3);font-size:11px;margin-left:4px;}

  /* ---------- Part D: collapse controls (left nav + assistant pane) ---------- */
  .navhead{display:flex;align-items:center;gap:8px;}
  .navhead .nh-title{flex:1;}
  .nav-collapse{border:0;background:transparent;color:var(--ink-3);font-size:15px;line-height:1;
    cursor:pointer;padding:2px 6px;border-radius:5px;}
  .nav-collapse:hover{background:var(--line-2);color:var(--ink);}
  .nav.collapsed{display:none;}
  .pane-reopen{position:fixed;top:64px;z-index:35;border:1px solid var(--line);background:var(--panel);
    color:var(--teal-dark);cursor:pointer;box-shadow:var(--shadow);font-size:14px;font-weight:700;
    padding:11px 5px;line-height:1;}
  .pane-reopen:hover{background:var(--teal-tint);}
  .pane-reopen.left{left:184px;border-radius:0 8px 8px 0;}
  .pane-reopen.right{right:0;border-radius:8px 0 0 8px;}
  .pane-reopen.labelled{padding:9px 14px;font-size:12px;font-weight:650;white-space:nowrap;
    top:76px;background:transparent;box-shadow:none;}
  .pane-reopen.labelled:hover{background:var(--teal-tint);}

  /* ---------- Part D: Atto AI chat list (second nav) ---------- */
  .chatlist{display:flex;flex-direction:column;gap:2px;}
  .cl-new{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    border:1px solid var(--teal);background:var(--teal-tint);color:var(--teal-dark);
    border-radius:7px;padding:8px 10px;font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;margin-bottom:8px;}
  .cl-new:hover{background:var(--teal);color:#fff;}
  .cl-group{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
    font-weight:650;padding:8px 8px 4px;}
  .cl-item{display:flex;align-items:center;gap:4px;width:100%;text-align:left;border:0;background:transparent;
    padding:7px 9px;border-radius:6px;cursor:pointer;color:var(--ink-2);position:relative;}
  .cl-item:hover{background:var(--line-2);}
  .cl-item.active{background:var(--teal-tint);}
  .cl-item .cl-title{flex:1;font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .cl-item.active .cl-title{color:var(--teal-dark);}
  .cl-item .cl-menu-trigger{flex:none;opacity:0;border:0;background:transparent;color:var(--ink-3);
    cursor:pointer;padding:2px 5px;border-radius:5px;font-size:13px;line-height:1;}
  .cl-item:hover .cl-menu-trigger, .cl-item .cl-menu-trigger.open{opacity:1;}
  .cl-item .cl-menu-trigger:hover{background:var(--line-2);color:var(--ink);}
  .cl-item.active .cl-menu-trigger:hover{background:var(--panel);}
  .cl-item .cl-meta{font-size:10.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;}
  .cl-item .cl-src{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:9.5px;
    text-transform:uppercase;letter-spacing:.03em;}

  /* ---------- Part D: Atto AI chat home + conversation ---------- */
  .atto-home{max-width:720px;margin:0 auto;padding:36px 8px 24px;}
  .atto-home .ah-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;
    color:var(--teal-dark);background:var(--teal-tint);border:1px solid #bfdcdc;border-radius:20px;padding:3px 11px;}
  .atto-home h2{font-size:22px;margin:14px 0 6px;font-weight:700;letter-spacing:-.01em;}
  .atto-home .ah-sub{color:var(--ink-2);font-size:13px;margin:0 0 18px;line-height:1.55;max-width:60ch;}
  .atto-composer{border:1px solid var(--line);border-radius:12px;background:var(--panel);
    box-shadow:var(--shadow);padding:12px 14px;}
  .atto-composer textarea{width:100%;border:0;resize:none;font:inherit;font-size:14px;color:var(--ink);
    background:transparent;min-height:60px;line-height:1.5;}
  .atto-composer textarea:focus{outline:0;}
  .atto-composer .ac-foot{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:10px;
    border-top:1px solid var(--line-2);}
  .atto-attach{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--bg);
    border-radius:7px;padding:5px 10px;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;}
  .atto-attach:hover{border-color:var(--ink-3);color:var(--ink);}
  .atto-composer .ac-gen{margin-left:auto;border:1px solid var(--teal);background:var(--teal);color:#fff;
    border-radius:8px;padding:7px 16px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;}
  .atto-composer .ac-gen:hover{background:var(--teal-dark);border-color:var(--teal-dark);}
  .atto-attached{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .atto-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid var(--line);
    background:var(--bg);border-radius:6px;padding:3px 9px;color:var(--ink-2);}
  .atto-chip .x{cursor:pointer;color:var(--ink-3);font-weight:700;}
  .atto-examples{margin-top:22px;}
  .atto-examples .ae-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
    font-weight:650;margin-bottom:9px;}
  .atto-ex{display:flex;flex-direction:column;gap:8px;}
  .atto-ex button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;
    padding:11px 13px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);}
  .atto-ex button:hover{border-color:var(--teal);background:var(--teal-tint);}
  .atto-ex button .ae-src{color:var(--ink-3);font-size:11px;margin-top:3px;}

  .atto-convo{max-width:760px;margin:0 auto;padding:20px 8px 24px;}
  .atto-msg{margin-bottom:14px;display:flex;gap:10px;}
  .atto-msg .am-av{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;
    font-size:12px;font-weight:700;}
  .atto-msg.user .am-av{background:var(--ink);color:#fff;}
  .atto-msg.bot .am-av{background:var(--teal);color:#fff;}
  .atto-msg .am-body{font-size:13px;color:var(--ink);line-height:1.55;padding-top:3px;}
  .atto-msg .am-body b{font-weight:650;}
  .atto-draftlist{display:flex;flex-direction:column;gap:8px;margin-top:10px;}

  /* ---------- Part E: Releases (All Releases list + release detail summary) ---------- */
  .allrel-head{margin-bottom:16px;}
  .allrel-head h2{font-size:16px;margin:0 0 4px;font-weight:650;}
  .allrel-head p{margin:0;color:var(--ink-2);font-size:12.5px;max-width:70ch;}

  .rel-index{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
    box-shadow:var(--shadow);overflow:hidden;}
  .rel-index table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
  .rel-index thead th{position:sticky;top:0;background:var(--panel);text-align:left;
    font-weight:650;color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .rel-index tbody td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;}
  .rel-index tbody tr:last-child td{border-bottom:0;}
  .rel-index tbody tr{cursor:pointer;}
  .rel-index tbody tr:hover{background:var(--line-2);}
  .rel-index .r-name{font-weight:650;color:var(--ink);}
  .rel-index .r-sub{color:var(--ink-3);font-size:11.5px;font-weight:500;margin-top:2px;display:block;}
  .rel-index .r-bar{width:180px;}
  .rel-index .r-pct{font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink);}
  .rel-index .r-suites{font-size:11.5px;color:var(--ink-2);}

  /* Breadcrumb above the tabs in a drilled release */
  .rel-breadcrumb{padding:10px 18px 0;display:flex;align-items:center;gap:6px;
    background:var(--panel);border-bottom:1px solid var(--line-2);font-size:12px;color:var(--ink-3);}
  .rel-breadcrumb .rb-link{color:var(--teal-dark);border:0;background:transparent;font:inherit;
    font-size:12px;cursor:pointer;padding:0;border-bottom:1px dotted var(--teal);}
  .rel-breadcrumb .rb-link:hover{color:var(--teal);}
  .rel-breadcrumb .rb-sep{color:var(--ink-3);}
  .rel-breadcrumb .rb-current{color:var(--ink);font-weight:600;}

  /* Summary tab cards */
  .rel-card{background:none;background-color:transparent;border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px;margin-top:20px;}
  .rel-card .rc-title{font-size:12.5px;font-weight:650;color:var(--ink);margin-bottom:12px;
    display:flex;align-items:center;gap:8px;}
  .rel-card .rc-title .rc-sub{color:var(--ink-3);font-weight:500;font-size:11.5px;}

  /* Suites strip inside Test run status card */
  .suites-strip{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .suite-row{display:flex;align-items:center;gap:14px;padding:9px 12px;
    border:1px solid var(--line);border-radius:7px;background:var(--bg);cursor:pointer;transition:background .12s;}
  .suite-row:hover{background:var(--line-2);border-color:var(--ink-3);}
  .suite-row .s-name{font-weight:650;font-size:12.5px;flex:none;min-width:140px;}
  .suite-row .s-meta{font-size:11px;color:var(--ink-3);flex:1;}
  .suite-row .s-counts{display:flex;gap:8px;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none;}
  .suite-row .s-bar{width:120px;flex:none;}
  .suite-row .s-pct{width:36px;text-align:right;font-weight:650;font-size:12px;font-variant-numeric:tabular-nums;flex:none;}

  /* Business context — the beige card */
  .biz-card{background:#f4efe1;border:1px solid #e6dcc4;border-radius:var(--radius);padding:16px 18px;}
  .biz-card .bc-eyebrow{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;
    color:#8a7846;margin-bottom:10px;}
  .biz-card dl{display:grid;grid-template-columns:150px 1fr;row-gap:9px;column-gap:22px;margin:0;font-size:12.5px;}
  .biz-card dt{color:var(--ink-2);font-weight:600;}
  .biz-card dd{margin:0;color:var(--ink);}
  .biz-card dd b{font-weight:650;}

  /* Feature run summary rows */
  .feat-list{display:flex;flex-direction:column;gap:6px;}
  .feat-row{display:flex;align-items:center;gap:14px;padding:9px 12px;border:1px solid var(--line);
    border-radius:7px;cursor:pointer;transition:background .12s;background:var(--panel);}
  .feat-row:hover{background:var(--line-2);border-color:var(--ink-3);}
  .feat-row .f-name{font-weight:600;flex:1;font-size:12.5px;color:var(--ink);}
  .feat-row .f-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .feat-row .f-count{font-size:11.5px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums;}
  .feat-row .f-bar{width:140px;flex:none;}
  .feat-row .f-pct{font-weight:650;font-size:12px;font-variant-numeric:tabular-nums;width:40px;text-align:right;flex:none;}
  .feat-row .f-arrow{color:var(--ink-3);flex:none;font-size:14px;}

  /* Suite filter chips (Test Cases tab) */
  .suite-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  .suite-chips .sc-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
    font-weight:650;margin-right:4px;}
  .suite-chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;
    padding:4px 12px;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;}
  .suite-chip:hover{border-color:var(--ink-3);color:var(--ink);}
  .suite-chip.active{background:var(--teal);border-color:var(--teal);color:#fff;}
  .feat-filter{margin-left:auto;font-size:11.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;}
  .feat-filter .ff-x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1;}

  /* All Releases list: gate + target-ship columns */
  .gate-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
  .gate-chip.go{background:#eef8f1;color:var(--pass);border:1px solid #bfe6cd;}
  .gate-chip.conditional{background:#fdf5e6;color:var(--block);border:1px solid #f0d8ab;}
  .gate-chip.nogo{background:#fdeef1;color:var(--fail);border:1px solid #f2c2cb;}

  /* ---------- Test Cases › Insights: flaky-signal + machine-matrix pills ---------- */
  .tci-pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;
    letter-spacing:.03em;text-transform:uppercase;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .tci-pill.tci-amber{background:#fdf5e6;color:var(--block);border:1px solid #f0d8ab;}
  .tci-pill.tci-red{background:#fdeef1;color:var(--fail);border:1px solid #f2c2cb;}
  .tci-pill.tci-neutral{background:var(--line-2);color:var(--ink-2);border:1px solid var(--line);}

  /* ---------- Part F: Release Gate (adapted from qi-dashboard.html §2, white bg) ---------- */
  .gate-block{border-left:3px solid var(--line-2);}
  .gate-block.go{border-left-color:var(--pass);}
  .gate-block.conditional{border-left-color:var(--block);}
  .gate-block.nogo{border-left-color:var(--fail);}
  .gate-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
  .gate-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;padding:4px 11px;border-radius:20px;flex:none;}
  .gate-pill.go{background:#eef8f1;color:var(--pass);border:1px solid #bfe6cd;}
  .gate-pill.conditional{background:#fdf5e6;color:var(--block);border:1px solid #f0d8ab;}
  .gate-pill.nogo{background:#fdeef1;color:var(--fail);border:1px solid #f2c2cb;}
  .gate-headline{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--ink);}
  .gate-block ul{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--ink);line-height:1.6;}
  .gate-block li{margin:5px 0;}
  .gate-why{color:var(--ink-3);font-size:12px;margin-top:12px;font-style:italic;line-height:1.5;}

  /* --- Release summary v2: header strip + Test Plans & Execution --- */
  .rls-header{display:grid;grid-template-columns:60% 40%;gap:0;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .rls-hdr-left{padding:16px 18px;}
  .rls-hdr-right{padding:16px 18px;border-left:1px solid var(--line-2);background:#fff;}
  .rls-eyebrow{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:10px;}
  .rls-hdr-primary{display:grid;grid-template-columns:120px 1fr;row-gap:6px;column-gap:16px;
    font-size:14px;color:var(--ink);margin-bottom:10px;}
  .rls-hdr-primary dt{color:var(--ink-2);font-weight:600;}
  .rls-hdr-primary dd{margin:0;color:var(--ink);font-weight:650;}
  .rls-hdr-secondary{display:grid;grid-template-columns:120px 1fr;row-gap:5px;column-gap:16px;
    font-size:12px;color:var(--ink-3);margin:0;padding-top:8px;border-top:1px dashed var(--line-2);}
  .rls-hdr-secondary dt{color:var(--ink-3);font-weight:600;}
  .rls-hdr-secondary dd{margin:0;color:var(--ink-2);}
  .rls-gate-headline{font-size:13px;color:var(--ink);margin:10px 0 8px;line-height:1.45;font-weight:600;}
  .rls-gate-rules{margin:0;padding-left:18px;font-size:11.5px;color:var(--ink-3);line-height:1.55;}
  .rls-gate-rules li{margin:3px 0;}

  .rls-plans{background:none;background-color:transparent;border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 16px;margin-top:20px;}
  .rls-plans .rls-plans-title{font-size:13px;font-weight:650;color:var(--ink);}
  .rls-plans .rls-plans-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px;margin-bottom:12px;}
  .rls-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line-2);padding-bottom:0;margin-bottom:14px;flex-wrap:wrap;}
  .rls-tab{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px 6px 0 0;
    background:transparent;border:1px solid transparent;border-bottom:2px solid transparent;
    cursor:pointer;font-size:12px;color:var(--ink-2);margin-bottom:-1px;}
  .rls-tab:hover{background:var(--line-2);}
  .rls-tab.active{color:var(--teal-dark);background:var(--teal-tint);border-bottom-color:var(--teal);font-weight:650;}
  .rls-tab .rls-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .rls-tab .rls-tab-sub{color:var(--ink-3);font-weight:500;font-size:11px;}
  .rls-tab.active .rls-tab-sub{color:var(--teal-dark);}

  .rls-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
  .rls-tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 12px;}
  .rls-tile .rls-tile-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-3);font-weight:650;}
  .rls-tile .rls-tile-v{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.1;}
  .rls-tile .rls-tile-v.pass{color:var(--pass);}
  .rls-tile .rls-tile-v.warn{color:var(--block);}
  .rls-tile .rls-tile-v.fail{color:var(--fail);}
  .rls-tile .rls-tile-sub{font-size:11px;color:var(--ink-3);margin-top:2px;}

  .rls-plan-card{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--bg);}
  .rls-plan-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .rls-plan-title{font-size:13px;font-weight:650;color:var(--ink);flex:1;display:flex;
    align-items:center;gap:8px;flex-wrap:wrap;}
  .rls-auto-badge{font-size:10px;font-weight:650;color:var(--teal-dark);border:1px solid var(--teal);
    background:var(--teal-tint);border-radius:10px;padding:2px 7px;letter-spacing:.02em;}
  .rls-add-btn{border:1px solid var(--teal);background:var(--panel);color:var(--teal-dark);
    border-radius:6px;padding:5px 11px;font-size:11.5px;font-weight:650;cursor:pointer;flex:none;}
  .rls-add-btn:hover{background:var(--teal-tint);}
  .rls-plan-desc{font-size:11.5px;color:var(--ink-3);margin:0 0 10px;line-height:1.5;}
  .rls-suites{display:flex;flex-direction:column;gap:6px;}
  .rls-suite-row{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);
    border:1px solid var(--line);border-radius:6px;cursor:pointer;}
  .rls-suite-row:hover{background:var(--line-2);border-color:var(--ink-3);}
  .rls-suite-left{flex:1;min-width:0;}
  .rls-suite-name{font-size:12.5px;font-weight:650;color:var(--ink);}
  .rls-suite-meta{font-size:11px;color:var(--ink-3);margin-top:2px;}
  .rls-suite-counts{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none;}
  .rls-suite-counts .rls-c-pass{color:var(--pass);}
  .rls-suite-counts .rls-c-fail{color:var(--fail);}
  .rls-suite-counts .rls-c-nr{color:var(--ink-3);}

  .qm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .qm-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 16px;}
  .qm-card .qm-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
    font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .qm-card .qm-v{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--ink);}
  .qm-card .qm-v .qm-unit{font-size:12px;color:var(--ink-3);font-weight:600;margin-left:4px;}
  .qm-card .qm-sub{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.5;}
  .qm-pill{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:12px;}
  .qm-pill.warn{background:#fdf5e6;color:var(--block);}
  .qm-pill.crit{background:#fdeef1;color:var(--fail);}

  .wf{margin-top:10px;font-size:13px;}
  .wf-row{display:grid;grid-template-columns:170px 1fr 46px;gap:12px;align-items:center;padding:6px 0;}
  .wf-row+.wf-row{border-top:1px dashed var(--line-2);}
  .wf-row .wf-lbl{color:var(--ink-3);}
  .wf-row .wf-bar{height:8px;background:var(--bg);border-radius:2px;position:relative;}
  .wf-row .wf-bar b{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--teal);}
  .wf-row .wf-bar.neg b{background:var(--fail);}
  .wf-row .wf-bar.warnbar b{background:var(--block);}
  .wf-row .wf-val{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink);}
  .wf-row .wf-val.neg{color:var(--fail);}
  .prio-P0{color:var(--fail);}

  /* ---------- Part G: Home dashboard (qi-dashboard.html §1, scoped, white bg) ----------
     Loaded verbatim from ../nostalgic-benz-2f7c3a/qi-dashboard.html §1 Manager tab.
     All classes prefixed with .qi-home so they don't collide with v3's own .card/.pill/etc.
     Only the KPI grid + twoup + track record are pulled in — the source's h1/lede/case
     box/attention strip/section markers aren't included per the user's screenshot scope. */
  .qi-home{
    --qh-ground:#ffffff;
    --qh-callout:#f4f2ec;
    --qh-hairline:#e3e0d3;
    --qh-hairline-strong:#c6c0a7;
    --qh-ink:#1B1A16;
    --qh-muted:#5A5850;
    --qh-dim:#8A8577;
    --qh-accent:#38513B;
    --qh-accent-soft:#5E7A61;
    --qh-accent-pale:#B8C7BA;
    --qh-good:#38513B;
    --qh-warn:#B27E28;
    --qh-warn-soft:#D4A75B;
    --qh-crit:#9A3B2B;
    --qh-crit-soft:#C48273;
    color:var(--qh-ink);max-width:1100px;margin:0 auto;padding:4px 4px 40px;
  }
  .qi-home .qh-head{display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  .qi-home .qh-title{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0;}
  .qi-home .qh-filter{display:flex;background:var(--qh-callout);border:1px solid var(--qh-hairline);
    border-radius:7px;padding:2px;flex:none;}
  .qi-home .qh-filter button{border:0;background:transparent;padding:6px 16px;border-radius:5px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--qh-muted);cursor:pointer;}
  .qi-home .qh-filter button.active{background:var(--qh-ground);color:var(--qh-ink);
    box-shadow:0 1px 2px rgba(20,40,45,.08);}

  .qi-home .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .qi-home .card{background:var(--qh-ground);padding:20px 22px 18px;
    border:1px solid var(--qh-hairline);border-radius:8px;}
  .qi-home .card .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--qh-muted);
    font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .qi-home .card .v{font-size:34px;font-weight:700;letter-spacing:-.02em;margin-top:6px;
    font-variant-numeric:tabular-nums;line-height:1.05;}
  .qi-home .card .v .unit{font-size:14px;color:var(--qh-muted);font-weight:600;margin-left:4px;}
  .qi-home .card .sub{font-size:13.5px;color:var(--qh-muted);margin-top:6px;}
  .qi-home .card .sub b{color:var(--qh-ink);font-weight:600;}
  .qi-home .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;
    letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:var(--qh-callout);color:var(--qh-muted);}
  .qi-home .pill.good{background:#DDE5DE;color:var(--qh-good);}
  .qi-home .pill.warn{background:#EFE1C6;color:var(--qh-warn);}
  .qi-home .pill.crit{background:#EED9D2;color:var(--qh-crit);}
  .qi-home .info{display:inline-block;width:14px;height:14px;border-radius:50%;
    border:1px solid var(--qh-hairline-strong);color:var(--qh-muted);font-size:9.5px;line-height:12px;
    text-align:center;font-style:italic;font-family:Georgia,serif;cursor:help;font-weight:600;}
  .qi-home .strip{display:flex;gap:2px;align-items:flex-end;height:34px;margin-top:10px;}
  .qi-home .strip span{flex:1;background:var(--qh-accent-soft);opacity:.65;border-radius:1px;}
  .qi-home .strip span.now{background:var(--qh-accent);opacity:1;}
  .qi-home .strip.drop span{background:var(--qh-crit-soft);opacity:.9;}
  .qi-home .strip.drop span.now{background:var(--qh-good);}
  .qi-home .stack{display:flex;height:26px;border-radius:2px;overflow:hidden;margin-top:12px;background:var(--qh-callout);}
  .qi-home .stack span{display:block;height:100%;}
  .qi-home .stack .s-unit{background:#B8C7BA;}
  .qi-home .stack .s-int{background:#8FAA93;}
  .qi-home .stack .s-qa{background:var(--qh-accent);}
  .qi-home .stack .s-stg{background:var(--qh-warn-soft);}
  .qi-home .stack .s-prod{background:var(--qh-crit);}
  .qi-home .legend{display:flex;flex-wrap:wrap;gap:14px 18px;margin-top:10px;font-size:12px;color:var(--qh-muted);}
  .qi-home .legend .sw{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:6px;vertical-align:middle;}
  .qi-home .ages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
  .qi-home .age{background:var(--qh-callout);padding:10px 12px;border-radius:2px;}
  .qi-home .age .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .qi-home .age .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--qh-muted);font-weight:600;}
  .qi-home .age.crit{background:#EED9D2;}
  .qi-home .age.warn{background:#EFE1C6;}
  .qi-home .foot{color:var(--qh-muted);font-family:Georgia,serif;font-size:13.5px;margin-top:14px;}
  .qi-home .foot em{color:var(--qh-ink);}
  .qi-home .twoup{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--qh-hairline);
    border:1px solid var(--qh-hairline);margin-top:24px;}
  .qi-home .twoup > div{background:var(--qh-ground);padding:22px 24px;}
  .qi-home .twoup .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--qh-muted);font-weight:600;}
  .qi-home .twoup .headline{font-size:18px;font-weight:700;margin-top:8px;letter-spacing:-.01em;}
  .qi-home .twoup .headline em{font-family:Georgia,serif;font-style:italic;font-weight:500;color:var(--qh-accent);}
  .qi-home .twoup .why{font-size:13.5px;color:var(--qh-muted);margin-top:8px;font-family:Georgia,serif;}
  .qi-home .twoup ul{margin:8px 0 0;padding-left:18px;font-size:14px;}
  .qi-home .twoup li{padding:3px 0;}
  .qi-home .qh-sec{margin:32px 0 4px;font-size:16px;font-weight:700;letter-spacing:-.01em;}
  .qi-home .qh-sec-sub{color:var(--qh-muted);font-size:13px;font-family:Georgia,serif;margin:0 0 12px;}
  .qi-home .trk{display:grid;grid-template-columns:0.9fr 0.9fr 1.1fr 0.9fr 0.9fr;gap:0;margin-top:8px;font-size:14px;}
  .qi-home .trk > *{padding:12px 12px;border-bottom:1px solid var(--qh-hairline);font-variant-numeric:tabular-nums;}
  .qi-home .trk .h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--qh-muted);font-weight:600;
    border-bottom-color:var(--qh-hairline-strong);}
  .qi-home .trk .rel{font-weight:600;font-variant-numeric:normal;}
  .qi-home .trk .now{background:var(--qh-callout);}
  .qi-home .trk .go{color:var(--qh-good);font-weight:700;}
  .qi-home .trk .cond{color:var(--qh-warn);font-weight:700;}
  .qi-home .trk .nogo{color:var(--qh-crit);font-weight:700;}
  @media(max-width:720px){
    .qi-home .cards{grid-template-columns:1fr;}
    .qi-home .twoup{grid-template-columns:1fr;}
    .qi-home .trk{grid-template-columns:1fr 1fr;font-size:13px;}
  }

  /* ---------- clickable dashboard cards (Home) ---------- */
  .qi-home .card.clickable{cursor:pointer;position:relative;transition:border-color .12s,box-shadow .12s,transform .12s;}
  .qi-home .card.clickable:hover{border-color:var(--teal);box-shadow:0 2px 10px rgba(13,139,139,.10);}
  .qi-home .card.clickable::after{
    content:"›";position:absolute;top:10px;right:14px;font-size:18px;line-height:1;
    color:var(--teal);opacity:0;transition:opacity .12s,transform .12s;font-weight:700;
  }
  .qi-home .card.clickable:hover::after{opacity:1;transform:translateX(2px);}

  /* ---------- Dashboard-card pop-up (wide modal) ---------- */
  .modal.wide{max-width:920px;}
  .dcm-sub{font-size:12.5px;color:var(--ink-2);margin-bottom:12px;line-height:1.5;}
  .dcm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:10px;}
  .dcm-stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow);}
  .dcm-stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;}
  .dcm-stat .v{font-size:16px;font-weight:650;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums;}
  .dcm-stat .stat-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;}
  .dcm-stat .stat-row .v{margin-top:0;}
  .dcm-stat .spark-wrap{flex:none;display:flex;align-items:center;}
  .dcm-stat .spark{display:block;}
  .dcm-simtag{font-size:11px;color:var(--ink-3);margin:2px 0 12px;font-style:italic;}
  .dcm-tablewrap{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:52vh;background:var(--panel);box-shadow:var(--shadow);}
  .dcm-tablewrap table{width:100%;border-collapse:collapse;font-size:12px;}
  .dcm-tablewrap th,.dcm-tablewrap td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top;white-space:nowrap;}
  .dcm-tablewrap th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;background:var(--line-2);position:sticky;top:0;z-index:1;}
  .dcm-tablewrap tr:last-child td{border-bottom:0;}
  .dcm-tablewrap td.wrap{white-space:normal;min-width:220px;}
  .dcm-tablewrap tr.cge-grouphdr td{background:var(--cream,var(--line-2));color:var(--ink-2);
    font-weight:650;font-size:11px;padding:7px 10px;}
  .dcm-pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:650;
    background:var(--line-2);color:var(--ink-2);letter-spacing:.03em;}

  /* ---------- version picker ---------- */
  .verpick{display:inline-flex;align-items:center;gap:8px;margin-right:14px;}
  .verpick-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650;}
  .verpick select{
    font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:5px 26px 5px 10px;cursor:pointer;
    -webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='none' stroke='%237a878e' stroke-width='1.5' d='M1 1l4 4 4-4'/></svg>");
    background-repeat:no-repeat;background-position:right 9px center;
  }
  .verpick select:hover{border-color:var(--ink-3);}
  .verpick select:focus{outline:2px solid var(--teal-tint);outline-offset:1px;border-color:var(--teal);}

  /* ---------- Testcraft authoring view (scoped under .tc-view) ---------- */
  .tc-view {
    --bg:#FFFFFF; --cream:#f2f4f5; --cream-2:#e7ebec;
    --ink:#1c2529; --ink-2:#48555c; --muted:#7a878e;
    --line:#e3e8ea; --line-2:#eef2f3;
    --olive:var(--teal-dark); --olive-soft:var(--teal-tint);
    --sage:#93A98A;
    --terracotta:#d1435b; --terracotta-soft:#fdeef1;
    --gold:#C08A2E; --gold-soft:#F2E7CF;
    --user-bg:#1c2529; --user-ink:#F5F1E8;
    position:fixed; inset:0; z-index:1000;
    background:var(--bg); color:var(--ink);
    font-family:var(--font-sans);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .tc-view * { box-sizing:border-box; }
  .tc-view .sans { font-family:var(--font-sans); }
  .tc-view .mono { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  .tc-view .app { display:grid; grid-template-rows:54px 1fr; height:100%; min-height:640px; }
  .tc-view .rail { display:flex; align-items:center; gap:18px; padding:0 22px; border-bottom:1px solid var(--line); background:var(--bg); }
  .tc-view .brand { display:flex; align-items:baseline; gap:6px; font-weight:700; font-size:15px; }
  .tc-view .brand .dot { color:var(--terracotta); }
  .tc-view .brand-sub { font-family:var(--font-sans); color:var(--muted); font-weight:500; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; margin-left:4px; }
  .tc-view .rail-spacer { flex:1; }
  .tc-view .tc-back { all:unset; cursor:pointer; font-family:var(--font-sans); font-size:11.5px; color:var(--ink-2); padding:5px 10px; border-radius:999px; border:1px solid var(--line-2); background:var(--bg); }
  .tc-view .tc-back:hover { background:var(--cream-2); border-color:var(--olive); }
  .tc-view .stepper { display:inline-flex; align-items:center; font-family:var(--font-sans); font-size:12px; }
  .tc-view .stepper .step { all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; color:var(--muted); }
  .tc-view .stepper .step:hover { background:var(--cream-2); color:var(--ink-2); }
  .tc-view .stepper .step .n { width:17px; height:17px; border-radius:50%; background:var(--cream); color:var(--ink-2); display:grid; place-items:center; font-size:10px; font-weight:700; }
  .tc-view .stepper .step[aria-current="step"] { background:transparent; border:1px solid var(--olive); color:var(--olive); }
  .tc-view .stepper .step[aria-current="step"] .n { background:var(--olive); color:#fff; }
  .tc-view .stepper .step.disabled { cursor:not-allowed; opacity:0.55; }
  .tc-view .stepper .step.disabled:hover { background:transparent; }
  .tc-view .stepper .arrow { color:var(--line-2); margin:0 2px; font-size:11px; }
  .tc-view .rail-meta { font-family:var(--font-sans); color:var(--muted); font-size:11.5px; }
  .tc-view .rail-meta strong { color:var(--ink-2); font-weight:600; }
  .tc-view .panes { display:grid; grid-template-columns:26% 74%; min-height:0; }
  .tc-view .chat, .tc-view .work { min-height:0; display:flex; flex-direction:column; }
  .tc-view .chat { border-right:1px solid var(--line); background:var(--bg); }
  .tc-view .chat-head { padding:16px 20px 12px; border-bottom:1px solid var(--line); font-family:var(--font-sans); }
  .tc-view .chat-head .title { font-weight:700; font-size:13px; }
  .tc-view .chat-head .sub { color:var(--muted); font-size:11.5px; margin-top:2px; }
  .tc-view .chat-scroll { flex:1; overflow-y:auto; padding:16px 20px 8px; display:flex; flex-direction:column; gap:12px; font-family:var(--font-sans); }
  .tc-view .msg { display:flex; gap:9px; }
  .tc-view .msg .who { width:22px; height:22px; border-radius:50%; flex-shrink:0; display:grid; place-items:center; font-size:10px; font-weight:700; }
  .tc-view .msg.agent .who { background:var(--cream); color:var(--ink-2); }
  .tc-view .msg.user .who { background:var(--ink); color:var(--user-ink); }
  .tc-view .msg .body { font-size:12.5px; color:var(--ink); }
  .tc-view .msg .body p { margin:0 0 4px; }
  .tc-view .msg .body p:last-child { margin-bottom:0; }
  .tc-view .msg.user .bubble { background:var(--cream); color:var(--ink); padding:7px 10px; border-radius:9px; display:inline-block; font-size:12.5px; cursor:default; }
  .tc-view .msg.user .bubble:hover { background:var(--cream-2); }
  .tc-view .stage-chip { display:inline-flex; align-items:center; gap:5px; background:var(--cream); color:var(--ink-2); padding:2px 8px; border-radius:999px; font-size:10px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; margin-bottom:5px; }
  .tc-view .stage-chip .dot { width:4px; height:4px; border-radius:50%; background:var(--ink-3); }
  .tc-view .chat-input { border-top:1px solid var(--line); padding:12px 14px; background:var(--bg); }
  .tc-view .chat-input .box { border:1px solid var(--line-2); background:var(--cream-2); border-radius:10px; padding:9px 12px; color:var(--muted); font-family:var(--font-sans); font-size:12.5px; display:flex; align-items:center; justify-content:space-between; cursor:text; }
  .tc-view .chat-input .box:hover { border-color:var(--olive); }
  .tc-view .chat-input .box .kbd { font-family:ui-monospace,monospace; font-size:10px; color:var(--muted); border:1px solid var(--line-2); border-radius:4px; padding:1px 5px; }
  .tc-view .work { background:var(--bg); }
  .tc-view .work-head { padding:18px 30px 16px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; border-bottom:1px solid var(--line); }
  .tc-view .work-head .eyebrow { font-family:var(--font-sans); color:var(--muted); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; font-weight:600; margin-bottom:6px; }
  .tc-view .work-head h1 { margin:0; font-size:24px; font-weight:700; letter-spacing:-0.01em; text-wrap:balance; }
  .tc-view .work-head h1 em { color:var(--ink-2); font-style:italic; font-weight:400; }
  .tc-view .head-meta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-family:var(--font-sans); }
  .tc-view .head-meta .pill { background:var(--cream); border:1px solid var(--line); padding:3px 9px; border-radius:999px; font-size:11px; color:var(--ink-2); font-weight:500; cursor:default; }
  .tc-view .head-meta .pill:hover { background:var(--cream-2); }
  .tc-view .head-meta .pill.warn { background:var(--gold-soft); color:var(--gold); border-color:transparent; }
  .tc-view .work-body { flex:1; overflow-y:auto; padding:26px 30px 44px; }
  .tc-view .intake { max-width:700px; display:flex; flex-direction:column; gap:16px; }
  .tc-view .card { background:var(--cream-2); border:1px solid var(--line); border-radius:10px; padding:18px 20px; font-family:var(--font-sans); }
  .tc-view .card .label { color:var(--muted); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700; margin-bottom:8px; }
  .tc-view .card h2 { margin:0 0 12px; font-size:15px; font-weight:600; font-family:"Iowan Old Style",Georgia,serif; }
  .tc-view .badge-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; }
  .tc-view .badge { display:flex; flex-direction:column; gap:2px; padding:9px 11px; background:var(--bg); border-radius:8px; border:1px solid var(--line); cursor:default; }
  .tc-view .badge:hover { border-color:var(--line-2); }
  .tc-view .badge .k { color:var(--muted); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; }
  .tc-view .badge .v { font-size:12.5px; color:var(--ink); font-weight:500; }
  .tc-view .q { display:flex; gap:12px; padding:14px 16px; border:1px solid var(--line); background:var(--bg); border-radius:9px; font-family:var(--font-sans); }
  .tc-view .q + .q { margin-top:8px; }
  .tc-view .q .num { width:20px; height:20px; border-radius:50%; background:var(--cream); color:var(--ink-2); display:grid; place-items:center; flex-shrink:0; font-size:10.5px; font-weight:700; }
  .tc-view .q .qbody { flex:1; min-width:0; }
  .tc-view .q .qtext { font-size:13px; color:var(--ink); margin:0 0 8px; font-weight:600; }
  .tc-view .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .tc-view .chip { border:1px solid var(--line-2); background:var(--bg); color:var(--ink-2); padding:5px 11px; border-radius:999px; font-size:11.5px; cursor:pointer; transition:background 0.1s,border-color 0.1s; }
  .tc-view .chip:hover { border-color:var(--olive); }
  .tc-view .chip.selected { background:var(--olive); color:#fff; border-color:var(--olive); }
  .tc-view .chip.abstain { color:var(--gold); border-color:var(--gold-soft); background:var(--gold-soft); }
  .tc-view .actions-row { display:flex; justify-content:flex-end; align-items:center; margin-top:2px; }
  .tc-view .btn { all:unset; cursor:pointer; padding:9px 16px; border-radius:999px; font-family:var(--font-sans); font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; transition:opacity 0.1s,background 0.1s; }
  .tc-view .btn.primary { background:var(--olive); color:#fff; }
  .tc-view .btn.primary:hover { background:#38362F; }
  .tc-view .btn.ghost { background:transparent; color:var(--ink-2); border-color:var(--line-2); }
  .tc-view .btn.ghost:hover { background:var(--cream-2); }
  .tc-view .btn.good { background:var(--olive); color:#fff; }
  .tc-view .btn.good:hover { background:#38362F; }
  .tc-view .btn:disabled, .tc-view .btn.disabled { opacity:0.4; cursor:not-allowed; }
  .tc-view .btn:disabled:hover, .tc-view .btn.disabled:hover { background:var(--olive); }
  .tc-view .btn.primary.disabled:hover { background:var(--olive); }
  .tc-view .tools { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; font-family:var(--font-sans); }
  .tc-view .filter { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; background:var(--bg); border:1px solid var(--line); color:var(--ink-2); font-size:11.5px; cursor:pointer; }
  .tc-view .filter:hover { border-color:var(--olive); }
  .tc-view .filter.active { background:var(--olive); color:#fff; border-color:var(--olive); }
  .tc-view .filter .count { background:var(--cream); color:var(--ink-2); padding:0 6px; border-radius:999px; font-family:ui-monospace,monospace; font-size:10px; }
  .tc-view .filter.active .count { background:rgba(255,255,255,0.2); color:#fff; }
  .tc-view .tools .spacer { flex:1; }
  .tc-view .bulkbar { display:flex; align-items:center; justify-content:space-between; padding:9px 14px; background:var(--cream); border-left:3px solid var(--olive); border-radius:6px 10px 10px 6px; margin-bottom:10px; font-family:var(--font-sans); font-size:12.5px; }
  .tc-view .bulkbar .left { display:flex; align-items:center; gap:9px; color:var(--ink-2); font-weight:600; }
  .tc-view .bulkbar .actions { display:flex; gap:6px; }
  .tc-view .bulkbar .actions .btn { padding:5px 11px; font-size:11.5px; }
  .tc-view .bulkbar .actions .btn.ghost { background:var(--bg); }
  .tc-view .table-wrap { background:var(--bg); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .tc-view .tbl-scroll { overflow-x:auto; }
  .tc-view table.tbl { width:100%; border-collapse:collapse; font-family:var(--font-sans); font-size:12px; font-variant-numeric:tabular-nums; min-width:760px; }
  .tc-view .tbl th { text-align:left; font-weight:700; color:var(--muted); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; padding:10px 12px 8px; border-bottom:1px solid var(--line); background:var(--cream-2); }
  .tc-view .tbl td { padding:10px 12px; border-bottom:1px solid var(--line); color:var(--ink); vertical-align:top; }
  .tc-view .tbl tr:last-child td { border-bottom:0; }
  .tc-view .tbl tbody tr:hover td { background:var(--cream-2); }
  .tc-view .tbl tr.grouphdr td { background:var(--cream); color:var(--ink-2); font-weight:700; font-size:11px; letter-spacing:0.02em; padding:7px 12px; border-bottom:1px solid var(--line); }
  .tc-view .tbl tr.grouphdr:hover td { background:var(--cream); }
  .tc-view .tbl td.chk { width:30px; padding-right:0; }
  .tc-view .tbl td.id { font-family:ui-monospace,monospace; color:var(--ink-2); font-size:11px; width:66px; }
  .tc-view .tbl .title-cell { max-width:340px; }
  .tc-view .tbl .title-cell .t { color:var(--ink); }
  .tc-view .chk-box { width:14px; height:14px; border-radius:4px; border:1.5px solid var(--line-2); display:inline-block; vertical-align:middle; background:var(--bg); cursor:pointer; }
  .tc-view .chk-box:hover { border-color:var(--olive); }
  .tc-view .chk-box.on { background:var(--olive); border-color:var(--olive); position:relative; }
  .tc-view .chk-box.on::after { content:""; position:absolute; left:3px; top:-1px; width:4px; height:8px; border:solid #fff; border-width:0 1.6px 1.6px 0; transform:rotate(45deg); }
  .tc-view .sev { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; }
  .tc-view .sev .stripe { width:3px; height:11px; border-radius:2px; background:var(--muted); }
  .tc-view .sev.sev1 .stripe { background:var(--terracotta); }
  .tc-view .sev.sev2 .stripe { background:var(--gold); }
  .tc-view .sev.sev1 { color:var(--terracotta); }
  .tc-view .sev.sev2 { color:var(--gold); }
  .tc-view .tag { display:inline-block; padding:1px 7px; border-radius:4px; font-family:ui-monospace,monospace; font-size:10px; background:var(--cream); color:var(--ink-2); border:1px solid var(--line); }
  .tc-view .status { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:10.5px; font-weight:600; cursor:pointer; }
  .tc-view .status.draft { background:var(--cream); color:var(--ink-2); }
  .tc-view .status.approved { background:transparent; border:1px solid var(--olive); color:var(--olive); }
  .tc-view .status.abstain { background:var(--gold-soft); color:var(--gold); }
  .tc-view .status .dot { width:5px; height:5px; border-radius:50%; background:currentColor; }
