<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Authoring &amp; Execution — AIA iPOS+ Financial Health Review</title>
<style>
  :root{
    --teal:#0d8b8b;
    --teal-dark:#0a6f6f;
    --teal-tint:#e6f4f4;
    --ink:#1c2529;
    --ink-2:#48555c;
    --ink-3:#7a878e;
    --line:#e3e8ea;
    --line-2:#eef2f3;
    --bg:#f6f8f8;
    --panel:#ffffff;
    --pass:#1f9d55;
    --fail:#d1435b;
    --block:#c77700;
    --notrun:#9aa6ac;
    --radius:8px;
    --shadow:0 1px 2px rgba(20,40,45,.05), 0 1px 3px rgba(20,40,45,.06);
    font-synthesis:none;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    font-size:13.5px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- top bar ---------- */
  .topbar{
    height:52px;display:flex;align-items:center;gap:12px;
    padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.01em;}
  .brand .mark{width:22px;height:22px;border-radius:6px;background:var(--teal);
    display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;}
  .brand .sub{color:var(--ink-3);font-weight:500;font-size:12px;}
  .topbar .spacer{flex:1;}
  .topbar .crumb{color:var(--ink-3);font-size:12px;}
  .topbar .crumb b{color:var(--ink-2);font-weight:600;}

  /* ---------- layout ---------- */
  .layout{display:flex;height:calc(100vh - 52px);}
  .nav{
    width:310px;min-width:310px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .nav.hidden{display:none;}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

  /* ---------- Part C: primary nav rail (Home / Test Cases / Releases) ---------- */
  .primarynav{
    width:184px;min-width:184px;background:var(--bg);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto;padding:14px 10px;flex:none;
  }
  .pnav-item{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;
    padding:8px 9px;border-radius:7px;font:inherit;font-size:13px;font-weight:650;color:var(--ink-2);
    cursor:pointer;margin-bottom:2px;
  }
  .pnav-item:hover{background:var(--line-2);color:var(--ink);}
  .pnav-item.active{background:var(--teal-tint);color:var(--teal-dark);}
  .pnav-item .pnav-ic{font-size:14px;width:16px;text-align:center;flex:none;}
  .pnav-group{margin-bottom:4px;}
  .pnav-sub{display:flex;flex-direction:column;margin:1px 0 8px 24px;border-left:1px solid var(--line);padding-left:11px;}
  .pnav-subitem{
    display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 9px;
    border-radius:6px;font:inherit;font-size:12px;font-weight:600;color:var(--ink-3);cursor:pointer;margin-bottom:1px;
  }
  .pnav-subitem:hover{background:var(--panel);color:var(--ink-2);}
  .pnav-subitem.active{color:var(--teal-dark);background:var(--panel);font-weight:650;box-shadow:var(--shadow);}

  .navscroll{flex:1;overflow-y:auto;padding:8px 8px 24px;}
  .navhead{padding:12px 14px 10px;border-bottom:1px solid var(--line-2);}
  .navhead .nh-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:650;}

  /* ---------- Part C: blank / insights landing pages ---------- */
  .blankpage{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;color:var(--ink-3);text-align:center;padding:60px 24px;}
  .blankpage .bp-icon{font-size:32px;margin-bottom:12px;}
  .blankpage .bp-title{font-size:15px;font-weight:650;color:var(--ink-2);margin-bottom:6px;}
  .blankpage .bp-sub{font-size:12.5px;max-width:380px;line-height:1.6;}

  .insights-head{margin-bottom:16px;}
  .insights-head h2{font-size:16px;margin:0 0 4px;font-weight:650;}
  .insights-head p{margin:0;color:var(--ink-2);font-size:12.5px;max-width:70ch;}
  .insight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:13px 15px;}
  .stat-card .sc-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;}
  .stat-card .sc-value{font-size:23px;font-weight:700;color:var(--ink);margin-top:6px;font-variant-numeric:tabular-nums;}
  .stat-card .sc-sub{font-size:11.5px;color:var(--ink-3);margin-top:3px;}
  .rel-table-wrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
    box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
  .rel-table-wrap .rt-head{padding:12px 15px 10px;border-bottom:1px solid var(--line-2);font-weight:650;font-size:13px;}
  .rel-row{display:flex;align-items:center;gap:14px;padding:11px 15px;border-bottom:1px solid var(--line-2);}
  .rel-row:last-child{border-bottom:0;}
  .rel-row .rr-name{font-weight:600;font-size:12.5px;flex:1;min-width:150px;}
  .rel-row .rr-name .rr-sub{color:var(--ink-3);font-weight:500;font-size:11px;display:block;margin-top:1px;}
  .rel-row .rr-bar{flex:2;min-width:120px;}
  .rel-row .rr-pct{font-size:12.5px;font-weight:650;width:42px;text-align:right;flex:none;font-variant-numeric:tabular-nums;}
  .rel-row .rr-counts{display:flex;gap:8px;flex:none;font-size:11px;color:var(--ink-3);}
  .callout-row{display:flex;gap:12px;flex-wrap:wrap;}
  .callout{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:13px 15px;}
  .callout .co-title{font-weight:650;font-size:12.5px;margin-bottom:5px;}
  .callout .co-body{font-size:12px;color:var(--ink-2);line-height:1.55;}

  /* ---------- tree ---------- */
  .tree{list-style:none;margin:0;padding:0;}
  .node{user-select:none;}
  .row{
    display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;cursor:pointer;
    color:var(--ink-2);position:relative;
  }
  .row:hover{background:var(--line-2);}
  .row.selected{background:var(--teal-tint);color:var(--teal-dark);}
  .row.selected .caret,.row.selected .rowtext{color:var(--teal-dark);}
  .caret{width:12px;font-size:9px;color:var(--ink-3);flex:none;transition:transform .12s;display:inline-block;text-align:center;}
  .caret.open{transform:rotate(90deg);}
  .caret.leaf{visibility:hidden;}
  .rowtext{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ic{width:15px;flex:none;text-align:center;font-size:12px;color:var(--ink-3);}
  .row .count{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .children{margin:0;padding:0 0 0 15px;list-style:none;
    border-left:1px solid var(--line-2);margin-left:11px;}
  .children.collapsed{display:none;}
  .lvl-mod .rowtext{font-weight:650;color:var(--ink);}
  .lvl-mod.selected .rowtext{color:var(--teal-dark);}

  /* dots */
  .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .dot.pass{background:var(--pass);}
  .dot.fail{background:var(--fail);}
  .dot.block{background:var(--block);}
  .dot.notrun{background:var(--notrun);}

  /* run node meta */
  .runmeta{font-size:10.5px;color:var(--ink-3);padding:0 8px 6px 42px;margin-top:-2px;}
  .runmeta .plat{color:var(--ink-2);font-weight:600;}

  /* ---------- main tabs ---------- */
  .maintabs{
    display:flex;align-items:center;gap:2px;padding:10px 18px 0;border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .maintabs .titleblock{margin-bottom:9px;}
  .maintabs .titleblock h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em;}
  .maintabs .titleblock .meta{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .tabrow{display:flex;gap:2px;margin-left:auto;align-self:flex-end;}
  .tab{
    border:0;background:transparent;font:inherit;font-weight:600;font-size:13px;color:var(--ink-3);
    padding:8px 14px;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;
  }
  .tab:hover{color:var(--ink-2);}
  .tab.active{color:var(--teal-dark);border-bottom-color:var(--teal);}

  .content{flex:1;overflow:auto;padding:18px;}
  .content.listmode{overflow:hidden;display:flex;flex-direction:column;padding:14px 18px 18px;}

  /* ---------- run summary bar ---------- */
  .runsummary{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px;
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  }
  .runsummary .rs-title{font-weight:650;font-size:14.5px;}
  .runsummary .rs-sub{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .runsummary .rs-meta{display:flex;gap:22px;flex-wrap:wrap;}
  .rs-metaitem .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;}
  .rs-metaitem .v{font-size:12.5px;color:var(--ink);font-weight:600;margin-top:1px;}
  .counts{display:flex;gap:6px;margin-left:auto;align-items:center;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;
    padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--bg);
    font-variant-numeric:tabular-nums;
  }
  .pill .dot{width:8px;height:8px;}
  .pill.pass{color:var(--pass);}.pill.fail{color:var(--fail);}
  .pill.block{color:var(--block);}.pill.notrun{color:var(--notrun);}
  .rate-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;width:100%;margin-top:12px;}
  .rate-bar > span{display:block;height:100%;}
  .rate-bar .s-pass{background:var(--pass);}
  .rate-bar .s-fail{background:var(--fail);}
  .rate-bar .s-block{background:var(--block);}
  .rate-bar .s-notrun{background:var(--notrun);}

  /* ---------- detail cards ---------- */
  .scenario-head{margin-bottom:14px;}
  .scenario-head h2{font-size:15px;margin:0 0 4px;font-weight:650;}
  .scenario-head p{margin:0;color:var(--ink-2);font-size:12.5px;max-width:70ch;}
  .tagline{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;}
  .tag{font-size:11px;color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:2px 8px;background:var(--panel);}
  .tag b{color:var(--ink);font-weight:600;}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;
  }
  .card-head{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;}
  .card-head:hover{background:var(--line-2);}
  .card-head .caret{font-size:10px;}
  .cid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink-3);
    background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px;flex:none;}
  .ctitle{font-weight:600;flex:1;}
  /* category chip — thin bordered, typographic color only (no filled pills) */
  .ctype{font-size:10.5px;font-weight:650;padding:2px 8px;border-radius:5px;flex:none;
    border:1px solid var(--line);background:var(--panel);letter-spacing:.02em;
    text-transform:lowercase;}
  .ctype.cat-positive,.ctype.cat-alt-valid{color:var(--teal-dark);}
  .ctype.cat-negative,.ctype.cat-boundary{color:var(--fail);}
  .ctype.cat-regulatory{color:var(--block);}
  .ctype.cat-edge,.ctype.cat-state{color:var(--block);}
  .ctype.cat-property{color:var(--ink-2);}
  .card-body{padding:2px 14px 15px;border-top:1px solid var(--line-2);display:none;}
  .card.open .card-body{display:block;}
  .card.open .card-head .caret{transform:rotate(90deg);}

  .step-block{margin-top:13px;}
  .step-block .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650;margin-bottom:6px;}
  ol.steps{margin:0;padding-left:20px;}
  ol.steps li{margin:3px 0;color:var(--ink);}
  ol.steps li .exp{color:var(--ink-2);font-size:12px;}
  ol.steps li .exp::before{content:"→ ";color:var(--teal);}

  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;}
  .chip{
    display:inline-flex;align-items:baseline;gap:6px;font-size:11.5px;
    border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:var(--bg);
  }
  .chip .k{color:var(--ink-3);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;}
  .chip .v{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;}

  /* ---------- list / table ---------- */
  .tabletools{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .tabletools .hint{font-size:12px;color:var(--ink-3);}
  .tabletools .spacer{flex:1;}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;}
  .btn:hover{border-color:var(--ink-3);color:var(--ink);}
  .tablewrap{flex:1;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:1020px;font-size:12.5px;}
  thead th{
    position:sticky;top:0;background:var(--panel);text-align:left;font-weight:650;color:var(--ink-2);
    font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;
    border-bottom:1px solid var(--line);white-space:nowrap;z-index:1;
  }
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;color:var(--ink);}
  tbody tr:hover{background:var(--line-2);}
  tbody tr:last-child td{border-bottom:0;}
  td.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink-3);}
  td.name{white-space:normal;min-width:230px;font-weight:550;color:var(--ink);}
  .mini{font-size:11px;font-weight:650;padding:2px 8px;border-radius:5px;display:inline-block;}
  .mini.auto{color:var(--teal-dark);border:1px solid var(--teal);background:var(--teal-tint);}
  .mini.manual{color:var(--ink-2);border:1px solid var(--line);background:var(--bg);}
  .platcell{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);}
  .platcell .pic{font-size:12px;}
  .statuscell{font-weight:650;display:inline-flex;align-items:center;gap:6px;}
  .statuscell.pass{color:var(--pass);}
  .statuscell.fail{color:var(--fail);}
  .statuscell.block{color:var(--block);}
  .statuscell.notrun{color:var(--notrun);}
  .assignee{display:inline-flex;align-items:center;gap:7px;}
  .avatar{width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;
    font-size:10px;font-weight:700;flex:none;}
  .muted{color:var(--ink-3);}
  .type-chip{font-size:11px;color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;background:var(--bg);}

  .emptyhint{color:var(--ink-3);font-size:13px;padding:40px;text-align:center;}

  /* ---------- lifecycle + priority + trace (shared) ---------- */
  .lifecycle{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:2px 8px;border-radius:5px;}
  .lc-active{color:var(--pass);border:1px solid #bfe6cd;background:#eef8f1;}
  .lc-draft{color:var(--block);border:1px solid #f0d8ab;background:#fdf5e6;}
  .lc-deprecated{color:var(--ink-3);border:1px solid var(--line);background:var(--bg);text-decoration:line-through;}
  .prio{font-weight:700;font-size:11.5px;font-variant-numeric:tabular-nums;}
  .prio-P1{color:var(--fail);}
  .prio-P2{color:var(--block);}
  .prio-P3{color:var(--ink-3);}
  .tracelink{color:var(--teal-dark);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;border-bottom:1px dotted var(--teal);cursor:pointer;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-2);}

  /* ---------- drawer ---------- */
  .drawer-backdrop{position:fixed;inset:0;background:rgba(20,35,40,.28);opacity:0;visibility:hidden;
    transition:opacity .18s;z-index:40;}
  .drawer-backdrop.show{opacity:1;visibility:visible;}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:480px;max-width:92vw;background:var(--panel);
    border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(20,40,45,.10);
    transform:translateX(100%);transition:transform .2s ease;z-index:41;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);}
  .dh-idrow{display:flex;align-items:center;gap:8px;}
  .dh-idrow .drawer-close{margin-left:auto;border:0;background:transparent;font-size:16px;color:var(--ink-3);
    cursor:pointer;line-height:1;padding:4px 6px;border-radius:6px;}
  .dh-idrow .drawer-close:hover{background:var(--line-2);color:var(--ink);}
  .dh-title{display:flex;align-items:center;gap:12px;margin-top:10px;}
  .dh-title > span:first-child{font-size:15px;font-weight:650;flex:1;line-height:1.3;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 18px 40px;}
  .drawer-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;padding-bottom:16px;
    border-bottom:1px solid var(--line-2);}
  .dm-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;}
  .dm-v{font-size:12.5px;color:var(--ink);margin-top:2px;font-weight:550;}
  .drawer-sec{margin-top:18px;}
  .drawer-sec .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
    font-weight:650;margin-bottom:8px;}
  .exec-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
  table.exec-history{min-width:640px;font-size:11.5px;}
  table.exec-history thead th{font-size:10px;padding:7px 9px;}
  table.exec-history tbody td{padding:7px 9px;}
  table.exec-history tr.cur{background:var(--teal-tint);}
  /* trace tag pills (in drawer) */
  .tracetags{display:flex;flex-wrap:wrap;gap:6px;}
  .tracetag{font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--line);border-radius:5px;padding:1px 7px;background:var(--bg);color:var(--ink-2);}
  .tracetag.reg{color:var(--block);border-color:#f0d8ab;background:#fdf5e6;}
  /* oracle full-width row */
  .oracle-row{grid-column:1 / -1;padding-top:10px;margin-top:4px;border-top:1px dashed var(--line-2);}
  .oracle-row .dm-k{margin-bottom:3px;}
  .oracle-row .dm-v{font-style:italic;color:var(--ink-2);font-weight:500;line-height:1.5;}
  /* abstain banner */
  .abstain-banner{border:1px solid #f2c2cb;background:#fdeef1;color:var(--fail);
    border-radius:var(--radius);padding:12px 14px;margin-top:14px;}
  .abstain-banner .ab-hd{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .abstain-banner .ab-body{color:var(--ink);font-size:12.5px;line-height:1.5;}
  .abstain-banner .ab-needed{color:var(--ink-2);font-size:11.5px;margin-top:6px;}
  .abstain-note{margin-top:12px;color:var(--ink-3);font-size:12px;font-style:italic;}
  /* abstain pill in status column */
  .abstain-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    padding:2px 9px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);}
  .abstain-pill .qid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-3);}
  .ai-stub{border:1px dashed var(--line);border-radius:var(--radius);background:var(--bg);padding:12px 14px;}
  .ai-stub .lbl{margin-bottom:4px;}
  .ai-stub-body{font-size:12px;color:var(--ink-3);line-height:1.5;}

  /* ---------- Part B: AI Insights strip in drawer ---------- */
  .ai-insights{border:1px solid var(--line);border-radius:var(--radius);background:#fafcfc;padding:6px 0;}
  .ai-insights .lbl{padding:10px 14px 4px;}
  .insight{padding:10px 14px;border-top:1px dashed var(--line-2);}
  .insight:first-of-type{border-top:0;}
  .insight-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .insight-head .ih-title{font-weight:650;font-size:12.5px;color:var(--ink);}
  .insight-head .ih-conf{font-size:11px;color:var(--ink-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .insight-head .prov{font-size:10.5px;font-weight:650;text-transform:lowercase;letter-spacing:.03em;
    border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-2);background:var(--bg);}
  .prov.measured{color:var(--teal-dark);border-color:#bfdcdc;background:var(--teal-tint);}
  .prov.proxy{color:var(--block);border-color:#f0d8ab;background:#fdf5e6;}
  .prov.asserted{color:var(--ink-2);}
  .prov.abstained{color:var(--fail);border-color:#f2c2cb;background:#fdeef1;}
  .insight-body{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.5;}
  .insight-body .evid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-3);font-size:11px;}
  .insight-actions{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;}
  .insight-actions .btn{padding:4px 9px;font-size:11.5px;}

  /* ---------- Part B: reusable modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,35,40,.32);opacity:0;visibility:hidden;
    transition:opacity .16s;z-index:60;display:grid;place-items:center;padding:24px;}
  .modal-backdrop.show{opacity:1;visibility:visible;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 12px 40px rgba(20,40,45,.18);max-width:560px;width:100%;max-height:82vh;
    display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .modal-head .m-title{font-weight:650;font-size:14px;flex:1;}
  .modal-head .m-close{border:0;background:transparent;font-size:16px;color:var(--ink-3);cursor:pointer;
    padding:4px 6px;border-radius:6px;}
  .modal-head .m-close:hover{background:var(--line-2);color:var(--ink);}
  .modal-body{padding:14px 16px;overflow-y:auto;font-size:12.5px;color:var(--ink);line-height:1.5;}
  .modal-body .m-section{margin-bottom:12px;}
  .modal-body .m-section:last-child{margin-bottom:0;}
  .modal-body .m-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;margin-bottom:4px;}
  .modal-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;}
  .modal-foot .spacer{flex:1;}
  .modal-foot .audit{font-size:11.5px;color:var(--ink-3);}
  .btn-primary{background:var(--teal);border:1px solid var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff;}

  /* Change-set modal rows */
  .cs-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line-2);}
  .cs-row:last-child{border-bottom:0;}
  .cs-row input[type=checkbox]{margin-top:3px;}
  .cs-row.warn .cs-title{color:var(--fail);}
  .cs-row .cs-title{font-weight:600;font-size:12.5px;color:var(--ink);}
  .cs-row .cs-detail{font-size:11.5px;color:var(--ink-2);margin-top:2px;}
  .cs-row .cs-detail .old{color:var(--ink-3);text-decoration:line-through;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .cs-row .cs-detail .new{color:var(--teal-dark);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .cs-row .prov{margin-left:6px;}

  /* Toast */
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;
    box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:70;opacity:0;transition:opacity .18s;pointer-events:none;}
  .toast.show{opacity:1;}

  /* ---------- Part B: right-pane authoring assistant ---------- */
  .chatpane{
    width:380px;min-width:340px;max-width:420px;
    background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;flex:none;
    transition:width .2s ease, min-width .2s ease, border-color .2s ease;
  }
  .chatpane.collapsed{width:0;min-width:0;border-left:0;}
  .chatpane.collapsed > *{display:none;}
  .chatpane-head{display:flex;align-items:center;gap:8px;
    padding:12px 14px 10px;border-bottom:1px solid var(--line-2);flex:none;}
  .chatpane-head .cp-title{font-weight:650;font-size:13px;color:var(--ink);}
  .chatpane-head .cp-sub{font-size:11px;color:var(--ink-3);flex:1;}
  .chatpane-head .cp-collapse{
    border:0;background:transparent;color:var(--ink-3);font-size:16px;cursor:pointer;
    padding:2px 6px;border-radius:5px;line-height:1;}
  .chatpane-head .cp-collapse:hover{background:var(--line-2);color:var(--ink);}

  .chattoggle{
    display:inline-flex;align-items:center;gap:6px;margin-right:12px;
    border:1px solid var(--line);background:var(--panel);border-radius:6px;
    padding:5px 10px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;
  }
  .chattoggle:hover{border-color:var(--ink-3);color:var(--ink);}
  .chattoggle[aria-pressed="true"]{border-color:var(--teal);color:var(--teal-dark);background:var(--teal-tint);}
  .chattoggle .ct-icon{font-size:12px;}

  .cbar-wrap{background:var(--panel);padding:10px 12px 12px;
    display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden;}
  .cbar-chat{
    flex:1;overflow-y:auto;font-size:12.5px;color:var(--ink);line-height:1.5;
    display:flex;flex-direction:column;gap:8px;padding:2px;
  }
  .cbar-chat:empty{flex:1;}
  .cbar-chat .msg{padding:8px 11px;border-radius:8px;max-width:92%;}
  .cbar-chat .msg.user{align-self:flex-end;background:var(--bg);border:1px solid var(--line);color:var(--ink);}
  .cbar-chat .msg.bot{align-self:flex-start;background:var(--teal-tint);border:1px solid #bfdcdc;color:var(--ink);}
  .cbar-chat .msg.bot b{color:var(--teal-dark);}
  .cbar-clarify{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);flex-wrap:wrap;}
  .cbar-clarify .q{font-weight:600;}
  .cbar-clarify .chip-btn{border:1px solid var(--teal);color:var(--teal-dark);background:var(--teal-tint);
    border-radius:14px;padding:2px 10px;font:inherit;font-size:11.5px;cursor:pointer;}
  .cbar-clarify .chip-btn:hover{background:var(--teal);color:#fff;}
  .cbar-input-row{display:flex;gap:6px;align-items:center;}
  .cbar-input-row .prefix{color:var(--teal);font-weight:700;font-size:13px;padding:0 2px 0 4px;}
  .cbar-input-row input{flex:1;border:1px solid var(--line);border-radius:7px;padding:8px 11px;
    font:inherit;font-size:13px;color:var(--ink);background:var(--panel);}
  .cbar-input-row input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint);}
  .cbar-input-row .cbar-submit{border:1px solid var(--teal);background:var(--teal);color:#fff;
    border-radius:7px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;}
  .cbar-examples{display:flex;gap:6px;flex-wrap:wrap;}
  .cbar-examples .ex{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;
    padding:2px 9px;cursor:pointer;background:var(--bg);}
  .cbar-examples .ex:hover{color:var(--ink);border-color:var(--ink-3);}

  /* Draft preview card (inline in content) */
  .draft-card{border:1.5px dashed var(--teal);background:#f2fafa;border-radius:var(--radius);
    padding:12px 14px;margin-bottom:12px;}
  .draft-card .dc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .draft-card .dc-title{font-weight:650;flex:1;}
  .draft-card .dc-body{font-size:12px;color:var(--ink-2);line-height:1.5;}
  .draft-card .dc-body b{color:var(--ink);}
  .draft-card .dc-actions{margin-top:9px;display:flex;gap:6px;}

  /* Smart-CTA strip */
  .cta-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .runsummary .cta-strip{margin-top:10px;width:100%;}
  .scenario-head .cta-strip{margin-top:8px;}

  /* Row action menu (⋯ in list) */
  .rowmenu-trigger{border:0;background:transparent;color:var(--ink-3);cursor:pointer;
    font-size:14px;padding:0 6px;border-radius:4px;line-height:1;margin-left:6px;}
  .rowmenu-trigger:hover{background:var(--line-2);color:var(--ink);}
  .rowmenu{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;box-shadow:var(--shadow);padding:4px;z-index:50;min-width:150px;}
  .rowmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;
    font:inherit;font-size:12px;padding:6px 8px;color:var(--ink);cursor:pointer;border-radius:4px;}
  .rowmenu button:hover{background:var(--line-2);}

  /* Activity link */
  .activity-link{margin-left:auto;font-size:12px;color:var(--teal-dark);cursor:pointer;
    border:0;background:transparent;border-bottom:1px dotted var(--teal);padding:0;font:inherit;}
  .audit-list{list-style:none;padding:0;margin:0;}
  .audit-list li{padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:12px;color:var(--ink-2);}
  .audit-list li:last-child{border-bottom:0;}
  .audit-list li b{color:var(--ink);font-weight:600;}
  .audit-list li .when{color:var(--ink-3);font-size:11px;margin-left:4px;}

  /* ---------- Part D: collapse controls (left nav + assistant pane) ---------- */
  .navhead{display:flex;align-items:center;gap:8px;}
  .navhead .nh-title{flex:1;}
  .nav-collapse{border:0;background:transparent;color:var(--ink-3);font-size:15px;line-height:1;
    cursor:pointer;padding:2px 6px;border-radius:5px;}
  .nav-collapse:hover{background:var(--line-2);color:var(--ink);}
  .nav.collapsed{display:none;}
  .pane-reopen{position:fixed;top:64px;z-index:35;border:1px solid var(--line);background:var(--panel);
    color:var(--teal-dark);cursor:pointer;box-shadow:var(--shadow);font-size:14px;font-weight:700;
    padding:11px 5px;line-height:1;}
  .pane-reopen:hover{background:var(--teal-tint);}
  .pane-reopen.left{left:184px;border-radius:0 8px 8px 0;}
  .pane-reopen.right{right:0;border-radius:8px 0 0 8px;}

  /* ---------- Part D: Atto AI chat list (second nav) ---------- */
  .chatlist{display:flex;flex-direction:column;gap:2px;}
  .cl-new{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    border:1px solid var(--teal);background:var(--teal-tint);color:var(--teal-dark);
    border-radius:7px;padding:8px 10px;font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;margin-bottom:8px;}
  .cl-new:hover{background:var(--teal);color:#fff;}
  .cl-group{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
    font-weight:650;padding:8px 8px 4px;}
  .cl-item{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:0;background:transparent;
    padding:7px 9px;border-radius:6px;cursor:pointer;color:var(--ink-2);}
  .cl-item:hover{background:var(--line-2);}
  .cl-item.active{background:var(--teal-tint);}
  .cl-item .cl-title{font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .cl-item.active .cl-title{color:var(--teal-dark);}
  .cl-item .cl-meta{font-size:10.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;}
  .cl-item .cl-src{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:9.5px;
    text-transform:uppercase;letter-spacing:.03em;}

  /* ---------- Part D: Atto AI chat home + conversation ---------- */
  .atto-home{max-width:720px;margin:0 auto;padding:36px 8px 24px;}
  .atto-home .ah-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;
    color:var(--teal-dark);background:var(--teal-tint);border:1px solid #bfdcdc;border-radius:20px;padding:3px 11px;}
  .atto-home h2{font-size:22px;margin:14px 0 6px;font-weight:700;letter-spacing:-.01em;}
  .atto-home .ah-sub{color:var(--ink-2);font-size:13px;margin:0 0 18px;line-height:1.55;max-width:60ch;}
  .atto-composer{border:1px solid var(--line);border-radius:12px;background:var(--panel);
    box-shadow:var(--shadow);padding:12px 14px;}
  .atto-composer textarea{width:100%;border:0;resize:none;font:inherit;font-size:14px;color:var(--ink);
    background:transparent;min-height:60px;line-height:1.5;}
  .atto-composer textarea:focus{outline:0;}
  .atto-composer .ac-foot{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:10px;
    border-top:1px solid var(--line-2);}
  .atto-attach{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--bg);
    border-radius:7px;padding:5px 10px;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;}
  .atto-attach:hover{border-color:var(--ink-3);color:var(--ink);}
  .atto-composer .ac-gen{margin-left:auto;border:1px solid var(--teal);background:var(--teal);color:#fff;
    border-radius:8px;padding:7px 16px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;}
  .atto-composer .ac-gen:hover{background:var(--teal-dark);border-color:var(--teal-dark);}
  .atto-attached{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .atto-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid var(--line);
    background:var(--bg);border-radius:6px;padding:3px 9px;color:var(--ink-2);}
  .atto-chip .x{cursor:pointer;color:var(--ink-3);font-weight:700;}
  .atto-examples{margin-top:22px;}
  .atto-examples .ae-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
    font-weight:650;margin-bottom:9px;}
  .atto-ex{display:flex;flex-direction:column;gap:8px;}
  .atto-ex button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;
    padding:11px 13px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);}
  .atto-ex button:hover{border-color:var(--teal);background:var(--teal-tint);}
  .atto-ex button .ae-src{color:var(--ink-3);font-size:11px;margin-top:3px;}

  .atto-convo{max-width:760px;margin:0 auto;padding:20px 8px 24px;}
  .atto-msg{margin-bottom:14px;display:flex;gap:10px;}
  .atto-msg .am-av{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;
    font-size:12px;font-weight:700;}
  .atto-msg.user .am-av{background:var(--ink);color:#fff;}
  .atto-msg.bot .am-av{background:var(--teal);color:#fff;}
  .atto-msg .am-body{font-size:13px;color:var(--ink);line-height:1.55;padding-top:3px;}
  .atto-msg .am-body b{font-weight:650;}
  .atto-draftlist{display:flex;flex-direction:column;gap:8px;margin-top:10px;}

  /* ---------- Part E: Releases (All Releases list + release detail summary) ---------- */
  .allrel-head{margin-bottom:16px;}
  .allrel-head h2{font-size:16px;margin:0 0 4px;font-weight:650;}
  .allrel-head p{margin:0;color:var(--ink-2);font-size:12.5px;max-width:70ch;}

  .rel-index{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
    box-shadow:var(--shadow);overflow:hidden;}
  .rel-index table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
  .rel-index thead th{position:sticky;top:0;background:var(--panel);text-align:left;
    font-weight:650;color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .rel-index tbody td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;}
  .rel-index tbody tr:last-child td{border-bottom:0;}
  .rel-index tbody tr{cursor:pointer;}
  .rel-index tbody tr:hover{background:var(--line-2);}
  .rel-index .r-name{font-weight:650;color:var(--ink);}
  .rel-index .r-sub{color:var(--ink-3);font-size:11.5px;font-weight:500;margin-top:2px;display:block;}
  .rel-index .r-bar{width:180px;}
  .rel-index .r-pct{font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink);}
  .rel-index .r-suites{font-size:11.5px;color:var(--ink-2);}

  /* Breadcrumb above the tabs in a drilled release */
  .rel-breadcrumb{padding:10px 18px 0;display:flex;align-items:center;gap:6px;
    background:var(--panel);border-bottom:1px solid var(--line-2);font-size:12px;color:var(--ink-3);}
  .rel-breadcrumb .rb-link{color:var(--teal-dark);border:0;background:transparent;font:inherit;
    font-size:12px;cursor:pointer;padding:0;border-bottom:1px dotted var(--teal);}
  .rel-breadcrumb .rb-link:hover{color:var(--teal);}
  .rel-breadcrumb .rb-sep{color:var(--ink-3);}
  .rel-breadcrumb .rb-current{color:var(--ink);font-weight:600;}

  /* Summary tab cards */
  .rel-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px;}
  .rel-card .rc-title{font-size:12.5px;font-weight:650;color:var(--ink);margin-bottom:12px;
    display:flex;align-items:center;gap:8px;}
  .rel-card .rc-title .rc-sub{color:var(--ink-3);font-weight:500;font-size:11.5px;}

  /* Suites strip inside Test run status card */
  .suites-strip{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .suite-row{display:flex;align-items:center;gap:14px;padding:9px 12px;
    border:1px solid var(--line);border-radius:7px;background:var(--bg);cursor:pointer;transition:background .12s;}
  .suite-row:hover{background:var(--line-2);border-color:var(--ink-3);}
  .suite-row .s-name{font-weight:650;font-size:12.5px;flex:none;min-width:140px;}
  .suite-row .s-meta{font-size:11px;color:var(--ink-3);flex:1;}
  .suite-row .s-counts{display:flex;gap:8px;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none;}
  .suite-row .s-bar{width:120px;flex:none;}
  .suite-row .s-pct{width:36px;text-align:right;font-weight:650;font-size:12px;font-variant-numeric:tabular-nums;flex:none;}

  /* Business context — the beige card */
  .biz-card{background:#f4efe1;border:1px solid #e6dcc4;border-radius:var(--radius);padding:16px 18px;}
  .biz-card .bc-eyebrow{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;
    color:#8a7846;margin-bottom:10px;}
  .biz-card dl{display:grid;grid-template-columns:150px 1fr;row-gap:9px;column-gap:22px;margin:0;font-size:12.5px;}
  .biz-card dt{color:var(--ink-2);font-weight:600;}
  .biz-card dd{margin:0;color:var(--ink);}
  .biz-card dd b{font-weight:650;}

  /* Feature run summary rows */
  .feat-list{display:flex;flex-direction:column;gap:6px;}
  .feat-row{display:flex;align-items:center;gap:14px;padding:9px 12px;border:1px solid var(--line);
    border-radius:7px;cursor:pointer;transition:background .12s;background:var(--panel);}
  .feat-row:hover{background:var(--line-2);border-color:var(--ink-3);}
  .feat-row .f-name{font-weight:600;flex:1;font-size:12.5px;color:var(--ink);}
  .feat-row .f-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .feat-row .f-count{font-size:11.5px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums;}
  .feat-row .f-bar{width:140px;flex:none;}
  .feat-row .f-pct{font-weight:650;font-size:12px;font-variant-numeric:tabular-nums;width:40px;text-align:right;flex:none;}
  .feat-row .f-arrow{color:var(--ink-3);flex:none;font-size:14px;}

  /* Suite filter chips (Test Cases tab) */
  .suite-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  .suite-chips .sc-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
    font-weight:650;margin-right:4px;}
  .suite-chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;
    padding:4px 12px;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;}

/* ---- Release helpers (Part E) --------------------------------------------
   With the run tree gone, every release-level view aggregates its runs.
   These helpers are used by the All Releases list, the Summary tab, and the
   Test Cases tab so counts stay consistent. */
function relByIdx(i){ return RELEASES[i]; }
function relById(id){ return RELEASES.find(r=>r.id===id); }
// aggregate counts across every run in the release, respecting a suite filter
function relCounts(rel, suiteId){
  const c={pass:0,fail:0,block:0,notrun:0};
  rel.runs.forEach(run=>{
    if(suiteId && suiteId!=="all" && run.id!==suiteId) return;
    run.results.forEach(r=>c[r.s]++);
  });
  return c;
}
function relTotal(rel, suiteId){
  const c=relCounts(rel, suiteId);
  return c.pass+c.fail+c.block+c.notrun;
}
function relPassRate(rel, suiteId){
  const c=relCounts(rel, suiteId);
  const tot=c.pass+c.fail+c.block+c.notrun;
  return tot?Math.round(c.pass/tot*100):0;
}
// flat list of every case-run result in a release, one row per execution
function relRows(rel, suiteId){
  const rows=[];
  rel.runs.forEach(run=>{
    if(suiteId && suiteId!=="all" && run.id!==suiteId) return;
    run.results.forEach(r=>rows.push({...r, run}));
  });
  return rows;
}
// feature rollup: for each MODULE_TREE feature, aggregate results in this release
// (case-level latest-run wins, so a case that ran in Smoke + Regression only counts once)
function relFeatureRollup(rel){
  return MODULE_TREE.features.map(feat=>{
    const caseIds=feat.scenarios.flatMap(s=>s.cases);
    const latest={};   // caseId → newest status seen in this release
    rel.runs.forEach(run=>run.results.forEach(r=>{
      if(!caseIds.includes(r.c)) return;
      if(!latest[r.c] || latest[r.c].date < run.lastRun){
        latest[r.c]={status:r.s, date:run.lastRun};
      }
    }));
    const c={pass:0,fail:0,block:0,notrun:0};
    Object.values(latest).forEach(v=>c[v.status]++);
    const touched=Object.keys(latest).length;
    const executed=c.pass+c.fail+c.block;
    return {
      name:feat.name,
      touched,                                    // cases the release actually ran (any status)
      totalCases:caseIds.length,
      counts:c,
      passRate: executed? Math.round(c.pass/executed*100):0,
      status: c.fail?"fail":(c.block?"block":(c.pass?"pass":"notrun")),
    };
  });
}

// ---- status rollups (shared by tree dots + drawer) -----------------------
// group health precedence: fail > block > pass > notrun
// (a group is green if anything passed and nothing failed/blocked; grey only if nothing has run)
const STATUS_RANK={fail:3,block:2,pass:1,notrun:0};
// all run results for a case, newest-first, with run/release context
function caseHistory(caseId){
  const hist=[];
  RELEASES.forEach(rel=>rel.runs.forEach(run=>{
    const res=run.results.find(r=>r.c===caseId);
    if(res) hist.push({rel,run,status:res.s,defect:res.d||null});
  }));
  return hist.sort((a,b)=>b.run.lastRun.localeCompare(a.run.lastRun));
}
// a case's CURRENT status = its most-recent executed run; "notrun" if never executed
// Abstained cases are treated as "notrun" for rollup — they can't be executed
// against a real oracle until product/compliance answers, so they don't drag
// group health either up or down.
function caseRollupStatus(caseId){
  const tc = CASES[caseId];
  if(tc && tc.abstain) return "notrun";
  const executed=caseHistory(caseId).filter(h=>h.status!=="notrun"); // newest-first
  return executed.length ? executed[0].status : "notrun";
}
// worst status across a set of cases (deprecated cases excluded from health)
function groupStatus(caseIds){
  const active=caseIds.filter(id=>CASES[id] && CASES[id].lifecycle!=="deprecated");
  if(!active.length) return "notrun";
  return active.map(caseRollupStatus)
    .reduce((w,s)=>STATUS_RANK[s]>STATUS_RANK[w]?s:w,"notrun");
}

function renderTree(){
  // Only the Module tree is rendered now; release nav is a page (All Releases),
  // not a tree, so there's nothing to draw here for release view.
  const tree = $("#tree"); tree.innerHTML="";
  renderModuleTree(tree);
}

function branch(parentUl, {level, icon, text, count, dot, open, selected, onClick, hasChildren}){
  const li = el("li","node");
  const row = el("div","row"+(selected?" selected":"")+(level==="mod"?" lvl-mod":""));
  const caret = el("span","caret"+(hasChildren?(open?" open":""):" leaf"),"▶");
  row.appendChild(caret);
  if(icon) row.appendChild(el("span","ic",icon));
  if(dot) row.appendChild(el("span","dot "+dot));
  row.appendChild(el("span","rowtext",text));
  if(count!=null) row.appendChild(el("span","count",count));
  li.appendChild(row);
  const kids = el("ul","children"+(open?"":" collapsed"));
  li.appendChild(kids);
  row.addEventListener("click",e=>{
    e.stopPropagation();
    if(hasChildren){ kids.classList.toggle("collapsed"); caret.classList.toggle("open"); }
    if(onClick) onClick();
  });
  parentUl.appendChild(li);
  return kids;
}

function renderModuleTree(tree){
  const m = MODULE_TREE;
  const totalCases = m.features.reduce((n,f)=>n+f.scenarios.reduce((k,s)=>k+s.cases.length,0),0);
  const modKids = branch(tree,{level:"mod",icon:"▦",text:m.name,count:totalCases,open:true,hasChildren:true});
  m.features.forEach((f,fi)=>{
    const fCount=f.scenarios.reduce((k,s)=>k+s.cases.length,0);
    const featOpen = true;
    const fCases=f.scenarios.flatMap(s=>s.cases);
    const featKids = branch(modKids,{level:"feat",icon:"◧",text:f.name,count:fCount,
      dot:groupStatus(fCases),open:featOpen,hasChildren:true});
    f.scenarios.forEach((s,si)=>{
      const sel = STATE.modScenario && STATE.modScenario.f===fi && STATE.modScenario.s===si;
      branch(featKids,{level:"scen",icon:"◦",text:s.name,count:s.cases.length,
        dot:groupStatus(s.cases),selected:sel,hasChildren:false,
        onClick:()=>{ STATE.modScenario={f:fi,s:si}; selectModuleScenario(); }});
    });
  });
}

function runCounts(run){
  const c={pass:0,fail:0,block:0,notrun:0};
  run.results.forEach(r=>c[r.s]++);
  return c;
}

  const b2=el("button","btn","Auto-assign failures");
  b2.addEventListener("click",()=>openAutoAssignModal(rel,run));
  ctas.appendChild(b1); ctas.appendChild(b2);
  box.appendChild(ctas);
  return box;
}

/* ---- LIST (management / execution-tracking) ---- */
// Library (module) list is an authoring view — Platform / Release / Assignee
// columns are execution-tracking noise there, so they only show in the
// Releases › Details list where a run's platform actually matters.
function renderList(){
  const content=$("#content"); content.className="content listmode"; content.innerHTML="";
  const showExecCols = STATE.view==="release";

  const tools=el("div","tabletools");
  tools.appendChild(el("div","spacer"));
  tools.appendChild(el("button","btn","Export"));
  content.appendChild(tools);

  const wrap=el("div","tablewrap");
  const table=el("table");
  table.innerHTML=`<thead><tr>
    <th>ID</th><th>Type</th><th>Test case</th><th>Manual / Auto</th>`+
    (showExecCols?`<th>Platform</th><th>Release / Sprint</th><th>Assignee</th>`:``)+
    `<th>Last run</th><th>Status</th>
  </tr></thead>`;
  const tb=el("tbody");

  const rows = listRows();
  rows.forEach(r=>{
    const tr=el("tr");
    tr.style.cursor="pointer";
    tr.addEventListener("click",(ev)=>{
      const trig=ev.target.closest(".rowmenu-trigger");
      if(trig){ ev.stopPropagation(); openRowMenu(trig, r.key, r.runId); return; }
      openDrawer(r.key, r.runId);
    });
    // Status cell: abstain wins over notrun/other; else normal status label.
    // Failed cases get a ⋯ mini-menu (Explain failure / Create defect / Retry).
    const rowMenu = (r.status==="fail")
      ? `<button class="rowmenu-trigger" data-menu-case="${r.key}" title="Actions">⋯</button>` : "";
    const statusCell = r.abstain
      ? `<span class="abstain-pill">Abstain · <span class="qid">${r.abstain.q}</span></span>`
      : `<span class="statuscell ${r.status}"><span class="dot ${r.status}"></span>${STATUS_LABEL[r.status]}${rowMenu}</span>`;
    tr.innerHTML=
      `<td class="id">${r.id}</td>`+
      `<td><span class="ctype cat-${r.category}">${r.category}</span></td>`+
      `<td class="name">${r.title}</td>`+
      `<td><span class="mini ${r.exec}">${r.exec==="auto"?"Auto":"Manual"}</span></td>`+
      (showExecCols
        ? `<td><span class="platcell"><span class="pic">${PLAT_ICON[r.platform]}</span>${r.platform}</span></td>`+
          `<td>${r.release}</td>`+
          `<td><span class="assignee"><span class="avatar">${initials(r.assignee)}</span>${r.assignee}</span></td>`
        : ``)+
      `<td class="${r.lastRun==="—"?"muted":""}">${r.lastRun}</td>`+
      `<td>${statusCell}</td>`;
    tb.appendChild(tr);
  });
  table.appendChild(tb);
  wrap.appendChild(table);
  content.appendChild(wrap);
}

function listRows(){
  // Module (Library) list only — release views build their own row lists.
  const {f,s}=STATE.modScenario;
  const scen=MODULE_TREE.features[f].scenarios[s];
  return scen.cases.map(id=>{
    const tc=CASES[id];
    // find latest run touching this case for status/platform/lastrun
    let latest=null, relId=CASE_RELEASE[id]||"—";
    RELEASES.forEach(rel=>rel.runs.forEach(run=>{
      const hit=run.results.find(x=>x.c===id && x.s!=="notrun");
      if(hit && (!latest || run.lastRun>latest.lastRun)) latest={...hit,platform:run.platform,lastRun:run.lastRun,runId:run.id};
    }));
    return {key:id,runId:latest?latest.runId:null,id:tc.id,category:tc.category,title:tc.title,exec:tc.exec,
      platform:latest?latest.platform:"web",release:relId,assignee:tc.assignee,
      lastRun:tc.abstain?"—":(latest?latest.lastRun:"—"),
      status:tc.abstain?"notrun":(latest?latest.s:"notrun"),
      abstain:tc.abstain||null};
  });
}

/* =========================================================================
   PART C — PRIMARY NAV (Home / Test Cases / Releases) + APP-LEVEL RENDER
   -------------------------------------------------------------------------
   The old Module/Release toggle is gone — grouping is now implied by which
   primary-nav section you're in. Test Cases > Library groups by module;
   Releases > Details groups by release. Test Cases > Insights, Releases >
   Insights, and Home don't need the case tree, so it's hidden for those.
   ========================================================================= */
function updatePrimaryNavActive(){
  document.querySelectorAll(".pnav-item").forEach(b=>{
    b.classList.toggle("active", b.dataset.section===STATE.section);
  });
  document.querySelectorAll(".pnav-subitem").forEach(b=>{
    b.classList.toggle("active", b.dataset.section===STATE.section && b.dataset.sub===STATE.subview);
  });
}

function renderApp(){
  updatePrimaryNavActive();

  // Left tree only shows for Test Cases › Library (module view). The release
  // list/drill-in lives entirely in the main pane now — no second nav.
  const showTree = (STATE.section==="testcases" && STATE.subview==="library");
  const isAtto = STATE.section==="atto";
  const isReleasesDetails = STATE.section==="releases" && STATE.subview==="details";
  const secondNavPresent = showTree || isAtto;

  // AI chat pane: auto-collapse when entering Releases; restore when leaving.
  // "chatAutoCollapsed" remembers we did it so we don't fight a user's explicit choice.
  if(STATE.section==="releases" && !$("#chatPane").classList.contains("collapsed")){
    $("#chatPane").classList.add("collapsed");
    $("#chatReopen").style.display = "";
    STATE.chatAutoCollapsed = true;
  } else if(STATE.section!=="releases" && STATE.chatAutoCollapsed){
    $("#chatPane").classList.remove("collapsed");
    $("#chatReopen").style.display = "none";
    STATE.chatAutoCollapsed = false;
  }

  $("#treeNav").classList.toggle("hidden", !secondNavPresent || STATE.treeCollapsed);
  $("#treeReopen").style.display = (secondNavPresent && STATE.treeCollapsed) ? "" : "none";
  // Main tabs (Detail/List, now Summary/Test Cases inside Releases) only shown
  // for Library, or for the drilled-in release view.
  $("#maintabs").style.display = (showTree || (isReleasesDetails && STATE.releaseId)) ? "" : "none";
  $("#tree").style.display = showTree ? "" : "none";
  $("#chatList").style.display = isAtto ? "" : "none";

  if(showTree){
    STATE.view = "module";
    $("#navheadTitle").textContent = "Module";
    if(!STATE.modScenario) STATE.modScenario={f:0,s:0};
    renderTree();
    render();
  } else if(isAtto){
    $("#navheadTitle").textContent = "Atto AI";
    renderChatList();
    renderAtto();
  } else if(isReleasesDetails){
    STATE.view = "release";
    updateReleasesTabs();
    if(STATE.releaseId){
      renderReleaseDetails();
    } else {
      renderAllReleases();
    }
  } else {
    renderBlankSection();
  }
}

// Swap the tab labels between Module (Detail/List) and Release (Summary/Test Cases),
// and also sync the active-underline to STATE.tab so it doesn't drift when we set the
// tab programmatically (e.g. after clicking a release row or a feature-coverage row).
function updateReleasesTabs(){
  const labels = STATE.section==="releases"
    ? {detail:"Summary", list:"Test Cases"}
    : {detail:"Detail",  list:"List"};
  document.querySelectorAll(".tab").forEach(t=>{
    t.textContent = labels[t.dataset.tab] || t.textContent;
    t.classList.toggle("active", t.dataset.tab===STATE.tab);
  });
}

/* =========================================================================

   Flow: All Releases table  →  click a row  →  drilled release view.

function setReleaseBreadcrumb(){

  bc.style.display="";
  bc.innerHTML=`<button class="rb-link" id="rbBack">All Releases</button>`+
    `<span class="rb-sep">›</span>`+
    `<span class="rb-current">${escapeHtml(rel?rel.id:"")}</span>`;
  bc.querySelector("#rbBack").addEventListener("click",()=>{
    STATE.releaseId=null; STATE.suiteFilter="all"; STATE.featureFilter=null; renderApp();
  });
}

function renderAllReleases(){

  const wrap=el("div","rel-index");
  const table=el("table");
  table.innerHTML=`<thead><tr>

  </tr></thead>`;

  RELEASES.forEach(rel=>{
    const c=relCounts(rel), total=relTotal(rel), pct=relPassRate(rel);
    const suiteNames = rel.runs.map(r=>r.name).join(" · ");
    const g = QUALITY_GATES[rel.id];
    const tr=el("tr");
    tr.innerHTML=
      `<td><div class="r-name">${escapeHtml(rel.name.split("—")[0].trim())}</div>`+
        `<span class="r-sub">${escapeHtml(rel.name.split("—")[1]?rel.name.split("—")[1].trim():"")}</span></td>`+
      `<td class="r-suites">${rel.runs.length} · <span class="muted">${escapeHtml(suiteNames)}</span></td>`+
      `<td>`+
        `<div style="display:flex;align-items:center;gap:10px;">`+
          `<div class="r-bar rate-bar" style="margin-top:0;">`+
            `<span class="s-pass" style="width:${total?c.pass/total*100:0}%"></span>`+
            `<span class="s-fail" style="width:${total?c.fail/total*100:0}%"></span>`+
            `<span class="s-block" style="width:${total?c.block/total*100:0}%"></span>`+
            `<span class="s-notrun" style="width:${total?c.notrun/total*100:0}%"></span>`+
          `</div>`+
          `<span class="r-pct">${pct}%</span>`+
        `</div>`+
      `</td>`+
      `<td><span class="pill ${c.fail?"fail":(c.block?"block":"pass")}"><span class="dot ${c.fail?"fail":(c.block?"block":"pass")}"></span>${c.pass}✓ ${c.fail}✕ ${c.block}▮</span></td>`+
      `<td>${g?`<span class="gate-chip ${g.verdict}">${g.verdictLabel}</span>`:'<span class="muted">—</span>'}</td>`+

    tr.addEventListener("click",()=>{

function renderReleaseDetails(){
  setReleaseBreadcrumb();

/* ---- Release Gate + Quality metrics + Confidence + Recommended tests ----
   Adapted from the "quality insights layer" session's qi-dashboard.html §2
   (Release tab): verdict block, 4-card quality grid, confidence waterfall,
   recommended-tests table. Re-themed to white cards on this design system's
   palette instead of the source's cream/olive theme. */
function releaseGateCard(rel){
  const g = QUALITY_GATES[rel.id]; if(!g) return el("div");
  const box=el("div","rel-card gate-block "+g.verdict);
  const top=el("div","gate-top");
  top.innerHTML=`<span class="gate-pill ${g.verdict}">Release Gate · ${g.verdictLabel}</span>`+
    `<div class="gate-headline">${escapeHtml(g.headline)}</div>`;
  box.appendChild(top);
  const ul=el("ul");
  g.rules.forEach(r=>ul.appendChild(el("li",null,r)));
  box.appendChild(ul);
  box.appendChild(el("div","gate-why",
    `Overall confidence score: <b>${g.confidence} / 100</b> — shown for context. The rules above are the source of truth for the ship decision.`));
  return box;
}

function releaseQualityMetricsCard(rel){
  const g = QUALITY_GATES[rel.id]; if(!g) return el("div");
  const box=el("div","rel-card");
  box.innerHTML=`<div class="rc-title">Quality metrics</div>`;
  const grid=el("div","qm-grid");
  const mk=(k,pillHtml,v,unit,sub)=>{
    const c=el("div","qm-card");
    c.innerHTML=`<div class="qm-k">${k}${pillHtml||""}</div><div class="qm-v">${v}<span class="qm-unit">${unit}</span></div><div class="qm-sub">${sub}</div>`;
    return c;
  };
  grid.appendChild(mk("Coverage · this release", g.coverageThisRelease<70?` <span class="qm-pill warn">Below bar</span>`:"",
    g.coverageThisRelease, "%", g.coverageSub));
  grid.appendChild(mk("Coverage on changed scope", g.coverageChangedCode<60?` <span class="qm-pill crit">Gap</span>`:"",
    g.coverageChangedCode, "%", g.coverageChangedSub));
  grid.appendChild(mk("Pass rate — first vs final", "",
    g.passRateFirst, `% first · ${g.passRateFinal}% final`, g.passRateSub));
  grid.appendChild(mk("Regression suite health", g.suiteTrend==="slowing"?` <span class="qm-pill warn">Slowing</span>`:"",
    g.regressionDuration, "min · full run", g.suiteSub));
  box.appendChild(grid);
  return box;
}

function releaseConfidenceWaterfallCard(rel){
  const g = QUALITY_GATES[rel.id]; if(!g) return el("div");
  const box=el("div","rel-card");
  box.innerHTML=`<div class="rc-title">Confidence — why is it ${g.confidence}? <span class="rc-sub">· scored against ${escapeHtml(g.scoredAgainst)}</span></div>`;
  const wf=el("div","wf");
  g.waterfall.forEach(step=>{
    const barCls = step.cls==="total" ? "wf-bar" : (step.cls==="warn" ? "wf-bar warnbar" : "wf-bar neg");
    const valTxt = step.cls==="total" ? step.val : (step.val>0?"+":"")+step.val;
    const valCls = step.cls==="total" ? "" : "neg";
    const row=el("div","wf-row");
    row.innerHTML=`<div class="wf-lbl">${escapeHtml(step.label)}</div>`+
      `<div class="${barCls}"><b style="width:${step.barPct}%"></b></div>`+
      `<div class="wf-val ${valCls}">${valTxt}</div>`;
    wf.appendChild(row);
  });
  box.appendChild(wf);
  box.appendChild(el("div","foot",`Top action: ${g.topAction}`));
  return box;
}

function releaseRecommendedTestsCard(rel){
  const g = QUALITY_GATES[rel.id]; if(!g || !g.recommendedTests.length) return el("div");
  const box=el("div","rel-card");

}

function releaseTestRunCard(rel){
  const box=el("div","rel-card");
  const c=relCounts(rel), total=relTotal(rel), pct=relPassRate(rel);
  box.innerHTML=`<div class="rc-title">Test run status <span class="rc-sub">· ${total} results across ${rel.runs.length} suite${rel.runs.length===1?"":"s"} · ${pct}% pass</span></div>`;
  // headline counts (no combined bar — per-suite counts + bars below are sufficient)
  const counts=el("div","counts");
  counts.innerHTML=
    `<span class="pill pass"><span class="dot pass"></span>${c.pass} passed</span>`+
    `<span class="pill fail"><span class="dot fail"></span>${c.fail} failed</span>`+
    `<span class="pill block"><span class="dot block"></span>${c.block} blocked</span>`+
    (c.notrun?`<span class="pill notrun"><span class="dot notrun"></span>${c.notrun} not run</span>`:"");
  counts.style.gap="8px"; counts.style.marginLeft="0";
  box.appendChild(counts);
  // per-suite strip
  const strip=el("div","suites-strip");
  rel.runs.forEach(run=>{
    const rc=runCounts(run);
    const rTotal=run.results.length;
    const rPct=rTotal?Math.round(rc.pass/rTotal*100):0;
    const row=el("div","suite-row");
    row.title="Open this suite in Test Cases";
    row.innerHTML=
      `<div class="s-name">${escapeHtml(run.name)}</div>`+
      `<div class="s-meta">${PLAT_ICON[run.platform]} ${run.platform} · ${escapeHtml(run.executedBy)} · ${escapeHtml(run.lastRun)}</div>`+
      `<div class="s-counts"><span>${rc.pass}✓</span><span style="color:var(--fail);">${rc.fail}✕</span><span style="color:var(--block);">${rc.block}▮</span><span style="color:var(--ink-3);">${rc.notrun} nr</span></div>`+
      `<div class="s-bar rate-bar" style="margin-top:0;">`+
        `<span class="s-pass" style="width:${rTotal?rc.pass/rTotal*100:0}%"></span>`+
        `<span class="s-fail" style="width:${rTotal?rc.fail/rTotal*100:0}%"></span>`+
        `<span class="s-block" style="width:${rTotal?rc.block/rTotal*100:0}%"></span>`+
        `<span class="s-notrun" style="width:${rTotal?rc.notrun/rTotal*100:0}%"></span>`+
      `</div>`+
      `<div class="s-pct">${rPct}%</div>`;
    row.addEventListener("click",()=>{
      STATE.tab="list"; STATE.suiteFilter=run.id; STATE.featureFilter=null;
      // sync tab active state

/* ---- Test Cases tab: suite chip filter + aggregated rows ---- */
function renderReleaseTestCases(rel){
  const content=$("#content"); content.className="content listmode"; content.innerHTML="";

  // Suite chip filter + optional feature filter tag
  const chips=el("div","suite-chips");
  chips.appendChild(el("span","sc-lbl","Suite"));
  const mk=(id,label)=>{
    const b=el("button","suite-chip"+(STATE.suiteFilter===id?" active":""),escapeHtml(label));
    b.addEventListener("click",()=>{ STATE.suiteFilter=id; renderReleaseTestCases(rel); });
    return b;
  };
  chips.appendChild(mk("all","All ("+relTotal(rel)+")"));
  rel.runs.forEach(run=>chips.appendChild(mk(run.id, run.name+" ("+run.results.length+")")));
  if(STATE.featureFilter){
    const ff=el("span","feat-filter");
    ff.innerHTML=`Feature: <b>${escapeHtml(STATE.featureFilter)}</b> <button class="ff-x" title="Clear feature filter">✕</button>`;
    ff.querySelector(".ff-x").addEventListener("click",()=>{ STATE.featureFilter=null; renderReleaseTestCases(rel); });
    chips.appendChild(ff);
  }
  content.appendChild(chips);

  // Filter rows by suite + optional feature
  let rows = relRows(rel, STATE.suiteFilter);
  if(STATE.featureFilter){
    const feat=MODULE_TREE.features.find(f=>f.name===STATE.featureFilter);
    const caseIds = feat ? feat.scenarios.flatMap(s=>s.cases) : [];
    rows = rows.filter(r=>caseIds.includes(r.c));
  }

  const showSuiteCol = STATE.suiteFilter==="all";
  const wrap=el("div","tablewrap");
  const table=el("table");
  table.innerHTML=`<thead><tr>
    <th>ID</th><th>Type</th><th>Test case</th>`+
    (showSuiteCol?`<th>Suite</th>`:``)+
    `<th>Manual / Auto</th><th>Platform</th><th>Last run</th><th>Status</th>
  </tr></thead>`;
  const tb=el("tbody");
  rows.forEach(r=>{
    const tc=CASES[r.c]; if(!tc) return;
    const tr=el("tr"); tr.style.cursor="pointer";
    tr.addEventListener("click",(ev)=>{
      const trig=ev.target.closest(".rowmenu-trigger");
      if(trig){ ev.stopPropagation(); openRowMenu(trig, r.c, r.run.id); return; }
      openDrawer(r.c, r.run.id);
    });
    const rowMenu = (r.s==="fail")
      ? `<button class="rowmenu-trigger" data-menu-case="${r.c}" title="Actions">⋯</button>` : "";
    const lastRun = (r.s==="notrun"||tc.abstain) ? "—" : r.run.lastRun;

      ? `<span class="abstain-pill">Abstain · <span class="qid">${tc.abstain.q}</span></span>`
      : `<span class="statuscell ${r.s}"><span class="dot ${r.s}"></span>${STATUS_LABEL[r.s]}${rowMenu}</span>`;
    tr.innerHTML=
      `<td class="id">${tc.id}</td>`+
      `<td><span class="ctype cat-${tc.category}">${tc.category}</span></td>`+
      `<td class="name">${tc.title}</td>`+
      (showSuiteCol?`<td>${escapeHtml(r.run.name)}</td>`:``)+
      `<td><span class="mini ${tc.exec}">${tc.exec==="auto"?"Auto":"Manual"}</span></td>`+
      `<td><span class="platcell"><span class="pic">${PLAT_ICON[r.run.platform]}</span>${r.run.platform}</span></td>`+
      `<td class="${lastRun==="—"?"muted":""}">${lastRun}</td>`+
      `<td>${statusCell}</td>`;
    tb.appendChild(tr);
  });
  if(!rows.length){
    const tr=el("tr");
    tr.innerHTML=`<td colspan="${showSuiteCol?8:7}" class="muted" style="text-align:center;padding:24px;">No cases match this filter.</td>`;
    tb.appendChild(tr);
  }
  table.appendChild(tb);
  wrap.appendChild(table);
  content.appendChild(wrap);
}

function createAttoChat(prompt, sources){
  const drafts = ATTO_MOCK_DRAFTS.map(d=>({...d}));
  const srcLabel = sources.length ? sources[0].split(" ")[1] : null; // e.g. "Figma"
  const chat = {
    id:"ch"+(++ATTO_SEQ),
    title: prompt.length>52 ? prompt.slice(0,51)+"…" : prompt,
    when:"Today", source:srcLabel,
    messages:[
      {role:"user", text:escapeHtml(prompt), src:sources.length?sources.join(" · "):null},
      {role:"bot", text:`I drafted <b>${drafts.length} test cases</b>. Review and add the ones you want to the Library.`, drafts},
    ]
  };
  ATTO_CHATS.unshift(chat);
  STATE.activeChat=chat.id;
  renderApp();
  toast(`Atto drafted ${drafts.length} cases (mock)`);
}

function attoConversationEl(chat){
  const w=el("div","atto-convo");

    if(m.src) html+=`<div class="muted" style="font-size:11px;margin-bottom:4px;">attached: ${escapeHtml(m.src)}</div>`;
    html+=m.text;

      const dl=el("div","atto-draftlist");

/* ---- Releases > Insights landing page (computed from RELEASES/CASES mock data) ---- */
function releaseInsightsEl(){
  const wrap = el("div");
  wrap.appendChild(el("div","insights-head",
    `<h2>Release testing insights</h2><p>Rolled up from the releases and runs tracked in this workspace — recomputed from run data, not a live feed.</p>`));

  let totalResults=0; const agg={pass:0,fail:0,block:0,notrun:0};
  const defects=new Set();
  let totalRuns=0;
  RELEASES.forEach(rel=>rel.runs.forEach(run=>{
    totalRuns++;
    run.results.forEach(r=>{ totalResults++; agg[r.s]++; if(r.d) defects.add(r.d); });
  }));
  const abstainCount = Object.values(CASES).filter(c=>c.abstain).length;
  const overallPassRate = totalResults? Math.round(agg.pass/totalResults*100) : 0;

  const grid=el("div","insight-grid");
  const stat=(label,value,sub)=>{const c=el("div","stat-card");
    c.innerHTML=`<div class="sc-label">${label}</div><div class="sc-value">${value}</div>${sub?`<div class="sc-sub">${sub}</div>`:""}`;
    return c;};
  grid.appendChild(stat("Releases tracked", RELEASES.length, `${totalRuns} runs`));
  grid.appendChild(stat("Overall pass rate", overallPassRate+"%", `${agg.pass} of ${totalResults} results`));
  grid.appendChild(stat("Open defects", defects.size, defects.size?[...defects].slice(0,3).join(", ")+(defects.size>3?"…":""):"none logged"));
  grid.appendChild(stat("Abstained cases", abstainCount, "not runnable — pending product/compliance"));
  wrap.appendChild(grid);

  const tableWrap=el("div","rel-table-wrap");
  tableWrap.appendChild(el("div","rt-head","By release"));
  RELEASES.forEach(rel=>{
    const c={pass:0,fail:0,block:0,notrun:0}; let total=0;
    rel.runs.forEach(run=>run.results.forEach(r=>{c[r.s]++; total++;}));
    const pct = total? Math.round(c.pass/total*100) : 0;
    const row=el("div","rel-row");
    row.innerHTML=
      `<div class="rr-name">${rel.name.split("—")[0].trim()}<span class="rr-sub">${rel.name.split("—")[1]?rel.name.split("—")[1].trim():""} · ${rel.runs.length} run${rel.runs.length===1?"":"s"}</span></div>`+
      `<div class="rr-bar"><div class="rate-bar" style="margin-top:0;">`+
        `<span class="s-pass" style="width:${total?c.pass/total*100:0}%"></span>`+
        `<span class="s-fail" style="width:${total?c.fail/total*100:0}%"></span>`+
        `<span class="s-block" style="width:${total?c.block/total*100:0}%"></span>`+
        `<span class="s-notrun" style="width:${total?c.notrun/total*100:0}%"></span>`+
      `</div></div>`+
      `<div class="rr-pct">${pct}%</div>`+
      `<div class="rr-counts"><span>${c.pass}✓</span><span>${c.fail}✕</span><span>${c.block}▮</span><span>${c.notrun} nr</span></div>`;
    tableWrap.appendChild(row);
  });
  wrap.appendChild(tableWrap);

  const callouts=el("div","callout-row");
  const flakyIds=Object.keys(FLAKY_CASES);
  const co1=el("div","callout");
  co1.innerHTML=`<div class="co-title">⚡ Flaky signal</div><div class="co-body">`+
    (flakyIds.length
      ? flakyIds.map(id=>{const f=FLAKY_CASES[id];return `<b>${id}</b> — passed ${f.passes}/${f.passes+f.fails} across ${f.runs} runs, fails only on ${PLAT_ICON[f.platform]} ${f.platform}.`;}).join("<br>")
      : "No flaky signals detected in the observed runs.")+`</div>`;
  const co2=el("div","callout");
  co2.innerHTML=`<div class="co-title">ⓘ Abstain-blocked cases</div><div class="co-body">`+
    `${abstainCount} case${abstainCount===1?"":"s"} can't be executed against an honest oracle yet — each is tagged with the product/compliance question blocking it. See Test Cases › Library for detail.</div>`;
  callouts.appendChild(co1); callouts.appendChild(co2);
  wrap.appendChild(callouts);

  return wrap;
}

function openDrawer(caseId, runId){
  const tc=CASES[caseId]; if(!tc) return;
  const hist=caseHistory(caseId);
  // status shown in header = the run the row came from, else worst rollup
  let ctx = runId ? hist.find(h=>h.run.id===runId) : null;
  const headStatus = ctx ? ctx.status : caseRollupStatus(caseId);

  const d=$("#drawer");
  d.innerHTML="";

  // header
  const head=el("div","drawer-head");
  const idrow=el("div","dh-idrow");
  idrow.innerHTML=`<span class="cid">${tc.id}</span>`+
    `<span class="ctype cat-${tc.category}">${tc.category}</span>`+
    `<span class="mini ${tc.exec}">${tc.exec==="auto"?"Auto":"Manual"}</span>`+
    `<span class="lifecycle lc-${tc.lifecycle}">${LIFECYCLE_LABEL[tc.lifecycle]}</span>`;
  const closeBtn=el("button","drawer-close","✕");
  closeBtn.addEventListener("click",closeDrawer);
  idrow.appendChild(closeBtn);
  head.appendChild(idrow);
  const titleRow=el("div","dh-title");
  const statusHtml = tc.abstain
    ? `<span class="abstain-pill">Abstain · <span class="qid">${tc.abstain.q}</span></span>`
    : `<span class="statuscell ${headStatus}"><span class="dot ${headStatus}"></span>${STATUS_LABEL[headStatus]}</span>`;
  titleRow.innerHTML=`<span>${tc.title}</span>${statusHtml}`;
  head.appendChild(titleRow);
  d.appendChild(head);

  const body=el("div","drawer-body");

  // meta grid
  const meta=el("div","drawer-meta");
  const mk=(k,v)=>`<div class="dm-item"><div class="dm-k">${k}</div><div class="dm-v">${v}</div></div>`;
  meta.innerHTML=
    mk("Category",`<span class="ctype cat-${tc.category}">${tc.category}</span>`)+
    mk("Technique",`<span class="mono">${tc.technique}</span>`)+
    mk("Priority",`<span class="prio prio-${tc.priority}">${tc.priority}</span>`)+
    mk("Assignee",`<span class="assignee"><span class="avatar">${initials(tc.assignee)}</span>${tc.assignee}</span>`)+
    mk("Platform (last)",`${ctx?PLAT_ICON[ctx.run.platform]+" "+ctx.run.platform:"—"}`)+
    mk("Release / Sprint",CASE_RELEASE[caseId]||"—")+
    mk("Requirement",`<span class="tracelink">${tc.req}</span>`)+
    mk("Last updated",tc.updated)+
    mk("Author",tc.author)+
    mk("Data variation",tc.dv?`<span class="mono">${tc.dv}</span>`:'<span class="muted">—</span>')+
    `<div class="dm-item" style="grid-column:1 / -1;"><div class="dm-k">Traces</div><div class="dm-v" style="margin-top:6px;">${traceTagsHtml(tc.traces)}</div></div>`+
    `<div class="dm-item oracle-row"><div class="dm-k">Expected oracle</div><div class="dm-v">${tc.oracle||"—"}</div></div>`;
  body.appendChild(meta);

  if(tc.abstain){
    body.appendChild(abstainBannerEl(tc));
    body.appendChild(el("div","abstain-note","This case is not runnable until the question is resolved."));
  } else {
    // steps
    const sb=el("div","drawer-sec");
    sb.appendChild(el("div","lbl","Steps &amp; expected"));
    const ol=el("ol","steps");
    tc.steps.forEach(st=>ol.appendChild(el("li",null,`${st.a} <span class="exp">${st.e}</span>`)));
    sb.appendChild(ol); body.appendChild(sb);

    // test data
    const db=el("div","drawer-sec");
    db.appendChild(el("div","lbl","Test data"));
    const chips=el("div","chips");
    tc.data.forEach(x=>chips.appendChild(el("span","chip",`<span class="k">${x.k}</span><span class="v">${x.v}</span>`)));
    db.appendChild(chips); body.appendChild(db);
  }

  // execution history
  const eh=el("div","drawer-sec");
  eh.appendChild(el("div","lbl",`Execution history · ${hist.filter(h=>h.status!=="notrun").length} runs`));
  if(!hist.length){
    eh.appendChild(el("div","muted","Never scheduled in a run."));
  } else {
    const t=el("table","exec-history");
    // Status + Defect first (triage essentials, always visible); build/env/date scroll.
    t.innerHTML=`<thead><tr><th>Status</th><th>Defect</th><th>Run</th><th>Release</th><th>Platform</th><th>Build</th><th>Env</th><th>Date</th></tr></thead>`;
    const tb=el("tbody");
    hist.forEach(h=>{
      const cur = runId && h.run.id===runId;
      const tr=el("tr",cur?"cur":null);
      tr.innerHTML=
        `<td><span class="statuscell ${h.status}"><span class="dot ${h.status}"></span>${STATUS_LABEL[h.status]}</span></td>`+

        `<td>${h.run.env}</td>`+
        `<td class="muted">${h.run.lastRun}</td>`;
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    const wrap=el("div","exec-wrap"); wrap.appendChild(t); eh.appendChild(wrap);
  }
  body.appendChild(eh);

  // AI insights strip (Part B)
  body.appendChild(buildInsightsStrip(caseId, hist));

  d.appendChild(body);

  // show
  $("#drawerBackdrop").classList.add("show");
  d.classList.add("open");
  d.setAttribute("aria-hidden","false");
}

// -------------- Insight computation --------------
function buildInsightsStrip(caseId, hist){
  const tc = CASES[caseId];
  const wrap = el("div","drawer-sec ai-insights");
  wrap.appendChild(el("div","lbl","⚡ Insights"));
  const insights = computeInsights(caseId, tc, hist);
  if(!insights.length){
    const empty=el("div","insight");
    empty.innerHTML=`<div class="insight-body">No signals yet — not enough runs to draw a conclusion.</div>`;
    wrap.appendChild(empty);
    return wrap;
  }
  insights.forEach(ins=>wrap.appendChild(renderInsight(ins, caseId)));
  return wrap;
}

function computeInsights(caseId, tc, hist){
  const out=[];
  // 1) Flaky signal
  if(FLAKY_CASES[caseId]){
    const f=FLAKY_CASES[caseId];
    out.push({
      type:"flaky", title:"Flaky signal", prov:"measured", conf:"●●●○",
      body:`passed ${f.passes} / failed ${f.fails} across ${f.runs} runs, fails only on ${PLAT_ICON[f.platform]} ${f.platform} → likely env, not a product bug`,
      evidence:`evidence: ${f.evidence.join(", ")}`,
      actions:[
        {label:"Mark flaky", handler:()=>openConfirmModal({
          title:"Mark case flaky",
          body:`Mark <b>${tc.id}</b> as flaky? The row will surface a flaky badge and be excluded from group health rollups.`,
          accept:"Mark flaky", onAccept:()=>toast(`Marked ${tc.id} flaky (mock)`)
        })},
        {label:"Open defect", handler:()=>openConfirmModal({
          title:"Open defect for flaky signal",
          body:`Draft a defect linking runs <span class="mono">${f.evidence.join(", ")}</span> and platform <b>${f.platform}</b>?`,
          accept:"Open defect", onAccept:()=>toast(`Defect drafted (mock)`)
        })},
      ]
    });
  }
  // 2) Learn from bug — latest fail with a defect resolved
  const failWithBug = hist.find(h=>h.status==="fail" && h.defect && RESOLVED_BUGS[h.defect]);
  if(failWithBug){
    const rb = RESOLVED_BUGS[failWithBug.defect];
    const oracleChange = rb.changes.find(c=>c.kind==="oracle");
    out.push({
      type:"learn", title:"Learn from bug", prov:"proxy", conf:"●●○○",
      body:`${failWithBug.defect} (resolved) touched this area — the expected oracle here looks stale.`+
        (oracleChange?` Proposed: <span class="old">${escapeHtml(short(oracleChange.old))}</span> → <span class="new">${escapeHtml(short(oracleChange.neu))}</span>`:""),
      actions:[
        {label:"Review change", handler:()=>openChangeSetModal(failWithBug.defect)},
        {label:"Dismiss", handler:()=>toast("Insight dismissed (mock)")},
      ]
    });
  }
  // 3) Coverage — never executed on some platform this release
  const platsRun = new Set(hist.filter(h=>h.status!=="notrun").map(h=>h.run.platform));
  const missing = ["web","mobile"].filter(p=>!platsRun.has(p));
  if(missing.length && !tc.abstain){
    const plat = missing[0];
    out.push({
      type:"coverage", title:"Coverage", prov:"measured", conf:"",
      body:`never run on ${PLAT_ICON[plat]} ${plat} in the observed releases.`,
      actions:[
        {label:`Add to next ${plat} run`, handler:()=>openConfirmModal({
          title:`Add ${tc.id} to next ${plat} run`,
          body:`Schedule <b>${tc.id}</b> for the next ${plat} run? (Applies on next execution.)`,
          accept:"Schedule", onAccept:()=>toast(`Scheduled ${tc.id} for next ${plat} run (mock)`)
        })},
      ]
    });
  }
  // 4) Abstain-blocker
  if(tc.abstain){
    out.push({
      type:"abstain-blocker", title:"Abstain-blocker", prov:"abstained", conf:"",
      body:`Blocked by <b>${tc.abstain.q}</b>: ${escapeHtml(tc.abstain.reason)}`,
      actions:[
        {label:"Draft question to product/compliance", handler:()=>openConfirmModal({
          title:`Draft question ${tc.abstain.q}`,
          body:`Draft an email to product/compliance asking:<br><i>${escapeHtml(tc.abstain.reason)}</i>`,
          accept:"Draft", onAccept:()=>toast("Question drafted (mock)")
        })},
      ]
    });
  }
  // 5) Priority suggestion — Abstain when only 1 executed run of history.
  const executedRuns = hist.filter(h=>h.status!=="notrun").length;
  if(executedRuns===1 && !tc.abstain){
    out.push({
      type:"priority-abstain", title:"Priority suggestion", prov:"abstained", conf:"",
      body:`ⓘ Abstain — only 1 run of history, not enough signal to recommend a change.`,
      actions:[]
    });
  }
  return out;
}

function short(s,n=64){ if(!s) return ""; return s.length>n?s.slice(0,n-1)+"…":s; }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

function renderInsight(ins, caseId){
  const row=el("div","insight");
  const head=el("div","insight-head");
  head.innerHTML=`<span class="ih-title">▸ ${ins.title}</span>`+
    (ins.conf?`<span class="ih-conf">confidence ${ins.conf}</span>`:"")+
    `<span class="prov ${ins.prov}">${ins.prov}</span>`;
  row.appendChild(head);
  const body=el("div","insight-body"); body.innerHTML=ins.body;
  if(ins.evidence){ body.innerHTML += `<div class="evid">${escapeHtml(ins.evidence)}</div>`; }
  row.appendChild(body);
  if(ins.actions && ins.actions.length){
    const acts=el("div","insight-actions");
    ins.actions.forEach(a=>{
      const b=el("button","btn",a.label);
      b.addEventListener("click",e=>{e.stopPropagation();a.handler();});
      acts.appendChild(b);
    });
    row.appendChild(acts);
  }
  return row;
}
