<!doctype html>
<html><head><meta charset="utf-8"><title>S0 Pretotype — report viewer (per-app, per-run)</title>
<style>
  body{font:13px/1.5 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif;margin:18px;color:#111;max-width:1150px}
  h1{font-size:17px}h2{font-size:14px;margin:18px 0 4px;border-bottom:2px solid #eee;padding-bottom:3px}h3{font-size:13px;margin:12px 0 4px}
  .ok{color:#137333}.bad{color:#c5221f;font-weight:bold}.warn{color:#b06000}
  table{border-collapse:collapse;margin:6px 0;width:100%}td,th{border:1px solid #ddd;padding:4px 7px;font-size:12px;text-align:left;vertical-align:top}
  .PASS_HEALED{color:#137333;font-weight:bold}.FALSE_HEAL{color:#c5221f;font-weight:bold}.ABSTAIN{color:#b06000;font-weight:bold}
  .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700;background:#fff3e0;color:#b06000}
  ul{margin:4px 0 4px 18px}li{margin:2px 0}small{color:#777}
  #bar{position:sticky;top:0;background:#fff;padding:8px 0;border-bottom:1px solid #ddd;z-index:5;display:flex;gap:10px;align-items:center}
  select{font:13px ui-sans-serif;padding:5px 8px;border:1px solid #bbb;border-radius:6px}
  .app{font-weight:700;font-size:15px}
</style></head>
<body>
<h1>S0 Pretotype — report viewer</h1>
<div id="bar">
  <label>Run: <select id="pick"></select></label>
  <span id="meta"></span>
  <button id="clear" style="margin-left:auto;font-size:11px">clear all runs</button>
</div>
<div id="status"></div>
<div id="out"></div>

<script src="../../selfheal-core.js"></script>
<script src="../pipeline/candidate-generation.js"></script>
<script src="../pipeline/change-diagnosis.js"></script>
<script src="../pipeline/failure-reporter.js"></script>
<script src="generic-report.js"></script>
<script>
(function(){
  const KEY='selfheal_runs';
  const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const load=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } };
  const save=r=>localStorage.setItem(KEY, JSON.stringify(r));
  const qs=new URLSearchParams(location.search);
  const status=document.getElementById('status'), out=document.getElementById('out'), pick=document.getElementById('pick'), meta=document.getElementById('meta');

  // ---- CAPTURE mode: ?capture=1&app=NAME — read window.name DOM, compute, store a run ----
  if(qs.get('capture')==='1'){
    const app=qs.get('app')||'App'; const html=window.name||'';
    if(html.length<2000){ status.innerHTML='<b class="bad">No DOM in window.name ('+html.length+'B). Stash from the app tab first.</b>'; }
    else { try{
      const report=window.__GEN.run(html);
      const runs=load(); const attempt=runs.filter(r=>r.app===app).length+1;
      runs.push({ id:app+'-'+attempt+'-'+Date.now(), app, attempt, ts:new Date().toLocaleString(), bytes:html.length, report });
      save(runs); status.innerHTML='<b class="ok">stored '+esc(app)+' attempt #'+attempt+'.</b>';
      window.name=''; // free the big DOM
    }catch(e){ status.innerHTML='<b class="bad">ERR: '+esc(e&&e.stack||e)+'</b>'; } }
  }

  // ---- VIEWER ----
  function renderReport(run){
    const R=run.report, pe=R.preExec, ex=R.execute, s=ex.summary;
    let h='<p class="app">'+esc(run.app)+' <small>· attempt #'+run.attempt+' · '+esc(run.ts)+' · '+R.bytes.toLocaleString()+' bytes · '+R.elementCount+' controls</small></p>';
    h+='<h2>PRE-EXECUTION — recording / authoring + locating</h2>';
    h+='<h3>1 · Test cases auto-authored ('+pe.testCount+')</h3>';
    h+='<p><small>coverage: '+pe.coverage.identifiable+' identifiable · '+pe.coverage.nameless+' nameless (skipped) · '+pe.coverage.capped+' over cap (not covered)</small></p><ul>';
    pe.autoTests.slice(0,30).forEach(t=>{ h+='<li><b>'+t.id+'</b> '+esc(t.name)+' <small>['+t.tier+', '+t.predicted+'%]</small></li>'; }); h+='</ul>';
    h+='<h3>2 · Elements identified ('+R.elementCount+') <small>first 30</small></h3>';
    h+='<table><tr><th>#</th><th>role</th><th>name</th><th>test-id</th><th>anchor tier</th><th>flag</th><th>robustness</th></tr>';
    pe.elementsIdentified.slice(0,30).forEach(e=>{ h+='<tr><td>'+e.oracle+'</td><td>'+esc(e.role)+'</td><td>'+esc(e.name||'<i>—nameless—</i>')+'</td><td>'+esc(e.testid||'—')+'</td><td>'+e.tier+'</td><td class="'+(e.flag?'warn':'')+'">'+(e.flag||'—')+'</td><td>'+e.predicted+'%</td></tr>'; }); h+='</table>';
    h+='<h3>3 · Predicted test → element matches</h3>';
    h+='<table><tr><th>test</th><th>control</th><th>anchor</th><th>robustness</th></tr>';
    pe.autoTests.slice(0,30).forEach(t=>{ h+='<tr><td>'+t.id+'</td><td>'+esc(t.name.replace(/^Interact: /,''))+'</td><td>'+t.tier+'</td><td>'+t.predicted+'%</td></tr>'; }); h+='</table>';
    h+='<h3>4 · Honest dev take (redteam of 1–3)</h3><ul>'; pe.devTake.forEach(d=>{ h+='<li>'+esc(d)+'</li>'; }); h+='</ul>';
    h+='<h2>EXECUTE <small>(drift-simulated: restyle + localize per control)</small></h2>';
    h+='<p><b>Self-heal rate: '+s.selfHealPct+'%</b> ('+s.healed+'/'+s.healEligible+' drifted locators re-located) · '+
       '<span class="ok">healed '+s.passed+'</span> · <span class="warn">abstain '+s.abstain+'</span> · false-heal <b class="'+(s.falseHeal?'bad':'ok')+'">'+s.falseHeal+'</b> over '+s.driftRuns+' drift-runs</p>';
    h+='<p><b>Root-cause split:</b> <span class="pill">authoring '+s.rootCauseSplit.authoring+'</span> <span class="pill">element '+s.rootCauseSplit.element+'</span> <span class="pill">other '+s.rootCauseSplit.other+'</span></p>';
    h+='<table><tr><th>test</th><th>control</th><th>drift</th><th>status</th><th>reason</th><th>prescription</th></tr>';
    ex.results.slice(0,80).forEach(r=>{ h+='<tr><td>'+r.test+'</td><td>'+esc(r.name||'')+'</td><td>'+r.drift+'</td><td class="'+r.status+'">'+r.status+'</td><td><small>'+esc(r.reason)+'</small></td><td><small>'+esc(r.prescription)+'</small></td></tr>'; }); h+='</table>';
    out.innerHTML=h;
  }

  function refresh(selectId){
    const runs=load();
    if(!runs.length){ pick.innerHTML='<option>— no runs yet —</option>'; out.innerHTML='<p><small>Capture a run via <code>?capture=1&app=NAME</code> with the app DOM in window.name.</small></p>'; meta.textContent=''; return; }
    // newest first
    runs.sort((a,b)=>b.id.split('-').pop()-a.id.split('-').pop());
    pick.innerHTML=runs.map(r=>'<option value="'+r.id+'">'+esc(r.app)+' · attempt #'+r.attempt+' · '+esc(r.ts)+'</option>').join('');
    const sel=selectId&&runs.find(r=>r.id===selectId)||runs[0];
    pick.value=sel.id; meta.innerHTML='<small>'+runs.length+' run(s) stored</small>';
    renderReport(sel);
  }
  pick.addEventListener('change',()=>{ const r=load().find(x=>x.id===pick.value); if(r) renderReport(r); });
  document.getElementById('clear').addEventListener('click',()=>{ if(confirm('Clear all stored runs?')){ localStorage.removeItem(KEY); refresh(); } });
  refresh(load().slice(-1)[0] && load().slice(-1)[0].id);
})();
</script>
</body></html>
