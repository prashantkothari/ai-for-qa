<!doctype html>
<html><head><meta charset="utf-8"><title>S0 Pretotype — REAL app report (Amplitude via window.name)</title>
<style>
  body{font:13px/1.5 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif;margin:18px;color:#111;max-width:1100px}
  h1{font-size:17px}h2{font-size:14px;margin:18px 0 4px;border-bottom:2px solid #eee;padding-bottom:3px}h3{font-size:13px;margin:12px 0 4px}
  .ok{color:#137333}.bad{color:#c5221f;font-weight:bold}.warn{color:#b06000}
  table{border-collapse:collapse;margin:6px 0;width:100%}td,th{border:1px solid #ddd;padding:4px 7px;font-size:12px;text-align:left;vertical-align:top}
  .PASS,.PASS_HEALED{color:#137333;font-weight:bold}.FAILED{color:#c5221f;font-weight:bold}.ABSTAIN{color:#b06000;font-weight:bold}
  .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700}
  .AUTHORING{background:#e8eaf6;color:#3949ab}.ELEMENT{background:#fff3e0;color:#b06000}.OTHER{background:#eceff1;color:#546e7a}
  ul{margin:4px 0 4px 18px}li{margin:2px 0}small{color:#777}
  pre{background:#f6f6f6;padding:8px;white-space:pre-wrap;max-height:30vh;overflow:auto;font-size:11px}
</style></head>
<body>
<h1>S0 Pretotype — report on a REAL app DOM</h1>
<div id="status">loading…</div>
<div id="out"></div>
<script src="../../selfheal-core.js"></script>
<script src="../pipeline/candidate-generation.js"></script>
<script src="../pipeline/change-diagnosis.js"></script>
<script src="../pipeline/failure-reporter.js"></script>
<script src="amplitude-report.js"></script>
<script>
(function(){
  const status=document.getElementById('status'), out=document.getElementById('out');
  const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const html=window.name||'';
  if(html.length<2000){ status.innerHTML='<b class="bad">No captured DOM in window.name ('+html.length+' bytes). Stash it from the app tab first.</b>'; return; }
  let R; try{ R=window.__AMP.run(html); window.__AMP_REPORT=R; }catch(e){ window.__AMP_ERR=String(e&&e.stack||e); status.innerHTML='<b class="bad">ERR: '+esc(e&&e.stack||e)+'</b>'; return; }
  const pe=R.preExec, ex=R.execute;
  let h='';
  h+='<p><small>captured '+R.bytes.toLocaleString()+' bytes · '+pe.elementCount+' interactive elements</small></p>';

  h+='<h2>PRE-EXECUTION — recording / authoring + locating</h2>';
  h+='<h3>1 · Test cases authored for this screen</h3><ul>';
  pe.authoredTests.forEach(t=>{ h+='<li><b>'+t.id+'</b> '+esc(t.name)+' <small>['+t.steps.join(' → ')+']</small></li>'; }); h+='</ul>';

  h+='<h3>2 · Elements identified ('+pe.elementCount+') <small>showing first 25</small></h3>';
  h+='<table><tr><th>#</th><th>role</th><th>name</th><th>test-id</th><th>anchor tier</th><th>flag</th><th>predicted robustness</th></tr>';
  pe.elementsIdentified.slice(0,25).forEach(e=>{ h+='<tr><td>'+e.oracle+'</td><td>'+esc(e.role)+'</td><td>'+esc(e.name||'<i>—nameless—</i>')+'</td><td>'+esc(e.testid||'—')+'</td><td>'+e.tier+'</td><td class="'+(e.flag?'warn':'')+'">'+(e.flag||'—')+'</td><td>'+e.predicted+'%</td></tr>'; });
  h+='</table>';

  h+='<h3>3 · Predicted test-case → element matches</h3>';
  h+='<table><tr><th>test</th><th>intent</th><th>grounded?</th><th>matched element</th><th>tier</th><th>predicted</th></tr>';
  pe.matches.forEach(m=>{ h+='<tr><td>'+m.test+'</td><td>'+esc(m.intent)+'</td><td class="'+(m.grounded?'ok':'bad')+'">'+(m.grounded?'YES':'NO')+'</td><td>'+esc(m.grounded?(m.matchedName||('['+m.oracle+']')):'—')+'</td><td>'+(m.tier||'—')+'</td><td>'+(m.predicted!=null?m.predicted+'%':'—')+'</td></tr>'; });
  h+='</table>';

  h+='<h3>4 · Honest dev take (redteam of 1–3)</h3><ul>';
  pe.devTake.forEach(d=>{ h+='<li>'+esc(d)+'</li>'; }); h+='</ul>';

  h+='<h2>EXECUTE</h2>';
  const s=ex.summary;
  h+='<p><b>Status:</b> <span class="ok">PASS '+s.passed+'</span> · <span class="bad">FAILED '+s.failed+'</span> · <span class="warn">ABSTAIN '+s.abstain+'</span> · false-heal <b class="'+(s.falseHeal?'bad':'ok')+'">'+s.falseHeal+'</b></p>';
  h+='<p><b>Self-heal rate:</b> '+s.selfHealPct+'% ('+s.healed+'/'+s.healEligible+' drifted locators re-located correctly)</p>';
  h+='<p><b>Root-cause split:</b> <span class="pill AUTHORING">authoring '+(s.rootCauseSplit.AUTHORING||0)+'</span> <span class="pill ELEMENT">element '+(s.rootCauseSplit.ELEMENT||0)+'</span> <span class="pill OTHER">other '+(s.rootCauseSplit.OTHER||0)+'</span></p>';
  h+='<table><tr><th>test</th><th>drift</th><th>status</th><th>root-cause bucket</th><th>reason</th><th>prescription / heal</th></tr>';
  ex.results.forEach(r=>{ h+='<tr><td>'+r.test+' '+esc(r.name)+'</td><td>'+r.drift+'</td><td class="'+r.status+'">'+r.status+(r.via?(' ·'+r.via):'')+'</td><td><span class="pill '+r.bucket+'">'+r.bucket.toLowerCase()+'</span></td><td><small>'+esc(r.reason)+'</small></td><td><small>'+esc(r.prescription)+(r.healed?(' <b class="ok">(self-healed)</b>'):'')+'</small></td></tr>'; });
  h+='</table>';

  out.innerHTML=h;
  status.innerHTML='<b class="ok">report ready.</b> window.__AMP_REPORT';
})();
</script>
</body></html>
