<!doctype html>
<html><head><meta charset="utf-8"><title>QA Agent — panel (P1)</title>
<meta http-equiv="Cache-Control" content="no-store">
<link rel="stylesheet" href="panel.css?v=14">
</head><body>
<div class="layout">
  <div class="stage-wrap">
    <h2>Host app (fixture)</h2>
    <div id="appStage"></div>
    <div id="overlay"><span class="lbl" id="overlayLbl"></span></div>
    <div class="mut" style="margin-top:6px" id="stageInfo">contact-form fixture · pristine</div>
  </div>
  <div class="panel">
    <div class="panel-head"><b>QA AGENT · PLUGIN</b><span id="statusLine" class="mut" style="color:#bbb">idle</span></div>
    <div class="tabs">
      <div class="tab active" data-tab="chat">chat</div>
      <div class="tab" data-tab="review">review</div>
      <div class="tab" data-tab="runs">runs</div>
      <div class="tab" data-tab="report">report</div>
      <div class="tab" data-tab="safety">safety</div>
    </div>
    <div class="tab-body" id="tab-chat">
      <div class="chat-log" id="chatLog">
        <div class="chat-msg agent"><div class="who">AGENT</div>Try: <code>author a test for this form</code> · <code>run</code> · <code>report</code></div>
      </div>
      <div class="chat-input">
        <select id="appSelect" class="btn" title="Which fixture to author/run against">
          <option value="fixture:contact">Contact form</option>
          <option value="fixture:orders">Orders table</option>
          <option value="fixture:nav">Dashboard nav</option>
        </select>
        <input id="chatInput" placeholder="message agent…"><button class="btn btn-primary" id="chatSend">send</button>
      </div>
    </div>
    <div class="tab-body hide" id="tab-review"></div>
    <div class="tab-body hide" id="tab-runs"></div>
    <div class="tab-body hide" id="tab-report"></div>
    <div class="tab-body hide" id="tab-safety"></div>
  </div>
</div>

<script src="../benchmark/corpus.js?v=14"></script>
<script src="../benchmark/eval-gate.js?v=14"></script>

</body></html>
